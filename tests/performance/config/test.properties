# JMeter Test Configuration Properties
# These properties can be overridden via command line with -Jproperty=value

# Target Environment
# Local dev stack (default)
host=127.0.0.1
port=18088
protocol=http

# AWS Learner Lab (uncomment for AWS testing)
# host=scroogebank-crm-dev-alb-XXXXXXXXXX.ap-southeast-1.elb.amazonaws.com
# port=80
# protocol=http

# Thread Configuration
# Baseline: 1 thread, no ramp-up
# Concurrent: 100 threads, 60s ramp-up
# Stress: 200 threads, 120s ramp-up
threads=100
rampup=60
loops=10

# Test Duration
# duration=300  # Optional: test duration in seconds (overrides loops)

# Reporting
# jmeter.save.saveservice.output_format=csv
# jmeter.save.saveservice.response_data=false
# jmeter.save.saveservice.samplerData=false
# jmeter.save.saveservice.requestHeaders=false
# jmeter.save.saveservice.url=true
# jmeter.save.saveservice.responseHeaders=false
