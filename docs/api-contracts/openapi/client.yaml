openapi: 3.0.3
info:
  title: client
  version: 0.3.1
  description: 'Feature 2: Client Profile Management and Account Management.

    Users can only access their own clients; admins can access all clients.

    Audit events are published to the log API contract, which is Lambda-backed in local/CI and deployed infrastructure.'
servers:
- url: http://localhost
  description: Local / ingress base URL.
tags:
- name: health
- name: clients
- name: accounts
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: client}
                required: [status]
  /api/v1/health:
    get:
      deprecated: true
      tags: [health]
      summary: (Deprecated) Health check
      responses: {'200': {description: OK}}
  /api/v1/clients/health:
    get:
      deprecated: true
      tags: [health]
      summary: (Deprecated) Clients route health check
      responses: {'200': {description: OK}}
  /api/clients:
    get:
      tags: [clients]
      summary: List clients
      description: Admins see all clients. Users see only clients assigned to them.
      security: [{BearerAuth: []}]
      x-required-roles: [admin, user]
      parameters:
      - {name: limit, in: query, description: Requested page size. Values outside 1..200 are clamped by the service., schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: offset, in: query, description: Requested start offset. Negative values are clamped to 0 by the service., schema: {type: integer, minimum: 0, default: 0}}
      - {name: q, in: query, schema: {type: string, description: Optional search query (name/email/phone).}}
      responses:
        '200':
          description: List of clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Client'}
                  pagination: {$ref: '#/components/schemas/Pagination'}
                required: [data]
        '400':
          description: Validation error (for example malformed query parameter types).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401':
          description: Unauthorized
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Forbidden
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      tags: [clients]
      summary: Create client profile
      description: Creates a client profile. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientCreateRequest'}
      responses:
        '201':
          description: Client created.
          content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}
        '400':
          description: Validation error.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Conflict (e.g., email/phone already exists).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Verification email dispatch unavailable; client is not created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401':
          description: Unauthorized
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Forbidden
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/clients/count:
    get:
      tags: [clients]
      summary: Count clients assigned to a specific agent
      description: Returns the number of non-deleted clients assigned to the provided user/agent id.
      security: [{BearerAuth: []}]
      x-required-roles: [admin, user]
      parameters:
      - {name: assignedUserId, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Count result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientCountResponse'}
        '400':
          description: Validation error.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401':
          description: Unauthorized
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Forbidden
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/clients/reassign:
    post:
      tags: [clients]
      summary: Reassign clients between agents
      description: Moves all non-deleted clients from one assigned user to another.
      security: [{BearerAuth: []}]
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReassignRequest'}
      responses:
        '200':
          description: Reassignment result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReassignResponse'}
        '400':
          description: Validation error.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401':
          description: Unauthorized
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Forbidden
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Conflict (for example duplicate or invalid reassignment state).
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/clients/{clientId}:
    get:
      tags: [clients]
      summary: Get client profile
      description: Retrieves client information. A log entry should be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      responses:
        '200': {description: Client found., content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '400': {description: Validation error (for example invalid clientId format)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    put:
      tags: [clients]
      summary: Update client information
      description: Updates client information. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientUpdateRequest'}
      responses:
        '200': {description: Client updated., content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: 'Conflict (e.g., email/phone already exists).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      tags: [clients]
      summary: Delete client profile
      description: Deletes a client profile. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      responses:
        '204': {description: Client deleted.}
        '400': {description: Validation error (for example invalid clientId format)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/clients/{clientId}/upload-verify:
    post:
      tags: [clients]
      summary: Upload verification documents
      description: Public tokenized upload endpoint. Token is delivered to the browser in the URL fragment (`#token=...`) and must be one-time and short-lived. Valid upload sets status to `pending` for admin review.
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 160}, description: Optional replay-protection key for duplicate browser submissions.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadVerificationDocsRequest'}
      responses:
        '200': {description: Verification status updated., content: {application/json: {schema: {$ref: '#/components/schemas/VerifyClientResponse'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflict (duplicate submission or verification already submitted/reviewed)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '429': {description: Too many requests., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/clients/{clientId}/verify/review:
    patch:
      tags: [clients]
      summary: Review pending verification
      description: Admin-only review action for a pending verification (`approve` or `reject`).
      security: [{BearerAuth: []}]
      x-required-roles: [admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewVerificationRequest'}
      responses:
        '200': {description: Verification review applied., content: {application/json: {schema: {$ref: '#/components/schemas/VerifyClientResponse'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden (caller is not admin)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflict (verification is not pending)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/clients/{clientId}/verify/resend:
    post:
      tags: [clients]
      summary: Resend verification link
      description: Sends a fresh verification email link for a non-verified client. Allowed for authenticated agent/admin roles with access to the client.
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      responses:
        '200': {description: Verification link re-sent., content: {application/json: {schema: {$ref: '#/components/schemas/VerifyClientResponse'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflict (client already verified)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/clients/{clientId}/verify/documents/{documentKind}:
    get:
      tags: [clients]
      summary: Get uploaded verification document
      description: Returns uploaded KYC document content for authenticated admin/agent review.
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      - {name: documentKind, in: path, required: true, schema: {type: string, enum: [primary, address]}}
      responses:
        '200': {description: Verification document payload., content: {application/json: {schema: {$ref: '#/components/schemas/VerificationDocumentResponse'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflict (document not available)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/accounts:
    post:
      tags: [accounts]
      summary: Create account
      description: Creates an account for a client. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCreateRequest'}
      responses:
        '201': {description: Account created., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Client not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/account-opening-options:
    get:
      tags: [accounts]
      summary: Get account opening options
      description: Returns server-side branch and currency options for account opening for the authenticated user and client.
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: query, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      responses:
        '200': {description: Account opening options., content: {application/json: {schema: {$ref: '#/components/schemas/AccountOpeningOptions'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Client not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/accounts/{accountId}:
    get:
      tags: [accounts]
      summary: Get account by ID
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: accountId, in: path, required: true, schema: {$ref: '#/components/schemas/AccountId'}}
      responses:
        '200': {description: Account found., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: Validation error (for example invalid accountId format)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    put:
      tags: [accounts]
      summary: Update account
      description: Updates account type, status, or branch. Only changed fields are applied. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: accountId, in: path, required: true, schema: {$ref: '#/components/schemas/AccountId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdateRequest'}
      responses:
        '200': {description: Account updated., content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        '400': {description: Validation error., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      tags: [accounts]
      summary: Delete account
      description: Deletes an account. A log entry must be recorded (Feature 3).
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: accountId, in: path, required: true, schema: {$ref: '#/components/schemas/AccountId'}}
      responses:
        '204': {description: Account deleted.}
        '400': {description: Validation error (for example invalid accountId format)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/clients/{clientId}/accounts:
    get:
      tags: [accounts]
      summary: List accounts for a client
      security: [{BearerAuth: []}]
      x-required-roles: [user, admin]
      parameters:
      - {name: clientId, in: path, required: true, schema: {$ref: '#/components/schemas/ClientId'}}
      - {name: limit, in: query, description: Requested page size. Values outside 1..200 are clamped by the service., schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: offset, in: query, description: Requested start offset. Negative values are clamped to 0 by the service., schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Accounts for client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Account'}
                  pagination: {$ref: '#/components/schemas/Pagination'}
                required: [data]
        '400': {description: Validation error (for example invalid clientId or malformed query parameters)., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Client not found., content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT access token minted via an OAuth 2.0 provider (e.g.,
        Cognito). Each request must be authenticated and authorized (Zero Trust).
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: {type: string, example: validation_error}
        message: {type: string, example: Invalid request}
        requestId: {type: string, example: 7f1d2c3b-0c44-4ce9-a7ed-4c0c0c8edc1d}
      required: [error, message]
    Pagination:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}
        offset: {type: integer, minimum: 0, default: 0}
        total: {type: integer, minimum: 0}
    ClientId:
      type: string
      description: System-generated unique, non-editable client identifier.
      example: clt_42
    AccountId:
      type: string
      description: System-generated account identifier.
      example: acc_42
    Gender:
      type: string
      enum: [Male, Female, Non-binary, Prefer not to say]
    IdentityVerificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
      default: unverified
    AccountType:
      type: string
      enum: [Savings, Checking, Business]
    AccountStatus:
      type: string
      enum: [Active, Inactive, Pending]
    ClientCountResponse:
      type: object
      properties:
        count: {type: integer, format: int64, minimum: 0}
      required: [count]
      additionalProperties: false
    ReassignRequest:
      type: object
      properties:
        fromUserId: {type: string, minLength: 1}
        toUserId: {type: string, minLength: 1}
      required: [fromUserId, toUserId]
      additionalProperties: false
    ReassignResponse:
      type: object
      properties:
        count: {type: integer, minimum: 0}
      required: [count]
      additionalProperties: false
    Client:
      type: object
      properties:
        clientId: {$ref: '#/components/schemas/ClientId'}
        firstName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        lastName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        dateOfBirth: {type: string, format: date, description: Must be in the past; age 18-100.}
        gender: {$ref: '#/components/schemas/Gender'}
        emailAddress: {type: string, format: email}
        phoneNumber: {type: string, pattern: '^\+\d{10,15}$', example: '+6591234567'}
        address: {type: string, minLength: 5, maxLength: 100}
        city: {type: string, minLength: 2, maxLength: 50}
        state: {type: string, minLength: 2, maxLength: 50}
        country: {type: string, minLength: 2, maxLength: 50, example: Singapore}
        postalCode: {type: string, minLength: 4, maxLength: 10}
        identityVerificationStatus: {$ref: '#/components/schemas/IdentityVerificationStatus'}
        assignedUserId:
          type: string
          description: User ID of the user responsible for this client. Set by system from token; users see only their own clients.
          readOnly: true
        primaryDocumentType:
          type: string
          nullable: true
          readOnly: true
          description: Stored primary identity document type.
        primaryDocumentRef:
          type: string
          nullable: true
          readOnly: true
          description: Stored reference for primary identity document.
        addressDocumentType:
          type: string
          nullable: true
          readOnly: true
          description: Stored proof-of-address document type.
        addressDocumentRef:
          type: string
          nullable: true
          readOnly: true
          description: Stored reference for proof-of-address document.
        verificationVerifiedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Timestamp set when verification is approved.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required:
      - clientId
      - firstName
      - lastName
      - dateOfBirth
      - gender
      - emailAddress
      - phoneNumber
      - address
      - city
      - state
      - country
      - postalCode
      - identityVerificationStatus
    ClientCreateRequest:
      type: object
      properties:
        firstName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        lastName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        dateOfBirth: {type: string, format: date, description: Must be in the past; age 18-100.}
        gender: {$ref: '#/components/schemas/Gender'}
        emailAddress: {type: string, format: email}
        phoneNumber: {type: string, pattern: '^\+\d{10,15}$', example: '+6591234567'}
        address: {type: string, minLength: 5, maxLength: 100}
        city: {type: string, minLength: 2, maxLength: 50}
        state: {type: string, minLength: 2, maxLength: 50}
        country: {type: string, minLength: 2, maxLength: 50, example: Singapore}
        postalCode: {type: string, minLength: 4, maxLength: 10}
      required: [firstName, lastName, dateOfBirth, gender, emailAddress, phoneNumber, address, city, state, country, postalCode]
      additionalProperties: false
    ClientUpdateRequest:
      type: object
      properties:
        firstName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        lastName: {type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z ]+$'}
        dateOfBirth: {type: string, format: date, description: Must be in the past; age 18-100.}
        gender: {$ref: '#/components/schemas/Gender'}
        emailAddress: {type: string, format: email}
        phoneNumber: {type: string, pattern: '^\+\d{10,15}$', example: '+6591234567'}
        address: {type: string, minLength: 5, maxLength: 100}
        city: {type: string, minLength: 2, maxLength: 50}
        state: {type: string, minLength: 2, maxLength: 50}
        country: {type: string, minLength: 2, maxLength: 50}
        postalCode: {type: string, minLength: 4, maxLength: 10}
      additionalProperties: false
    UploadVerificationDocsRequest:
      type: object
      properties:
        verificationToken:
          type: string
          maxLength: 4096
          pattern: '^[A-Za-z0-9._-]+$'
          description: "Signed token received from verification email link (short-lived, one-time)."
        primaryDocumentType: {type: string, enum: [NRIC, PASSPORT, EMPLOYMENT_PASS]}
        primaryDocumentRef: {type: string, maxLength: 120, pattern: '^[A-Za-z0-9._-]+$', description: Original filename for primary identity document.}
        primaryDocumentBase64: {type: string, maxLength: 7000000, pattern: '^[A-Za-z0-9+/]+={0,2}$', description: Base64-encoded primary identity document bytes.}
        primaryDocumentMimeType: {type: string, enum: [image/jpeg, image/png, application/pdf], description: MIME type for primary identity document.}
        addressDocumentType: {type: string, enum: [UTILITY_BILL, BANK_STATEMENT, GOVERNMENT_LETTER, TENANCY_AGREEMENT]}
        addressDocumentRef: {type: string, maxLength: 120, pattern: '^[A-Za-z0-9._-]+$', description: Original filename for proof-of-address document.}
        addressDocumentBase64: {type: string, maxLength: 7000000, pattern: '^[A-Za-z0-9+/]+={0,2}$', description: Base64-encoded proof-of-address document bytes.}
        addressDocumentMimeType: {type: string, enum: [image/jpeg, image/png, application/pdf], description: MIME type for proof-of-address document.}
      required: [verificationToken, primaryDocumentType, primaryDocumentRef, primaryDocumentBase64, primaryDocumentMimeType, addressDocumentType, addressDocumentRef, addressDocumentBase64, addressDocumentMimeType]
      additionalProperties: false
    VerifyClientResponse:
      type: object
      properties:
        clientId: {$ref: '#/components/schemas/ClientId'}
        identityVerificationStatus: {$ref: '#/components/schemas/IdentityVerificationStatus'}
      required: [clientId, identityVerificationStatus]
    ReviewVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [approve, reject]
      required: [action]
    VerificationDocumentResponse:
      type: object
      properties:
        clientId: {$ref: '#/components/schemas/ClientId'}
        documentKind: {type: string, enum: [primary, address]}
        documentType:
          type: string
          nullable: true
          description: Document category/type as captured at upload.
        documentRef:
          type: string
          description: Stored S3 reference key.
        mimeType:
          type: string
          description: MIME type for the returned document bytes.
        documentBase64:
          type: string
          description: Base64-encoded document content for preview/download.
      required: [clientId, documentKind, documentRef, mimeType, documentBase64]
    Account:
      type: object
      properties:
        accountId: {$ref: '#/components/schemas/AccountId'}
        clientId: {$ref: '#/components/schemas/ClientId'}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        openingDate: {type: string, format: date}
        initialDeposit: {type: number, minimum: 0, example: 5000}
        currency: {type: string, example: SGD}
        branchId: {type: string, example: UBS-SG-001}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [accountId, clientId, accountType, accountStatus, openingDate, initialDeposit, currency, branchId]
    AccountCreateRequest:
      type: object
      properties:
        clientId: {$ref: '#/components/schemas/ClientId'}
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        openingDate: {type: string, format: date}
        initialDeposit: {type: number, minimum: 0}
        currency: {type: string, example: SGD, pattern: '^[A-Z]{3}$'}
        branchId: {type: string, pattern: '^[A-Za-z0-9-]{2,40}$'}
      required: [clientId, accountType, accountStatus, openingDate, initialDeposit, currency, branchId]
      additionalProperties: false
    AccountUpdateRequest:
      type: object
      description: Partial update for an account. All fields are optional; only provided fields are applied.
      properties:
        accountType: {$ref: '#/components/schemas/AccountType'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        branchId: {type: string, example: UBS-SG-002, pattern: '^[A-Za-z0-9-]{2,40}$'}
      additionalProperties: false
    AccountOpeningOptions:
      type: object
      properties:
        clientId: {$ref: '#/components/schemas/ClientId'}
        defaultBranchId: {type: string, example: SG-001}
        canOverrideBranch: {type: boolean}
        authorizedBranches:
          type: array
          items: {type: string, example: SG-001}
        allowedCurrencies:
          type: array
          items: {type: string, example: SGD}
        branchAllowedCurrencies:
          type: object
          additionalProperties:
            type: array
            items: {type: string, example: SGD}
        accountTypeAllowedCurrencies:
          type: object
          additionalProperties:
            type: array
            items: {type: string, example: SGD}
      required: [clientId, defaultBranchId, canOverrideBranch, authorizedBranches, allowedCurrencies, branchAllowedCurrencies, accountTypeAllowedCurrencies]
  responses: {}
