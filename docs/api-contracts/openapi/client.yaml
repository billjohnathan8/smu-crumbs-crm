openapi: 3.0.3
info:
  title: client-service
  version: 0.1.0
servers:
  - url: http://localhost
    description: Local ingress endpoint.
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Service health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: string
              example: '{ "status": "ok" }'
  /api/v1/clients/health:
    get:
      tags:
        - health
      summary: Clients route health check
      responses:
        "200":
          description: Clients route is healthy.
          content:
            application/json:
              schema:
                type: string
              example: '{ "status": "ok" }'
  /api/v1/clients:
    get:
      tags:
        - clients
      summary: List clients
      responses:
        "200":
          description: List of clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      tags:
        - clients
      summary: Create client
      description: Creates a client and attempts to publish an audit event to log-service over HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "201":
          description: Client created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or phone number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/clients/{id}:
    get:
      tags:
        - clients
      summary: Get client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Client found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - clients
      summary: Update client
      description: Updates a client and attempts to publish an audit event to log-service over HTTP.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: Client updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or phone number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - clients
      summary: Delete client
      description: Deletes a client and optionally publishes an audit event.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDeleteRequest"
      responses:
        "204":
          description: Client deleted.
        "404":
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Client:
      type: object
      description: Client profile details.
      properties:
        clientId:
          type: integer
          format: int64
          readOnly: true
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: "^[A-Za-z ]+$"
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: "^[A-Za-z ]+$"
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - Male
            - Female
            - Non-binary
            - Prefer not to say
        emailAddress:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: "^\\+?[0-9]{10,15}$"
        address:
          type: string
          minLength: 5
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 50
        state:
          type: string
          minLength: 2
          maxLength: 50
        country:
          type: string
          minLength: 2
          maxLength: 50
        postalCode:
          type: string
          minLength: 4
          maxLength: 10
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - emailAddress
        - phoneNumber
        - address
        - city
        - state
        - country
        - postalCode
    ClientCreateRequest:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"
        agentId:
          type: string
          description: Identifier of the agent performing the action (logging context).
      required:
        - client
    ClientUpdateRequest:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"
        agentId:
          type: string
          description: Identifier of the agent performing the action (logging context).
      required:
        - client
    ClientDeleteRequest:
      type: object
      properties:
        agentId:
          type: string
          description: Identifier of the agent performing the action (logging context).
    ErrorResponse:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
