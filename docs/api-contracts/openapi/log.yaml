openapi: 3.0.3
info:
  title: log
  version: 1.0.1
  description: |
    Feature 3: Logging of User Interactions and Client Communications.

    Provides CRUD for audit logs of client profile actions (Create/Read/Update/Delete),
    and APIs to create client communications (email) and query communication status.

    Appendix 2 (Log attributes) requires:
    - CRUD
    - Attribute name
    - Before Value
    - After Value
    - User ID
    - Client ID
    - DateTime (ISO 8601)

    Deployment note:
    - Endpoint shapes are runtime-independent.
    - Local/CI topology serves this contract through LocalStack API Gateway -> Lambda.
    - Infrastructure topology serves this contract through API Gateway -> Lambda.
    - Validation failures (body/query/path) return HTTP 400 with ErrorResponse.
servers:
  - url: http://localhost
    description: Local gateway/ingress base URL (deployment-specific upstream).
tags:
  - name: health
  - name: logs
  - name: aml-alerts
  - name: communications

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: log }
                required: [status]
        "503":
          description: Service dependency unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/health:
    get:
      deprecated: true
      tags: [health]
      summary: (Deprecated) Health check
      responses:
        "200": { description: OK }

  /api/v1/logs/health:
    get:
      deprecated: true
      tags: [health]
      summary: (Deprecated) Logs route health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: log }
                required: [status]
        "503":
          description: Service dependency unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/logs:
    get:
      tags: [logs]
      summary: List logs
      description: |
        Lists audit logs. Admins can view all logs. Users can view logs for their own client activities.
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: limit
          in: query
          description: Requested page size. Values outside 1..200 are clamped by the service.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: Requested start offset. Negative values are clamped to 0 by the service.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: clientId
          in: query
          schema: { $ref: "#/components/schemas/ClientId" }
        - name: userId
          in: query
          schema: { $ref: "#/components/schemas/UserId" }
        - name: action
          in: query
          schema: { $ref: "#/components/schemas/LogAction" }
        - name: from
          in: query
          description: ISO 8601 start datetime (inclusive)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: ISO 8601 end datetime (exclusive)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: List of logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                required: [data]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [logs]
      summary: Create log entry
      description: |
        Creates an audit log entry for a client action.
        Typically called internally by other services (client-service, users-service, transaction-service).
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLogRequest" }
      responses:
        "201":
          description: Log entry created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/logs/{logId}:
    get:
      tags: [logs]
      summary: Get log entry by ID
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: logId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LogId" }
      responses:
        "200":
          description: Log entry found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [logs]
      summary: Update log entry
      description: |
        Updates an existing log entry. In most audit systems logs are immutable; if you choose immutability,
        implement this endpoint as restricted or no-op (but keep it for contract compliance).
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin]
      parameters:
        - name: logId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LogId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLogRequest" }
      responses:
        "200":
          description: Log entry updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [logs]
      summary: Delete log entry
      description: |
        Deletes a log entry. In most audit systems logs are immutable; if you choose immutability,
        implement as restricted (admin-only) or soft-delete.
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin]
      parameters:
        - name: logId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LogId" }
      responses:
        "204":
          description: Log entry deleted.
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/clients/{clientId}/logs:
    get:
      tags: [logs]
      summary: List logs for a specific client
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ClientId" }
        - name: limit
          in: query
          description: Requested page size. Values outside 1..200 are clamped by the service.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: Requested start offset. Negative values are clamped to 0 by the service.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: List of logs for client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                required: [data]
        "404":
          description: Client not found (optional if you validate client existence).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/aml/alerts:
    post:
      tags: [aml-alerts]
      summary: Create AML alert
      description: |
        Persists an AML alert generated by the AML batch engine.
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAmlAlertRequest" }
      responses:
        "201":
          description: AML alert created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmlAlert" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Duplicate alert id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [aml-alerts]
      summary: List AML alerts
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: limit
          in: query
          description: Requested page size. Values outside 1..200 are clamped by the service.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: Requested start offset. Negative values are clamped to 0 by the service.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: clientId
          in: query
          schema: { $ref: "#/components/schemas/ClientId" }
        - name: alertType
          in: query
          schema: { $ref: "#/components/schemas/AmlAlertType" }
        - name: reviewStatus
          in: query
          schema: { $ref: "#/components/schemas/AmlReviewStatus" }
      responses:
        "200":
          description: List of AML alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AmlAlert" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                required: [data]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/aml/alerts/{alertId}:
    get:
      tags: [aml-alerts]
      summary: Get AML alert by id
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: AML alert found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmlAlert" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/aml/alerts/{alertId}/review:
    put:
      tags: [aml-alerts]
      summary: Update AML alert review status
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAmlAlertReviewRequest" }
      responses:
        "200":
          description: AML alert updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmlAlert" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/communications:
    post:
      tags: [communications]
      summary: Create communication
      description: |
        Creates a client communication (email) request.
        Used by other services when notifying clients (e.g., after profile changes).
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommunicationRequest" }
      responses:
        "202":
          description: Communication accepted for processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Communication" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/communications/queued:
    get:
      tags: [communications]
      summary: List queued communications due for dispatch
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Queued communications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Communication" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                required: [data]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/communications/{communicationId}:
    get:
      tags: [communications]
      summary: Get communication status
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: communicationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CommunicationId" }
      responses:
        "200":
          description: Communication found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Communication" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/communications/{communicationId}/status:
    patch:
      tags: [communications]
      summary: Update communication delivery status
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin]
      parameters:
        - name: communicationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CommunicationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommunicationStatusRequest" }
      responses:
        "200":
          description: Updated communication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Communication" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/communications/provider/{providerMessageId}/status:
    patch:
      tags: [communications]
      summary: Update communication status by provider message id
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, service]
      parameters:
        - name: providerMessageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommunicationStatusRequest" }
      responses:
        "200":
          description: Updated communication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Communication" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/clients/{clientId}/communications:
    get:
      tags: [communications]
      summary: List communications for a client
      security: [{ BearerAuth: [] }]
      x-required-roles: [admin, user]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ClientId" }
        - name: limit
          in: query
          description: Requested page size. Values outside 1..200 are clamped by the service.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          description: Requested start offset. Negative values are clamped to 0 by the service.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: List of communications for client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Communication" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                required: [data]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT access token minted via an OAuth 2.0 provider. Each request must be authenticated and authorized (Zero Trust).

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string, example: validation_error }
        message: { type: string, example: "Invalid request" }
        requestId: { type: string, example: 7f1d2c3b-0c44-4ce9-a7ed-4c0c0c8edc1d }
      required: [error, message]

    Pagination:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
        offset: { type: integer, minimum: 0, default: 0 }
        total: { type: integer, minimum: 0 }

    LogId:
      type: string
      description: System-generated unique log identifier.
      example: log_42

    ClientId:
      type: string
      description: Unique identifier for each client (auto-generated).
      example: clt_01HZY9T3W4D7Y4W7ZB2X7MZ8QK

    UserId:
      type: string
      description: Unique identifier for the user.
      example: usr_01HZY9T3W4D7Y4W7ZB2X7MZ8QK

    LogAction:
      type: string
      description: CRUD action for audit purposes.
      enum: [CREATE, READ, UPDATE, DELETE, COMMUNICATION]

    LogEntry:
      type: object
      description: |
        Audit log entry for client actions.

        Appendix 2: Attribute name, before value, after value, user id, client id, datetime (ISO 8601).
      properties:
        logId: { $ref: "#/components/schemas/LogId" }
        action: { $ref: "#/components/schemas/LogAction" }
        attributeName:
          type: string
          description: |
            "First Name|Address" etc.
            For Create/Read/Delete, store Client ID. For Update, store the attribute name.
          example: First Name
        beforeValue:
          type: string
          nullable: true
          description: Example "LEE|ABC"
          example: LEE
        afterValue:
          type: string
          nullable: true
          description: Example "TAN|XX"
          example: TAN
        userId: { $ref: "#/components/schemas/UserId" }
        clientId: { $ref: "#/components/schemas/ClientId" }
        dateTime:
          type: string
          format: date-time
          description: ISO 8601 datetime of action
          example: "2026-02-04T12:34:56Z"
        correlationId:
          type: string
          nullable: true
          description: Optional correlation/request id for tracing across services.
          example: 7f1d2c3b-0c44-4ce9-a7ed-4c0c0c8edc1d
      required: [logId, action, attributeName, userId, clientId, dateTime]

    CreateLogRequest:
      type: object
      properties:
        action: { $ref: "#/components/schemas/LogAction" }
        attributeName:
          type: string
          minLength: 1
          maxLength: 100
        beforeValue:
          type: string
          nullable: true
          maxLength: 2000
        afterValue:
          type: string
          nullable: true
          maxLength: 2000
        userId: { $ref: "#/components/schemas/UserId" }
        clientId: { $ref: "#/components/schemas/ClientId" }
        dateTime:
          type: string
          format: date-time
          description: ISO 8601 datetime. If omitted, service sets server time.
        correlationId:
          type: string
          nullable: true
      required: [action, attributeName, userId, clientId]
      additionalProperties: false

    UpdateLogRequest:
      type: object
      properties:
        attributeName:
          type: string
          minLength: 1
          maxLength: 100
        beforeValue:
          type: string
          nullable: true
          maxLength: 2000
        afterValue:
          type: string
          nullable: true
          maxLength: 2000
        dateTime:
          type: string
          format: date-time
      additionalProperties: false

    CommunicationId:
      type: string
      description: System-generated unique communication identifier.
      example: com_42

    CommunicationChannel:
      type: string
      enum: [email]
      default: email

    CommunicationStatus:
      type: string
      enum: [queued, sent, failed]
      default: queued

    Communication:
      type: object
      properties:
        communicationId: { $ref: "#/components/schemas/CommunicationId" }
        clientId: { $ref: "#/components/schemas/ClientId" }
        userId: { $ref: "#/components/schemas/UserId" }
        channel: { $ref: "#/components/schemas/CommunicationChannel" }
        toEmail:
          type: string
          format: email
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          example: client@example.com
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 20000
        status: { $ref: "#/components/schemas/CommunicationStatus" }
        providerMessageId:
          type: string
          nullable: true
          description: Optional message id returned by email provider.
        errorMessage:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
        retryCount:
          type: integer
          minimum: 0
          default: 0
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveryEvent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [communicationId, clientId, userId, channel, toEmail, subject, body, status]

    CreateCommunicationRequest:
      type: object
      properties:
        clientId: { $ref: "#/components/schemas/ClientId" }
        userId:
          $ref: "#/components/schemas/UserId"
          description: |
            User initiating the communication. In production this should be derived from the bearer token,
            but is accepted here for service-to-service calls.
        toEmail:
          type: string
          format: email
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 20000
        channel:
          $ref: "#/components/schemas/CommunicationChannel"
        idempotencyKey:
          type: string
          maxLength: 160
      required: [clientId, userId, toEmail, subject, body]
      additionalProperties: false

    UpdateCommunicationStatusRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/CommunicationStatus" }
        providerMessageId:
          type: string
          maxLength: 200
          nullable: true
        errorMessage:
          type: string
          maxLength: 2000
          nullable: true
        retryCount:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveryEvent:
          type: string
          maxLength: 80
          nullable: true
      additionalProperties: false

    AmlAlertType:
      type: string
      enum: [STATISTICAL_OUTLIER, STRUCTURING, PASSTHROUGH, INCEPTION_SPIKE]

    AmlReviewStatus:
      type: string
      enum: [Pending, Confirmed, Dismissed]
      default: Pending

    AmlAlert:
      type: object
      properties:
        alertId:
          type: string
          example: aml_01HZY9T3W4D7Y4W7ZB2X7MZ8QK
        clientId: { $ref: "#/components/schemas/ClientId" }
        transactionId:
          type: string
          nullable: true
          example: txn_01HZY9T3W4D7Y4W7ZB2X7MZ8QK
        alertType: { $ref: "#/components/schemas/AmlAlertType" }
        description:
          type: string
          maxLength: 2000
        detectedAt:
          type: string
          format: date-time
        reviewStatus: { $ref: "#/components/schemas/AmlReviewStatus" }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - alertId
        - clientId
        - alertType
        - description
        - detectedAt
        - reviewStatus
        - createdAt
        - updatedAt

    CreateAmlAlertRequest:
      type: object
      additionalProperties: false
      properties:
        alertId:
          type: string
          minLength: 1
          maxLength: 64
        clientId: { $ref: "#/components/schemas/ClientId" }
        transactionId:
          type: string
          nullable: true
          maxLength: 255
        alertType: { $ref: "#/components/schemas/AmlAlertType" }
        description:
          type: string
          minLength: 1
          maxLength: 2000
        detectedAt:
          type: string
          format: date-time
        reviewStatus: { $ref: "#/components/schemas/AmlReviewStatus" }
      required:
        - alertId
        - clientId
        - alertType
        - description
        - detectedAt

    UpdateAmlAlertReviewRequest:
      type: object
      additionalProperties: false
      properties:
        reviewStatus: { $ref: "#/components/schemas/AmlReviewStatus" }
      required: [reviewStatus]
