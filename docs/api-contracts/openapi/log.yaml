openapi: 3.0.3
info:
  title: log-service
  version: 1.0.0
servers:
  - url: http://localhost
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/logs/health:
    get:
      tags: [health]
      summary: Health check under logs prefix
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/logs:
    post:
      tags: [logs]
      summary: Ingest a log event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEventRequest"
      responses:
        "201":
          description: Log event persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventResponse"
        "500":
          description: Failed to persist log event.
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    LogEventRequest:
      type: object
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 120
        action:
          type: string
          minLength: 1
          maxLength: 40
        entityType:
          type: string
          minLength: 1
          maxLength: 60
        entityId:
          type: integer
          format: int64
          nullable: true
        agentId:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          nullable: true
        occurredAt:
          type: string
          format: date-time
      required:
        - source
        - action
        - entityType
    LogEventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
      required: [id]