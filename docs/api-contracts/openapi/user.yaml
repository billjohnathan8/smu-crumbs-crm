openapi: 3.0.3
info:
  title: user-service
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: string
              example: '{ "status": "ok" }'
  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/v1/users/health:
    get:
      tags: [health]
      summary: Users route health check
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: string
              example: '{ "status": "ok" }'
components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
      required: [userId, firstName, lastName, email, role]