openapi: 3.0.3
info:
  title: user
  version: 0.0.1-SNAPSHOT
  description: |
    User service API surface extracted from the repository.
    TODO: Confirm which deployment path is active (Lambda handler vs Spring MVC controller).
servers:
  - url: http://localhost:8080
    description: Local Spring Boot default (server.port not set; defaults to 8080).
  - url: TODO
    description: TODO: Add API Gateway/ALB URL for Lambda deployment (path mapping not found in repo).
tags:
  - name: health
    description: Service health checks.
  - name: users
    description: User CRUD operations (Spring MVC controller; file notes say it is unused).
  - name: lambda
    description: Lambda operation endpoint (handler routes by request body "operation").
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      description: Health check implemented in Lambda handler.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /:
    post:
      tags: [lambda]
      summary: Lambda user operation
      description: |
        Handler accepts a JSON body with an "operation" field and optional "userId"/"user".
        TODO: API Gateway route path not found; handler only special-cases /api/v1/health and otherwise ignores the path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOperationRequest"
      responses:
        "200":
          description: Successful read/list/update.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - type: array
                    items:
                      $ref: "#/components/schemas/User"
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "204":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags: [users]
      summary: List users
      description: |
        Returns all users.
        TODO: Controller file is marked unused in code; verify if Spring MVC deployment is active.
        TODO: If Spring Security is active, requires ADMIN role (see SecurityConfig.java and UserController.java).
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [users]
      summary: Create a user
      description: |
        Creates a user in Cognito.
        TODO: Controller file is marked unused in code; verify if Spring MVC deployment is active.
        TODO: If Spring Security is active, requires ADMIN role (see SecurityConfig.java and UserController.java).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already exists.
          content:
            application/json:
              schema:
                type: string

  /users/{id}:
    get:
      tags: [users]
      summary: Get user by ID
      description: |
        Returns a single user.
        TODO: Controller file is marked unused in code; verify if Spring MVC deployment is active.
        TODO: If Spring Security is active, requires ADMIN role (see SecurityConfig.java and UserController.java).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found.
    put:
      tags: [users]
      summary: Update user by ID
      description: |
        Updates user attributes.
        TODO: Controller file is marked unused in code; verify if Spring MVC deployment is active.
        TODO: If Spring Security is active, requires ADMIN role (see SecurityConfig.java and UserController.java).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found.
    delete:
      tags: [users]
      summary: Delete user by ID
      description: |
        Deletes a user.
        TODO: Controller file is marked unused in code; verify if Spring MVC deployment is active.
        TODO: If Spring Security is active, requires ADMIN role (see SecurityConfig.java and UserController.java).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted.
        "404":
          description: User not found.

components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: "^[A-Za-z ]+$"
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: "^[A-Za-z ]+$"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
      required: [firstName, lastName, email, role]
    UserRole:
      type: string
      enum: [ADMIN, AGENT]
    UserOperationRequest:
      type: object
      description: |
        Lambda handler input wrapper. For API Gateway, this is the JSON in the request body.
        TODO: Confirm routing/path mapping in API Gateway configuration.
      properties:
        operation:
          type: string
          description: Operation name.
          enum: [CREATE, READUSER, LIST, UPDATE, DELETE]
        userId:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [operation]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ErrorResponse:
      type: object
      description: |
        Error payload emitted by the Lambda handler.
        TODO: Spring MVC controller returns plain strings or empty bodies for errors; align error shape if used.
      properties:
        error:
          type: string
      required: [error]
