name: CD - Terraform Infra Apply & Deploy
# Apply a reviewed production Terraform plan by commit SHA and force deploy.

on:
  workflow_dispatch:
    inputs:
      reviewed_commit_sha:
        description: Full 40-character commit SHA for the reviewed Terraform plan
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: cd-tf-infra-apply-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-apply:
    name: Terraform apply (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ecs_cluster_name: ${{ steps.deploy_values.outputs.ecs_cluster_name }}
      cloudfront_distribution_id: ${{ steps.deploy_values.outputs.cloudfront_distribution_id }}

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}
      APP_DOMAIN_NAME: ${{ vars.TF_APP_DOMAIN_NAME }}

    steps:
      - name: Validate apply input and GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_ROOT_ADMIN_PASSWORD_SECRET: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          TF_JWT_HMAC_SECRET_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.reviewed_commit_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "reviewed_commit_sha must be a full 40-character commit SHA"; exit 1; }
          test -n "${AWS_REGION}" || { echo "Missing required GitHub Actions variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "Missing required GitHub Actions variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "Missing required GitHub Actions variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "Missing required secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "Missing required secret: AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${TF_ROOT_ADMIN_PASSWORD_SECRET:-}" || { echo "Missing required secret: TF_ROOT_ADMIN_PASSWORD"; exit 1; }
          test -n "${TF_JWT_HMAC_SECRET_SECRET:-}" || { echo "Missing required secret: TF_JWT_HMAC_SECRET"; exit 1; }
        
      - name: Locate reviewed plan run and artifacts
        id: reviewed_plan
        uses: actions/github-script@v7
        with:
          script: |
            const sha = `${{ inputs.reviewed_commit_sha }}`.trim();
            const binaryArtifact = `${sha}_tf_plan.binary`;
            const textArtifact = `${sha}_tf_plan.txt`;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-tf-infra-plan.yml',
              head_sha: sha,
              status: 'completed',
              per_page: 100,
            });

            const successfulRun = runs.data.workflow_runs.find((run) => run.conclusion === 'success');
            if (!successfulRun) {
              core.setFailed(`No successful plan workflow run found for commit ${sha}. Run cd-tf-infra-plan first.`);
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: successfulRun.id,
              per_page: 100,
            });

            const artifactNames = new Set(
              artifacts.data.artifacts
                .filter((artifact) => !artifact.expired)
                .map((artifact) => artifact.name)
            );

            if (!artifactNames.has(binaryArtifact) || !artifactNames.has(textArtifact)) {
              core.setFailed(
                `The successful plan run for commit ${sha} is missing required artifacts ${binaryArtifact} and/or ${textArtifact}.`
              );
              return;
            }

            core.setOutput('plan_run_id', String(successfulRun.id));
            core.setOutput('plan_run_url', successfulRun.html_url);
            core.setOutput('binary_artifact_name', binaryArtifact);
            core.setOutput('text_artifact_name', textArtifact);

      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit_sha }}

      - name: Verify checked out commit
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${{ inputs.reviewed_commit_sha }}" ]] || { echo "Checked out commit ${ACTUAL_SHA} does not match requested ${{ inputs.reviewed_commit_sha }}"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture apply metadata
        id: apply_meta
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo "account_id=${ACCOUNT_ID}"
            echo "output_artifact_name=${{ inputs.reviewed_commit_sha }}_tf_output.json"
            echo "snapshot_artifact_name=${{ inputs.reviewed_commit_sha }}_tf_output.snapshot"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Terraform prod configuration contract
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_FILE="env/prod.backend.hcl"
          TFVARS_FILE="env/prod.tfvars"

          BACKEND_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          TFVARS_REGION="$(awk -F= '/^[[:space:]]*aws_region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${TFVARS_FILE}")"
          VERIFICATION_ENABLED="$(awk -F= '/^[[:space:]]*enable_verification_pipeline[[:space:]]*=/{value=$2; sub(/#.*/, "", value); gsub(/[[:space:]]/, "", value); print tolower(value); exit}' "${TFVARS_FILE}")"

          [[ "${BACKEND_BUCKET}" == "${TF_STATE_BUCKET}" ]] || { echo "prod.backend.hcl bucket (${BACKEND_BUCKET}) does not match vars.TF_STATE_BUCKET (${TF_STATE_BUCKET})"; exit 1; }
          [[ "${BACKEND_REGION}" == "${AWS_REGION}" ]] || { echo "prod.backend.hcl region (${BACKEND_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }
          [[ "${BACKEND_LOCK_TABLE}" == "${TF_LOCK_DYNAMODB}" ]] || { echo "prod.backend.hcl dynamodb_table (${BACKEND_LOCK_TABLE}) does not match vars.TF_LOCK_DYNAMODB (${TF_LOCK_DYNAMODB})"; exit 1; }
          [[ -z "${TFVARS_REGION}" || "${TFVARS_REGION}" == "${AWS_REGION}" ]] || { echo "prod.tfvars aws_region (${TFVARS_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }

          if [[ "${VERIFICATION_ENABLED}" == "true" && -z "${APP_DOMAIN_NAME}" ]]; then
            echo "Production verification is enabled in env/prod.tfvars, but vars.APP_DOMAIN_NAME is not set."
            exit 1
          fi

      - name: Create runtime Terraform override file
        working-directory: ${{ env.TF_DIR }}
        env:
          ROOT_ADMIN_PASSWORD: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          JWT_HMAC_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${ROOT_ADMIN_PASSWORD}"
          echo "::add-mask::${JWT_HMAC_SECRET}"

          {
            echo "root_admin_password = $(jq -Rn --arg v "$ROOT_ADMIN_PASSWORD" '$v')"
            echo "jwt_hmac_secret = $(jq -Rn --arg v "$JWT_HMAC_SECRET" '$v')"
            if [[ -n "${APP_DOMAIN_NAME}" ]]; then
              echo "app_domain_name = $(jq -Rn --arg v "$APP_DOMAIN_NAME" '$v')"
            fi
          } > runtime.auto.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform validate -no-color

      - name: Download reviewed binary plan artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reviewed_plan.outputs.plan_run_id }}
          name: ${{ steps.reviewed_plan.outputs.binary_artifact_name }}
          path: platform/terraform/reviewed-plan-binary

      - name: Download reviewed text plan artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.reviewed_plan.outputs.plan_run_id }}
          name: ${{ steps.reviewed_plan.outputs.text_artifact_name }}
          path: platform/terraform/reviewed-plan-text

      - name: Resolve downloaded plan paths
        id: downloaded_plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BINARY_PLAN_PATH="$(find reviewed-plan-binary -type f | head -n 1)"
          TEXT_PLAN_PATH="$(find reviewed-plan-text -type f | head -n 1)"

          [[ -n "${BINARY_PLAN_PATH}" ]] || { echo "Downloaded binary plan artifact is empty"; exit 1; }
          [[ -n "${TEXT_PLAN_PATH}" ]] || { echo "Downloaded text plan artifact is empty"; exit 1; }

          {
            echo "binary_plan_path=${BINARY_PLAN_PATH}"
            echo "text_plan_path=${TEXT_PLAN_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply reviewed Terraform plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform apply -input=false -auto-approve "${{ steps.downloaded_plan.outputs.binary_plan_path }}"

      - name: Export Terraform output JSON
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform output -json > terraform-output.json

      - name: Build allowlisted output snapshot
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg environment "${DEPLOY_ENV}" \
            --arg aws_region "${AWS_DEFAULT_REGION}" \
            --argjson tf "$(cat terraform-output.json)" \
            '{
              generated_at: $generated_at,
              environment: $environment,
              deploy_contract: {
                aws_region: $aws_region,
                ecs_cluster_name: ($tf.ecs_cluster_name.value // null),
                ecr_repository_urls: ($tf.ecr_repository_urls.value // {}),
                ecr_repository_names: ($tf.ecr_repository_names.value // {}),
                codedeploy_ecs_application_name: ($tf.codedeploy_ecs_application_name.value // null),
                codedeploy_ecs_deployment_group_names: ($tf.codedeploy_ecs_deployment_group_names.value // {}),
                codedeploy_lambda_application_name: ($tf.codedeploy_lambda_application_name.value // null),
                codedeploy_lambda_deployment_group_names: ($tf.codedeploy_lambda_deployment_group_names.value // {}),
                lambda_function_names: {
                  log: ($tf.log_lambda_name.value // null),
                  aml: ($tf.aml_lambda_name.value // null),
                  sftp_transaction_collector: ($tf.sftp_transaction_collector_name.value // null),
                  verification: ($tf.verification_lambda_name.value // null)
                },
                frontend_bucket_name: ($tf.frontend_bucket_name.value // null),
                cloudfront_distribution_id: ($tf.cloudfront_distribution_id.value // null),
                cloudfront_distribution_domain_name: ($tf.cloudfront_distribution_domain_name.value // null),
                app_url: ($tf.app_url.value // null),
                alb_dns_name: ($tf.alb_dns_name.value // null),
                frontend_website_url: ($tf.frontend_website_url.value // null),
                rds_endpoint: ($tf.rds_endpoint.value // null),
                rds_port: ($tf.rds_port.value // null),
                database_name: ($tf.database_name.value // null),
                cognito_user_pool_id: ($tf.cognito_user_pool_id.value // null),
                cognito_app_client_id: ($tf.cognito_app_client_id.value // null)
              }
            }' > deploy-contract-snapshot.json

      - name: Expose deploy contract values
        id: deploy_values
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ECS_CLUSTER_NAME="$(jq -r '.deploy_contract.ecs_cluster_name // "scroogebank-crm-prod-ecs"' deploy-contract-snapshot.json)"
          CLOUDFRONT_DISTRIBUTION_ID="$(jq -r '.deploy_contract.cloudfront_distribution_id // ""' deploy-contract-snapshot.json)"

          {
            echo "ecs_cluster_name=${ECS_CLUSTER_NAME}"
            echo "cloudfront_distribution_id=${CLOUDFRONT_DISTRIBUTION_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Sync CloudFront distribution repo variable
        if: ${{ steps.deploy_values.outputs.cloudfront_distribution_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.deploy_values.outputs.cloudfront_distribution_id }}
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/${REPO}/actions/variables/CLOUDFRONT_DISTRIBUTION_ID"
          CREATE_URL="https://api.github.com/repos/${REPO}/actions/variables"
          PAYLOAD="$(jq -n --arg name "CLOUDFRONT_DISTRIBUTION_ID" --arg value "${CLOUDFRONT_DISTRIBUTION_ID}" '{name:$name, value:$value}')"

          STATUS_CODE="$(curl -sS -o /tmp/github-variable-response.json -w "%{http_code}" \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}")"

          if [[ "${STATUS_CODE}" == "200" ]]; then
            UPDATE_STATUS="$(curl -sS -o /tmp/github-variable-update.json -w "%{http_code}" \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" \
              -d "${PAYLOAD}")"
            [[ "${UPDATE_STATUS}" == "204" ]] || {
              echo "Failed to update repo variable CLOUDFRONT_DISTRIBUTION_ID (HTTP ${UPDATE_STATUS})"
              cat /tmp/github-variable-update.json || true
              exit 1
            }
            echo "Updated repo variable CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}"
          elif [[ "${STATUS_CODE}" == "404" ]]; then
            CREATE_STATUS="$(curl -sS -o /tmp/github-variable-create.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${CREATE_URL}" \
              -d "${PAYLOAD}")"
            [[ "${CREATE_STATUS}" == "201" ]] || {
              echo "Failed to create repo variable CLOUDFRONT_DISTRIBUTION_ID (HTTP ${CREATE_STATUS})"
              cat /tmp/github-variable-create.json || true
              exit 1
            }
            echo "Created repo variable CLOUDFRONT_DISTRIBUTION_ID=${CLOUDFRONT_DISTRIBUTION_ID}"
          else
            echo "Failed to query repo variable CLOUDFRONT_DISTRIBUTION_ID (HTTP ${STATUS_CODE})"
            cat /tmp/github-variable-response.json || true
            exit 1
          fi

      - name: Upload Terraform output artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apply_meta.outputs.output_artifact_name }}
          path: platform/terraform/terraform-output.json
          retention-days: 30

      - name: Upload Terraform snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apply_meta.outputs.snapshot_artifact_name }}
          path: platform/terraform/deploy-contract-snapshot.json
          retention-days: 30

      - name: Publish apply summary
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PLAN_RESULT_LINE="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\.)' "${{ steps.downloaded_plan.outputs.text_plan_path }}" | tail -n 1 || true)"
          if [[ -z "${PLAN_RESULT_LINE}" ]]; then
            PLAN_RESULT_LINE="Reviewed plan text downloaded successfully."
          fi

          {
            echo "## Terraform Infra Apply Summary"
            echo
            echo "Reviewed commit SHA: ${{ inputs.reviewed_commit_sha }}"
            echo "Applied plan run: ${{ steps.reviewed_plan.outputs.plan_run_url }}"
            echo "AWS account: ${{ steps.apply_meta.outputs.account_id }}"
            echo "Region: ${AWS_REGION}"
            echo "Reviewed plan result: ${PLAN_RESULT_LINE}"
            echo
            echo "### Key endpoints"
            echo "- app_url: $(jq -r '.deploy_contract.app_url // ""' deploy-contract-snapshot.json)"
            echo "- alb_dns_name: $(jq -r '.deploy_contract.alb_dns_name // ""' deploy-contract-snapshot.json)"
            echo "- frontend_website_url: $(jq -r '.deploy_contract.frontend_website_url // ""' deploy-contract-snapshot.json)"
            echo
            echo "### Deployment identifiers"
            echo "- ecs_cluster_name: $(jq -r '.deploy_contract.ecs_cluster_name // ""' deploy-contract-snapshot.json)"
            echo "- frontend_bucket_name: $(jq -r '.deploy_contract.frontend_bucket_name // ""' deploy-contract-snapshot.json)"
            echo "- cloudfront_distribution_id: $(jq -r '.deploy_contract.cloudfront_distribution_id // ""' deploy-contract-snapshot.json)"
            echo "- cloudfront_distribution_domain_name: $(jq -r '.deploy_contract.cloudfront_distribution_domain_name // ""' deploy-contract-snapshot.json)"
            echo "- rds_endpoint: $(jq -r '.deploy_contract.rds_endpoint // ""' deploy-contract-snapshot.json)"
            echo "- database_name: $(jq -r '.deploy_contract.database_name // ""' deploy-contract-snapshot.json)"
            echo "- cognito_user_pool_id: $(jq -r '.deploy_contract.cognito_user_pool_id // ""' deploy-contract-snapshot.json)"
            echo "- cognito_app_client_id: $(jq -r '.deploy_contract.cognito_app_client_id // ""' deploy-contract-snapshot.json)"
            echo
            echo "Output artifact: ${{ steps.apply_meta.outputs.output_artifact_name }}"
            echo "Snapshot artifact: ${{ steps.apply_meta.outputs.snapshot_artifact_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Terraform working files
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: rm -f runtime.auto.tfvars terraform-output.json deploy-contract-snapshot.json

  force-deploy:
    name: Force full deploy after infra apply
    needs:
      - terraform-apply
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/cd-force-all.yml
    with:
      cloudfront_distribution_id: ${{ needs.terraform-apply.outputs.cloudfront_distribution_id }}
    secrets: inherit
