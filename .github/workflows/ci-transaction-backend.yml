name: CI - Transaction Backend

# Component pipeline for the transaction-backend trunk.
# Runs Java checkstyle + fast unit tests + DB-backed persistence tests.

on:
  pull_request:
    branches:
      - transaction-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - transaction-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-transaction-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: true
      run-backend-python: false
      run-frontend: false

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/transaction/build/reports/**

  # DB-backed persistence coverage against ephemeral PostgreSQL.
  test-db:
    needs: lint
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test \
          --tests "com.scroogebank.crm.transaction_service.service.PersistentTransactionsStoreTest" \
          --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/transaction/build/reports/**
