name: CD - Force Selective Deploy
# Manually trigger deployments of specific ECS services, Lambda functions,
# and/or the frontend with optional CloudFront distribution override for
# frontend invalidation paths.

on:
  workflow_dispatch:
    inputs:
      ecs_services:
        description: Comma-separated ECS services to deploy (user, client, transaction)
        required: false
        type: string
        default: ''
      lambda_services:
        description: Comma-separated Lambda services to deploy (aml, verification, sftp-transaction-collector, aml-consumer, audit-consumer, log)
        required: false
        type: string
        default: ''
      deploy_frontend:
        description: Deploy the frontend
        required: false
        type: boolean
        default: false
      cloudfront_distribution_id:
        description: Optional CloudFront distribution ID override for frontend invalidation
        required: false
        type: string
        default: ''

concurrency:
  group: cd-force-spec
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  prepare:
    name: Parse deployment selection
    runs-on: ubuntu-latest
    outputs:
      ecs_services_json: ${{ steps.parse.outputs.ecs_services_json }}
      lambda_services_json: ${{ steps.parse.outputs.lambda_services_json }}
      has_ecs: ${{ steps.parse.outputs.has_ecs }}
      has_lambda: ${{ steps.parse.outputs.has_lambda }}
      has_frontend: ${{ steps.parse.outputs.has_frontend }}
      any_selected: ${{ steps.parse.outputs.any_selected }}
      ecs_user: ${{ steps.parse.outputs.ecs_user }}
      ecs_client: ${{ steps.parse.outputs.ecs_client }}
      ecs_transaction: ${{ steps.parse.outputs.ecs_transaction }}
      lambda_aml: ${{ steps.parse.outputs.lambda_aml }}
      lambda_verification: ${{ steps.parse.outputs.lambda_verification }}
      lambda_sftp_transaction_collector: ${{ steps.parse.outputs.lambda_sftp_transaction_collector }}
      lambda_aml_consumer: ${{ steps.parse.outputs.lambda_aml_consumer }}
      lambda_audit_consumer: ${{ steps.parse.outputs.lambda_audit_consumer }}
      lambda_log: ${{ steps.parse.outputs.lambda_log }}
    steps:
      - name: Parse and validate workflow inputs
        id: parse
        shell: bash
        env:
          ECS_INPUT: ${{ inputs.ecs_services }}
          LAMBDA_INPUT: ${{ inputs.lambda_services }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
        run: |
          set -euo pipefail

          trim() {
            printf '%s' "$1" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//'
          }

          is_allowed() {
            local candidate="$1"
            shift
            local allowed
            for allowed in "$@"; do
              if [[ "$candidate" == "$allowed" ]]; then
                return 0
              fi
            done
            return 1
          }

          parse_csv() {
            local raw="$1"
            shift
            local values=()
            local seen=()
            local token
            local normalized

            IFS=',' read -r -a values <<< "${raw}"
            local parsed=()

            for token in "${values[@]}"; do
              normalized="$(trim "${token}")"
              normalized="$(printf '%s' "${normalized}" | tr '[:upper:]' '[:lower:]')"

              if [[ -z "${normalized}" ]]; then
                continue
              fi

              if ! is_allowed "${normalized}" "$@"; then
                echo "Unsupported service: ${normalized}"
                echo "Allowed values: $*"
                exit 1
              fi

              if [[ " ${seen[*]-} " == *" ${normalized} "* ]]; then
                continue
              fi

              seen+=("${normalized}")
              parsed+=("${normalized}")
            done

            if [[ ${#parsed[@]} -eq 0 ]]; then
              printf '[]'
            else
              printf '%s\n' "${parsed[@]}" | jq -R . | jq -s -c .
            fi
          }

          ECS_ALLOWED=(user client transaction)
          LAMBDA_ALLOWED=(aml verification sftp-transaction-collector aml-consumer audit-consumer log)

          ECS_JSON="$(parse_csv "${ECS_INPUT}" "${ECS_ALLOWED[@]}")"
          LAMBDA_JSON="$(parse_csv "${LAMBDA_INPUT}" "${LAMBDA_ALLOWED[@]}")"

          has_json_item() {
            local json="$1"
            local value="$2"

            if jq -e --arg value "${value}" 'index($value) != null' <<< "${json}" >/dev/null; then
              printf 'true'
            else
              printf 'false'
            fi
          }

          ECS_COUNT="$(jq 'length' <<< "${ECS_JSON}")"
          LAMBDA_COUNT="$(jq 'length' <<< "${LAMBDA_JSON}")"

          HAS_ECS=false
          HAS_LAMBDA=false
          HAS_FRONTEND=false

          if [[ "${ECS_COUNT}" -gt 0 ]]; then
            HAS_ECS=true
          fi

          if [[ "${LAMBDA_COUNT}" -gt 0 ]]; then
            HAS_LAMBDA=true
          fi

          if [[ "${DEPLOY_FRONTEND}" == 'true' ]]; then
            HAS_FRONTEND=true
          fi

          ANY_SELECTED=false
          if [[ "${HAS_ECS}" == 'true' || "${HAS_LAMBDA}" == 'true' || "${HAS_FRONTEND}" == 'true' ]]; then
            ANY_SELECTED=true
          fi

          if [[ "${ANY_SELECTED}" != 'true' ]]; then
            echo 'Select at least one ECS service, Lambda service, or enable frontend deployment.'
            exit 1
          fi

          {
            echo "ecs_services_json=${ECS_JSON}"
            echo "lambda_services_json=${LAMBDA_JSON}"
            echo "has_ecs=${HAS_ECS}"
            echo "has_lambda=${HAS_LAMBDA}"
            echo "has_frontend=${HAS_FRONTEND}"
            echo "any_selected=${ANY_SELECTED}"
            echo "ecs_user=$(has_json_item "${ECS_JSON}" user)"
            echo "ecs_client=$(has_json_item "${ECS_JSON}" client)"
            echo "ecs_transaction=$(has_json_item "${ECS_JSON}" transaction)"
            echo "lambda_aml=$(has_json_item "${LAMBDA_JSON}" aml)"
            echo "lambda_verification=$(has_json_item "${LAMBDA_JSON}" verification)"
            echo "lambda_sftp_transaction_collector=$(has_json_item "${LAMBDA_JSON}" sftp-transaction-collector)"
            echo "lambda_aml_consumer=$(has_json_item "${LAMBDA_JSON}" aml-consumer)"
            echo "lambda_audit_consumer=$(has_json_item "${LAMBDA_JSON}" audit-consumer)"
            echo "lambda_log=$(has_json_item "${LAMBDA_JSON}" log)"
          } >> "$GITHUB_OUTPUT"

      - name: Selection summary
        shell: bash
        run: |
          echo "ECS services: ${{ steps.parse.outputs.ecs_services_json }}"
          echo "Lambda services: ${{ steps.parse.outputs.lambda_services_json }}"
          echo "Deploy frontend: ${{ steps.parse.outputs.has_frontend }}"

  deploy-user:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.ecs_user == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: user
    secrets: inherit

  deploy-client:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.ecs_client == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: client
    secrets: inherit

  deploy-transaction:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.ecs_transaction == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: transaction
    secrets: inherit

  deploy-aml:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_aml == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: aml
    secrets: inherit

  deploy-verification:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_verification == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: verification
    secrets: inherit

  deploy-sftp-transaction-collector:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_sftp_transaction_collector == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: sftp-transaction-collector
    secrets: inherit

  deploy-aml-consumer:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_aml_consumer == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: aml-consumer
    secrets: inherit

  deploy-audit-consumer:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_audit_consumer == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: audit-consumer
    secrets: inherit

  deploy-log:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.lambda_log == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: log
    secrets: inherit

  deploy-frontend:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.has_frontend == 'true' }}
    needs:
      - prepare
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      cloudfront_distribution_id_override: ${{ inputs.cloudfront_distribution_id }}
    secrets: inherit

  merge-ecs-intents:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.has_ecs == 'true' }}
    needs:
      - prepare
      - deploy-user
      - deploy-client
      - deploy-transaction
    runs-on: ubuntu-latest
    steps:
      - name: Download ECS intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-ecs-*
          path: deploy-intents-ecs
          merge-multiple: true

      - name: Merge ECS intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, ecs:{}}' > manifest-ecs.json

          shopt -s nullglob
          fragments=(deploy-intents-ecs/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No ECS intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            service="$(jq -r '.ecs.service' "${fragment}")"
            jq \
              --arg service "${service}" \
              --slurpfile f "${fragment}" \
              '.ecs[$service] = {
                image_repo: $f[0].ecs.image_repo,
                image_tag: $f[0].ecs.image_tag,
                cluster: $f[0].ecs.cluster,
                task_definition_arn: $f[0].ecs.task_definition_arn,
                image_ref: $f[0].ecs.image_ref
              }' manifest-ecs.json > manifest-ecs.next.json
            mv manifest-ecs.next.json manifest-ecs.json
          done

      - name: Upload merged ECS manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-ecs
          path: manifest-ecs.json
          if-no-files-found: error

  merge-lambda-intents:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.has_lambda == 'true' }}
    needs:
      - prepare
      - deploy-aml
      - deploy-verification
      - deploy-sftp-transaction-collector
      - deploy-aml-consumer
      - deploy-audit-consumer
      - deploy-log
    runs-on: ubuntu-latest
    steps:
      - name: Download Lambda intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-lambda-*
          path: deploy-intents-lambda
          merge-multiple: true

      - name: Merge Lambda intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, lambda:{}}' > manifest-lambda.json

          shopt -s nullglob
          fragments=(deploy-intents-lambda/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No Lambda intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            function_name="$(jq -r '.lambda.function_name' "${fragment}")"
            jq \
              --arg function_name "${function_name}" \
              --slurpfile f "${fragment}" \
              '.lambda[$function_name] = {
                s3_key: $f[0].lambda.s3_key,
                published_version: $f[0].lambda.published_version,
                version_arn: $f[0].lambda.version_arn,
                alias: $f[0].lambda.alias,
                alias_action: $f[0].lambda.alias_action
              }' manifest-lambda.json > manifest-lambda.next.json
            mv manifest-lambda.next.json manifest-lambda.json
          done

      - name: Upload merged Lambda manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-lambda
          path: manifest-lambda.json
          if-no-files-found: error

  merge-frontend-intents:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.has_frontend == 'true' }}
    needs:
      - prepare
      - deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-frontend-*
          path: deploy-intents-frontend
          merge-multiple: true

      - name: Merge frontend intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, frontend:{}}' > manifest-frontend.json

          shopt -s nullglob
          fragments=(deploy-intents-frontend/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No frontend intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            site="$(jq -r '.frontend.site' "${fragment}")"
            jq \
              --arg site "${site}" \
              --slurpfile f "${fragment}" \
              '.frontend[$site] = {
                bucket: $f[0].frontend.bucket,
                deployed_version: $f[0].frontend.deployed_version,
                release_prefix: $f[0].frontend.release_prefix,
                build_output_dir: $f[0].frontend.build_output_dir,
                cloudfront_distribution_id: $f[0].frontend.cloudfront_distribution_id,
                cloudfront_invalidation_paths: $f[0].frontend.cloudfront_invalidation_paths
              }' manifest-frontend.json > manifest-frontend.next.json
            mv manifest-frontend.next.json manifest-frontend.json
          done

      - name: Upload merged frontend manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-frontend
          path: manifest-frontend.json
          if-no-files-found: error

  merge-and-publish-manifest:
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.any_selected == 'true' }}
    needs:
      - prepare
      - merge-ecs-intents
      - merge-lambda-intents
      - merge-frontend-intents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      MANIFEST_BUCKET: ${{ vars.BACKEND_BUCKET }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.BACKEND_BUCKET }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download grouped ECS manifest artifact
        if: ${{ needs.prepare.outputs.has_ecs == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-ecs
          path: manifests

      - name: Download grouped Lambda manifest artifact
        if: ${{ needs.prepare.outputs.has_lambda == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-lambda
          path: manifests

      - name: Download grouped frontend manifest artifact
        if: ${{ needs.prepare.outputs.has_frontend == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-frontend
          path: manifests

      - name: Merge changed intents into current manifest
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CURRENT_KEY="manifests/prod/current.json"

          if aws s3 cp "s3://${MANIFEST_BUCKET}/${CURRENT_KEY}" current.json >/dev/null 2>&1; then
            echo "Loaded current manifest from s3://${MANIFEST_BUCKET}/${CURRENT_KEY}"
          else
            echo "No existing current.json found. Initializing a new manifest."
            jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" \
              '{repo_sha:$repo_sha, created_at:$created_at, ecs:{}, lambda:{}, frontend:{}}' > current.json
          fi

          jq -n \
            --arg repo_sha "${REPO_SHA}" \
            --arg created_at "${NOW_UTC}" \
            --slurpfile current current.json \
            '($current[0] // {})
            | .repo_sha = $repo_sha
            | .created_at = $created_at
            | .ecs = (.ecs // {})
            | .lambda = (.lambda // {})
            | .frontend = (.frontend // {})' > manifest.json

          if [[ -f manifests/manifest-ecs.json ]]; then
            jq \
              --slurpfile ecs manifests/manifest-ecs.json \
              '.ecs = ((.ecs // {}) + ($ecs[0].ecs // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          if [[ -f manifests/manifest-lambda.json ]]; then
            jq \
              --slurpfile lambda manifests/manifest-lambda.json \
              '.lambda = ((.lambda // {}) + ($lambda[0].lambda // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          if [[ -f manifests/manifest-frontend.json ]]; then
            jq \
              --slurpfile frontend manifests/manifest-frontend.json \
              '.frontend = ((.frontend // {}) + ($frontend[0].frontend // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          jq -e . manifest.json > /dev/null

          echo "--- DEBUG: Final Updated Manifest ---"
          cat manifest.json
          echo "-------------------------------------"

      - name: Upload merged manifest to S3
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          aws s3 cp manifest.json "s3://${MANIFEST_BUCKET}/manifests/prod/current.json"
          aws s3 cp manifest.json "s3://${MANIFEST_BUCKET}/manifests/prod/git/${REPO_SHA}.json"

      - name: Manifest summary
        run: |
          echo "Wrote current manifest: s3://${{ env.MANIFEST_BUCKET }}/manifests/prod/current.json"
          echo "Wrote immutable manifest: s3://${{ env.MANIFEST_BUCKET }}/manifests/prod/git/${{ github.sha }}.json"
