name: Client Service - Full CI/CD

on:
  pull_request:
    paths:
      - 'services/clients-service/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/clients-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JAR and Run All Tests
        # 'build' in Gradle runs tests, integration tests, and creates the JAR
        run: chmod +x gradlew && ./gradlew build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: services/clients-service
          push: true
          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clients-service:latest