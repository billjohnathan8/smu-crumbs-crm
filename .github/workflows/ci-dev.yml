name: CI - Dev Pipeline

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  # Detect which services have changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      user-backend: ${{ steps.filter.outputs.user-backend }}
      aml-backend: ${{ steps.filter.outputs.aml-backend }}
      client-backend: ${{ steps.filter.outputs.client-backend }}
      log-backend: ${{ steps.filter.outputs.log-backend }}
      verification-backend: ${{ steps.filter.outputs.verification-backend }}
      transaction-ingestion-lambda-backend: ${{ steps.filter.outputs.transaction-ingestion-lambda-backend }}
      transaction-backend: ${{ steps.filter.outputs.transaction-backend }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before || 'HEAD~1' }}
          ref: ${{ github.sha }}
          filters: |
            frontend:
              - 'services/frontend/**'
            user-backend:
              - 'services/backend/user/**'
            aml-backend:
              - 'services/backend/aml/**'
            client-backend:
              - 'services/backend/client/**'
            log-backend:
              - 'services/backend/log/**'
            verification-backend:
              - 'services/backend/verification/**'
            transaction-ingestion-lambda-backend:
              - 'services/backend/transaction-ingestion-lambda/**'
            transaction-backend:
              - 'services/backend/transaction/**'
            platform:
              - 'platform/**'

  # Conditional CI jobs based on changed services
  # Stateful backend component workflows (user/client/transaction/log) include
  # both fast unit tests and a separate DB-backed Postgres gate.
  ci-frontend:
    name: CI - Frontend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  ci-user-backend:
    name: CI - User Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.user-backend == 'true'
    uses: ./.github/workflows/ci-user-backend.yml

  ci-aml-backend:
    name: CI - AML Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.aml-backend == 'true'
    uses: ./.github/workflows/ci-aml-backend.yml

  ci-client-backend:
    name: CI - Client Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.client-backend == 'true'
    uses: ./.github/workflows/ci-client-backend.yml

  ci-log-backend:
    name: CI - Log Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.log-backend == 'true'
    uses: ./.github/workflows/ci-log-backend.yml

  ci-verification-backend:
    name: CI - Verification Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.verification-backend == 'true'
    uses: ./.github/workflows/ci-verification-backend.yml

  ci-transaction-ingestion-lambda-backend:
    name: CI - Transaction Ingestion Lambda Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.transaction-ingestion-lambda-backend == 'true'
    uses: ./.github/workflows/ci-transaction-ingestion-lambda-backend.yml

  ci-transaction-backend:
    name: CI - Transaction Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.transaction-backend == 'true'
    uses: ./.github/workflows/ci-transaction-backend.yml

  ci-terraform:
    name: CI - Terraform Static Analysis
    needs: [detect-changes]
    if: needs.detect-changes.outputs.platform == 'true'
    uses: ./.github/workflows/ci-terraform.yml
    secrets: inherit

  # OpenAPI contract linting runs unconditionally (fast, ~5s).
  openapi-lint:
    name: CI - OpenAPI Lint
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-openapi: true

  # Secret scanning runs unconditionally on every push/PR regardless of what changed.
  secrets-scan:
    name: CI - Secret Scanning
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-secrets: true

  # Summary job that runs after all checks
  ci-dev-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs:
      - ci-frontend
      - ci-user-backend
      - ci-aml-backend
      - ci-client-backend
      - ci-log-backend
      - ci-verification-backend
      - ci-transaction-ingestion-lambda-backend
      - ci-transaction-backend
      - ci-terraform
      - openapi-lint
      - secrets-scan
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed!"
