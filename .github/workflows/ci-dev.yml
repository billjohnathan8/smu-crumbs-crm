name: CI - Dev Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # Detect which services have changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      agent-backend: ${{ steps.filter.outputs.agent-backend }}
      client-backend: ${{ steps.filter.outputs.client-backend }}
      log-backend: ${{ steps.filter.outputs.log-backend }}
      transaction-backend: ${{ steps.filter.outputs.transaction-backend }}
      xfactor-backend: ${{ steps.filter.outputs.xfactor-backend }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'services/frontend/**'
            agent-backend:
              - 'services/backend/agent/**'
            client-backend:
              - 'services/backend/client/**'
            log-backend:
              - 'services/backend/log/**'
            transaction-backend:
              - 'services/backend/transaction/**'
            xfactor-backend:
              - 'services/backend/xfactor/**'
            platform:
              - 'platform/**'

  # Lint all code
  lint-code:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4
      
      # Run existing reusable lint workflow
      - name: Lint Application Code
        uses: ./.github/workflows/reusable-lint.yml

  # Lint platform Kubernetes configs
  lint-platform-k8s:
    name: Lint Platform Kubernetes Configs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.platform == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/
      
      - name: Validate Kubernetes YAML files
        run: |
          find platform -type f \( -name "*.yaml" -o -name "*.yml" \) -exec kubeval {} +

  # Conditional CI jobs based on changed services
  ci-frontend:
    name: CI - Frontend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  ci-agent-backend:
    name: CI - Agent Backend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.agent-backend == 'true'
    uses: ./.github/workflows/ci-agent-backend.yml

  ci-client-backend:
    name: CI - Client Backend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.client-backend == 'true'
    uses: ./.github/workflows/ci-client-backend.yml

  ci-log-backend:
    name: CI - Log Backend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.log-backend == 'true'
    uses: ./.github/workflows/ci-log-backend.yml

  ci-transaction-backend:
    name: CI - Transaction Backend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.transaction-backend == 'true'
    uses: ./.github/workflows/ci-transaction-backend.yml

  ci-xfactor-backend:
    name: CI - X-Factor Backend
    needs: [detect-changes, lint-code]
    if: needs.detect-changes.outputs.xfactor-backend == 'true'
    uses: ./.github/workflows/ci-xfactor-backend.yml


  # Summary job that runs after all checks
  ci-dev-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: 
      - lint-code
      - lint-platform-scripts
      - lint-platform-k8s
      - ci-frontend
      - ci-agent-backend
      - ci-client-backend
      - ci-log-backend
      - ci-transaction-backend
      - ci-xfactor-backend
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "All CI/CD checks completed"
          # This job will fail if any required job fails