name: CI - Dev Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # Detect which services have changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      agent-backend: ${{ steps.filter.outputs.agent-backend }}
      aml-backend: ${{ steps.filter.outputs.aml-backend }}
      client-backend: ${{ steps.filter.outputs.client-backend }}
      log-backend: ${{ steps.filter.outputs.log-backend }}
      transaction-backend: ${{ steps.filter.outputs.transaction-backend }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before || 'HEAD~1' }}
          ref: ${{ github.sha }}
          filters: |
            frontend:
              - 'services/frontend/**'
            agent-backend:
              - 'services/backend/agent/**'
            aml-backend:
              - 'services/backend/aml/**'
            client-backend:
              - 'services/backend/client/**'
            log-backend:
              - 'services/backend/log/**'
            transaction-backend:
              - 'services/backend/transaction/**'
            platform:
              - 'platform/**'

  # Conditional CI jobs based on changed services
  ci-frontend:
    name: CI - Frontend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  ci-agent-backend:
    name: CI - Agent Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.agent-backend == 'true'
    uses: ./.github/workflows/ci-agent-backend.yml

  ci-aml-backend:
    name: CI - AML Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.aml-backend == 'true'
    uses: ./.github/workflows/ci-aml-backend.yml

  ci-client-backend:
    name: CI - Client Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.client-backend == 'true'
    uses: ./.github/workflows/ci-client-backend.yml

  ci-log-backend:
    name: CI - Log Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.log-backend == 'true'
    uses: ./.github/workflows/ci-log-backend.yml

  ci-transaction-backend:
    name: CI - Transaction Backend
    needs: [detect-changes]
    if: needs.detect-changes.outputs.transaction-backend == 'true'
    uses: ./.github/workflows/ci-transaction-backend.yml

  ci-terraform:
    name: CI - Terraform Static Analysis
    needs: [detect-changes]
    if: needs.detect-changes.outputs.platform == 'true'
    uses: ./.github/workflows/ci-terraform.yml
    secrets: inherit

  # Secret scanning runs unconditionally on every push/PR regardless of what changed.
  secrets-scan:
    name: CI - Secret Scanning
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-secrets: true

  # Summary job that runs after all checks
  ci-dev-summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs:
      - ci-frontend
      - ci-agent-backend
      - ci-aml-backend
      - ci-client-backend
      - ci-log-backend
      - ci-transaction-backend
      - ci-terraform
      - secrets-scan
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed!"
