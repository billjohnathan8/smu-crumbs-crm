name: CI - Main Pipeline

# Full pipeline for the main branch.
# Runs: changes -> lint -> component tests (unit + DB-backed) -> frontend latency
#       -> fullstack integration -> JMeter post-merge performance gate -> deploy (TBD).
# Note: Frontend latency tests run in CI; JMeter load tests run post-merge on push to main.
#
# Job DAG:
#
#   changes  (5s)
#      |
#      v
#    lint    (3-5 min, only scopes that changed)
#      |
#      +---> test-user            \
#      +---> test-user-db          |
#      +---> test-client            |
#      +---> test-client-db         |  parallel component checks, each gated by scope
#      +---> test-transaction       |
#      +---> test-transaction-db    |
#      +---> test-log               |
#      +---> test-log-db            |
#      +---> test-verification     |
#      +---> test-sftp-transaction-collector |
#      +---> test-audit-consumer   |
#      +---> test-aml-consumer     |
#      +---> test-frontend        /
#      |
#      v
#   fullstack-integration-e2e  (real Docker containers + LocalStack + HTTP smoke
#                               + Playwright against live stack, ~30-40 min)
#      |
#      v
#   jmeter-performance-post-merge (100 concurrent-agent load test, push-to-main only)
#      |
#      v
#   [deploy — not yet implemented]

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # ==========================================================================
  # Layer 0: Detect which components changed
  # ==========================================================================
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  # ==========================================================================
  # Layer 1: Lint / Format / Typecheck  (gates everything downstream)
  # ==========================================================================
  lint:
    needs: changes
    uses: ./.github/workflows/reusable-lint.yml
    secrets: inherit
    with:
      run-secrets: true
      run-openapi: true
      run-backend-java: >-
        ${{ needs.changes.outputs.any-backend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-backend-python: >-
        ${{ needs.changes.outputs.backend-log == 'true'
            || needs.changes.outputs.backend-verification == 'true'
            || needs.changes.outputs.backend-sftp-transaction-collector == 'true'
            || needs.changes.outputs.backend-audit-consumer == 'true'
            || needs.changes.outputs.backend-aml-consumer == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-frontend: >-
        ${{ needs.changes.outputs.frontend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-terraform: >-
        ${{ needs.changes.outputs.platform == 'true'
            || needs.changes.outputs.ci-config == 'true' }}

  # ==========================================================================
  # Layer 2: Component tests  (parallel, each gated by its scope)
  # Includes fast unit tests and separate DB-backed Postgres gates for
  # stateful services.
  # ==========================================================================
  test-user:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-user == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: user
      runtime: java
      working-directory: services/backend/user
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/user/build/reports/**

  test-user-db:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-user == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: user
      runtime: java
      working-directory: services/backend/user
      test-command: |
        chmod +x gradlew
        ./gradlew test \
          --tests "com.scroogebank.crm.user_service.service.PersistentUserStoreTest" \
          --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/user/build/reports/**

  test-client:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-client == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: client
      runtime: java
      working-directory: services/backend/client
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/client/build/reports/**

  test-client-db:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-client == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: client
      runtime: java
      working-directory: services/backend/client
      test-command: |
        chmod +x gradlew
        ./gradlew test \
          --tests "com.scroogebank.crm.client_service.ClientsServiceIT" \
          -PincludeIntegration=true \
          --no-daemon --console=plain
      timeout-minutes: 15
      artifact-paths: services/backend/client/build/reports/**

  test-transaction:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-transaction == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/transaction/build/reports/**

  test-transaction-db:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-transaction == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test \
          --tests "com.scroogebank.crm.transaction_service.service.PersistentTransactionsStoreTest" \
          --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/transaction/build/reports/**

  test-log:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-log == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=app \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/log/build/reports/**
        services/backend/log/build/coverage.xml

  test-log-db:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-log == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        RUN_DB_INTEGRATION_TESTS=true python -m pytest tests/test_repository_postgres_integration.py \
          --junitxml=build/reports/tests/junit-postgres.xml
      timeout-minutes: 10
      artifact-paths: services/backend/log/build/reports/**

  test-sftp-transaction-collector:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-sftp-transaction-collector == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: sftp-transaction-collector
      runtime: python
      working-directory: services/backend/sftp-transaction-collector
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/sftp-transaction-collector/build/reports/**
        services/backend/sftp-transaction-collector/build/coverage.xml

  test-verification:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-verification == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: verification
      runtime: python
      working-directory: services/backend/verification
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/verification/build/reports/**
        services/backend/verification/build/coverage.xml

  test-audit-consumer:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-audit-consumer == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: audit-consumer
      runtime: python
      working-directory: services/backend/audit-consumer
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/audit-consumer/build/reports/**
        services/backend/audit-consumer/build/reports/coverage/coverage.xml

  test-aml-consumer:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-aml-consumer == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: aml-consumer
      runtime: python
      working-directory: services/backend/aml-consumer
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/aml-consumer/build/reports/**
        services/backend/aml-consumer/build/reports/coverage/coverage.xml

  test-frontend:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.frontend == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: frontend
      runtime: node
      working-directory: services/frontend/crm-ui
      test-command: npm run test:coverage
      timeout-minutes: 10
      artifact-paths: services/frontend/crm-ui/coverage/**

  # ==========================================================================
  # Layer 3: Frontend Latency Tests — CPM22: Re-enabled for CI enforcement
  # Performance tests validate CS301 requirement: all operations < 5 seconds
  # To run locally: cd services/frontend/crm-ui && npm run test:e2e:latency
  # ==========================================================================
  frontend-latency-tests:
    name: Frontend Latency Tests (CS301 <5s)
    if: ${{ !failure() && !cancelled() }}
    needs:
      - changes
      - lint
      - test-user
      - test-user-db
      - test-client
      - test-client-db
      - test-transaction
      - test-transaction-db
      - test-log
      - test-log-db
      - test-verification
      - test-sftp-transaction-collector
      - test-audit-consumer
      - test-aml-consumer
      - test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend/crm-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral E2E credentials for frontend tests
        run: |
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)Aa1!Xx" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$(openssl rand -hex 16)Bb2!Yy" >> "$GITHUB_ENV"

      - name: Run frontend latency tests
        timeout-minutes: 10
        run: npm run test:e2e:latency

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-latency-main
          path: |
            services/frontend/crm-ui/test-results/
            services/frontend/crm-ui/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Layer 4: Fullstack integration — real containers + LocalStack
  # Builds all service Docker images, starts LocalStack + PostgreSQL,
  # provisions all AWS resources via the init script, runs cross-service HTTP
  # smoke assertions, and runs Playwright E2E (critical subset on PRs, full on pushes).
  # PRs run pr mode (smoke + critical Playwright subset); pushes keep full mode.
  # ==========================================================================
  fullstack-integration-e2e:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.any-service == 'true' ||
           needs.changes.outputs.integration-tests == 'true' ||
           needs.changes.outputs.scripts == 'true' ||
           needs.changes.outputs.platform == 'true' ||
           needs.changes.outputs.ci-config == 'true') }}
    needs:
      - changes
      - frontend-latency-tests  # CPM22: Re-enabled for performance enforcement
    uses: ./.github/workflows/reusable-fullstack-integration.yml
    with:
      fullstack-mode: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

  # ==========================================================================
  # Layer 5: JMeter post-merge performance gate (safe mode)
  # Runs only on push to main after fullstack integration passes.
  # Keeps PR cycle fast while enforcing concurrent-load checks on merged code.
  # ==========================================================================
  jmeter-performance-post-merge:
    name: JMeter Performance (100 Concurrent Agents, post-merge)
    if: >-
      ${{ !failure() && !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.fullstack-integration-e2e.result == 'success' }}
    needs:
      - fullstack-integration-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Apache JMeter 5.6.3
        timeout-minutes: 3
        run: |
          JMETER_VERSION=5.6.3
          JMETER_URL="https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"

          echo "[INFO] Downloading JMeter ${JMETER_VERSION}..."
          curl -fsSL "${JMETER_URL}" -o /tmp/jmeter.tgz

          echo "[INFO] Extracting JMeter..."
          sudo tar -xzf /tmp/jmeter.tgz -C /opt
          sudo ln -s /opt/apache-jmeter-${JMETER_VERSION} /opt/jmeter

          echo "/opt/jmeter/bin" >> "$GITHUB_PATH"

          echo "[INFO] JMeter installed successfully"
          /opt/jmeter/bin/jmeter --version

      - name: Mark scripts executable
        timeout-minutes: 1
        run: |
          chmod +x scripts/dev/stack-up.sh
          chmod +x scripts/dev/stack-down.sh
          chmod +x scripts/performance/run-100-threads.sh
          chmod +x platform/localstack/init/01-setup.sh

      - name: Generate ephemeral local secrets for stack-up
        run: |
          echo "LOCAL_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)Aa1!Xx" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$(openssl rand -hex 16)Bb2!Yy" >> "$GITHUB_ENV"

      - name: Start local dev stack
        timeout-minutes: 15
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-southeast-1
          LOCAL_DB_NAME: crm
          LOCAL_DB_USER: crm_app
        run: |
          echo "[INFO] Starting local dev stack..."
          bash scripts/dev/stack-up.sh

          echo "[INFO] Stack started successfully"
          docker ps

      - name: Wait for services to be healthy
        timeout-minutes: 5
        run: |
          echo "[INFO] Waiting for client-service health endpoint..."

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl --silent --fail http://127.0.0.1:18088/actuator/health >/dev/null 2>&1; then
              echo "[OK] Client-service is healthy"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "[WAIT] Attempt $ATTEMPT/$MAX_ATTEMPTS - waiting for health endpoint..."
            sleep 5
          done

          echo "[FAIL] Client-service did not become healthy within timeout"
          docker ps
          docker logs crm-client-service || true
          exit 1

      - name: Run JMeter 100-thread performance test
        timeout-minutes: 20
        env:
          SKIP_RESTART_PROMPT: '1'
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: |
          echo "[INFO] Starting post-merge JMeter performance test with 100 threads..."

          if [ -z "${E2E_ADMIN_PASSWORD:-}" ]; then
            echo "[FAIL] Missing E2E_ADMIN_PASSWORD in job environment"
            exit 1
          fi

          LOGIN_STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@crm.com\",\"password\":\"${E2E_ADMIN_PASSWORD}\"}" \
            http://127.0.0.1:18088/api/auth/login)"
          if [ "${LOGIN_STATUS}" != "200" ]; then
            echo "[FAIL] Login preflight failed before JMeter (status=${LOGIN_STATUS})"
            exit 1
          fi

          bash scripts/performance/run-100-threads.sh

      - name: Upload JMeter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-post-merge-${{ github.run_id }}
          path: build-logs/performance/100-threads-local/**
          retention-days: 14

      - name: Teardown local dev stack
        if: always()
        timeout-minutes: 10
        run: |
          echo "[INFO] Tearing down local stack..."
          bash scripts/dev/stack-down.sh || true

  # ==========================================================================
  # Layer 6: Deploy  (not yet implemented — placeholder)
  # jmeter-performance-post-merge should pass before this gate can proceed on main.
  # ==========================================================================
