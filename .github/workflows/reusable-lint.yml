name: Lint / Format / Typecheck

# Reusable workflow that runs all lint, format, and typecheck steps across the repo.
# Designed to fail fast with tight timeouts - cheapest checks first.

on:
  workflow_call:
    inputs:
      run-backend-java:
        description: 'Run Checkstyle for Java backend services'
        required: false
        type: boolean
        default: false
      run-backend-python:
        description: 'Run Black + Flake8 for Python backend services'
        required: false
        type: boolean
        default: false
      run-frontend:
        description: 'Run ESLint + Prettier + TypeScript typecheck for frontend'
        required: false
        type: boolean
        default: false
      run-terraform:
        description: 'Run terraform + opentofu fmt/validate lanes, integration-contract plan artifact, tflint, and checkov for platform/terraform'
        required: false
        type: boolean
        default: false
      run-openapi:
        description: 'Run Spectral OpenAPI contract linting'
        required: false
        type: boolean
        default: false
      run-secrets:
        description: 'Run Gitleaks and TruffleHog secret scanning across the full git history'
        required: false
        type: boolean
        default: false
    secrets:
      INFRACOST_API_KEY:
        required: false
      AWS_ROLE_ARN:
        required: false

permissions:
  contents: read
  id-token: write

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  # ---- Java Checkstyle (user, client, transaction) ----
  java-checkstyle:
    name: Checkstyle (Java)
    if: inputs.run-backend-java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        service: [user, client, transaction]
    defaults:
      run:
        working-directory: services/backend/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle
        timeout-minutes: 3
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon --console=plain

  # ---- Python Black + Flake8 (all Python backend services) ----
  python-lint:
    name: Black + Flake8 (${{ matrix.service }})
    if: inputs.run-backend-python
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: log
            source-dirs: app tests
          - service: aml
            source-dirs: lambda_function.py tests
          - service: sftp-transaction-collector
            source-dirs: lambda_function.py tests
          - service: verification
            source-dirs: lambda_function.py tests
          - service: audit-consumer
            source-dirs: lambda_function.py tests
          - service: aml-consumer
            source-dirs: lambda_function.py tests
    defaults:
      run:
        working-directory: services/backend/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        timeout-minutes: 2
        run: pip install -r requirements.txt

      - name: Check formatting (Black)
        timeout-minutes: 1
        run: python -m black --check --diff ${{ matrix.source-dirs }}

      - name: Lint (Flake8)
        timeout-minutes: 1
        run: python -m flake8 --jobs 1 --max-line-length=100 --extend-ignore=E501,E203,W503 ${{ matrix.source-dirs }}

  # ---- Frontend ESLint + Prettier + TypeScript ----
  frontend-lint:
    name: ESLint + Prettier + Typecheck (Frontend)
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/frontend/crm-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Prettier format check
        timeout-minutes: 1
        run: npm run format:check

      - name: TypeScript typecheck
        timeout-minutes: 2
        run: npm run typecheck

      - name: ESLint
        timeout-minutes: 2
        run: npm run lint

  # ---- Terraform fmt + validate + plan artifact + tflint + checkov ----
  terraform-lint:
    name: Terraform Static Analysis
    if: inputs.run-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_PLAN_ENV: integration
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        timeout-minutes: 2
        with:
          terraform_version: "~1.10"

      - name: terraform fmt check
        timeout-minutes: 2
        run: terraform fmt -check -recursive

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        timeout-minutes: 2

      - name: terraform init (no backend)
        timeout-minutes: 5
        run: terraform init -backend=false

      - name: terraform validate
        timeout-minutes: 2
        run: terraform validate

      - name: opentofu init (no backend)
        timeout-minutes: 5
        run: tofu init -backend=false

      - name: opentofu validate
        timeout-minutes: 2
        run: tofu validate

      - name: Prepare lambda zip artifacts for feature-gated validate
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          out = pathlib.Path(".ci-artifacts")
          out.mkdir(exist_ok=True)
          for name in (
              "verification-lambda.zip",
              "log-lambda.zip",
              "audit-consumer-lambda.zip",
              "aml-consumer-lambda.zip",
          ):
              with zipfile.ZipFile(out / name, "w", zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr("README.txt", "temporary CI artifact for terraform validate")
          PY

      - name: terraform validate (operable lambda + pipeline flags)
        timeout-minutes: 2
        env:
          TF_VAR_enable_log_lambda: "true"
          TF_VAR_log_lambda_zip_path: ".ci-artifacts/log-lambda.zip"
          TF_VAR_enable_verification_pipeline: "true"
          TF_VAR_verification_zip_path: ".ci-artifacts/verification-lambda.zip"
          TF_VAR_enable_audit_pipeline: "true"
          TF_VAR_audit_consumer_zip_path: ".ci-artifacts/audit-consumer-lambda.zip"
          TF_VAR_enable_aml_pipeline: "true"
          TF_VAR_aml_consumer_zip_path: ".ci-artifacts/aml-consumer-lambda.zip"
          TF_VAR_ses_sender_email: "verification@crm.local"
        run: terraform validate

      - name: opentofu validate (operable lambda + pipeline flags)
        timeout-minutes: 2
        env:
          TF_VAR_enable_log_lambda: "true"
          TF_VAR_log_lambda_zip_path: ".ci-artifacts/log-lambda.zip"
          TF_VAR_enable_verification_pipeline: "true"
          TF_VAR_verification_zip_path: ".ci-artifacts/verification-lambda.zip"
          TF_VAR_enable_audit_pipeline: "true"
          TF_VAR_audit_consumer_zip_path: ".ci-artifacts/audit-consumer-lambda.zip"
          TF_VAR_enable_aml_pipeline: "true"
          TF_VAR_aml_consumer_zip_path: ".ci-artifacts/aml-consumer-lambda.zip"
          TF_VAR_ses_sender_email: "verification@crm.local"
        run: tofu validate

      - name: Prepare Terraform plan artifact directory
        timeout-minutes: 1
        run: mkdir -p .tfplan

      - name: Configure AWS credentials for Terraform plan
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Ensure Terraform backend resources exist
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        timeout-minutes: 3
        run: |
          set -euo pipefail

          BACKEND_FILE="env/${TF_PLAN_ENV}.backend.hcl"

          STATE_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"

          if [[ -z "${STATE_BUCKET}" || -z "${BACKEND_REGION}" ]]; then
            echo "Failed to parse bucket/region from ${BACKEND_FILE}"
            exit 1
          fi

          if aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "State bucket exists: ${STATE_BUCKET}"
          else
            if [[ "${BACKEND_REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${BACKEND_REGION}"
            else
              aws s3api create-bucket \
                --bucket "${STATE_BUCKET}" \
                --region "${BACKEND_REGION}" \
                --create-bucket-configuration "LocationConstraint=${BACKEND_REGION}"
            fi
            echo "Created state bucket: ${STATE_BUCKET}"
          fi

          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "${STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          if [[ -n "${LOCK_TABLE}" ]]; then
            if aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${BACKEND_REGION}" >/dev/null 2>&1; then
              echo "Lock table exists: ${LOCK_TABLE}"
            else
              aws dynamodb create-table \
                --table-name "${LOCK_TABLE}" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region "${BACKEND_REGION}"
              aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "${BACKEND_REGION}"
              echo "Created lock table: ${LOCK_TABLE}"
            fi
          fi

      - name: terraform init (integration backend)
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        timeout-minutes: 5
        run: terraform init -reconfigure -backend-config=env/${{ env.TF_PLAN_ENV }}.backend.hcl

      - name: terraform plan (integration contract)
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        timeout-minutes: 8
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            "-var-file=env/${TF_PLAN_ENV}.tfvars" \
            "-out=.tfplan/${TF_PLAN_ENV}.tfplan"
          terraform show -no-color ".tfplan/${TF_PLAN_ENV}.tfplan" > ".tfplan/${TF_PLAN_ENV}.plan.txt"

      - name: Record skipped Terraform plan reason
        if: ${{ !(env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)) }}
        timeout-minutes: 1
        run: |
          cat <<'EOF' > .tfplan/README.txt
          Terraform plan was skipped because AWS_ROLE_ARN is not configured for this run
          or this run is from a forked pull request where repository secrets are unavailable.
          Static terraform checks still ran successfully.
          EOF

      - name: Upload Terraform plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.tfplan/
          retention-days: 7

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        timeout-minutes: 3
        with:
          tflint_version: v0.53.0

      - name: TFLint init (download AWS plugin)
        timeout-minutes: 3
        run: tflint --init

      - name: Run TFLint
        timeout-minutes: 3
        run: tflint --format compact

      - name: Prepare Infracost artifact directory
        timeout-minutes: 1
        run: mkdir -p .infracost

      - name: Set up Infracost
        if: ${{ env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        timeout-minutes: 2
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost report
        if: ${{ env.INFRACOST_API_KEY != '' }}
        timeout-minutes: 5
        run: |
          infracost breakdown --path=. --format=json --out-file=.infracost/infracost-report.json
          infracost breakdown --path=. --format=table --out-file=.infracost/infracost-report.txt

      - name: Record skipped Infracost reason
        if: ${{ env.INFRACOST_API_KEY == '' }}
        timeout-minutes: 1
        run: echo "INFRACOST_API_KEY is not configured; Infracost cost report was skipped." > .infracost/README.txt

      - name: Upload Infracost artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: infracost-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.infracost/
          retention-days: 7

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Install Checkov
        timeout-minutes: 3
        run: pip install checkov

      - name: Run Checkov (security & compliance scan)
        # CRITICAL and HIGH findings block the pipeline (exit 1).
        # LOW and MEDIUM findings are reported but non-blocking (--soft-fail).
        timeout-minutes: 5
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --compact \
            --quiet \
            --soft-fail \
            --hard-fail-on CRITICAL,HIGH

  # ---- OpenAPI Spectral lint ----
  openapi-spectral:
    name: Spectral (OpenAPI)
    if: inputs.run-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'

      - name: Install Spectral
        timeout-minutes: 1
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI specs
        timeout-minutes: 1
        run: spectral lint docs/api-contracts/openapi/*.yaml --fail-severity error

  # ---- Gitleaks secret scanner ----
  gitleaks:
    name: Gitleaks (Secret Scanning)
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        timeout-minutes: 2
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        # Uses the open-source CLI directly — no org licence required.
        # Exits 1 if any unallowlisted secrets are detected.
        run: gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose

  # ---- TruffleHog secret scanner ----
  trufflehog:
    name: TruffleHog (Secret Scanning)
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
