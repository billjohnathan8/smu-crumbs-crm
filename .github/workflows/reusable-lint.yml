name: Lint / Format / Typecheck

# Reusable workflow that runs all lint, format, and typecheck steps across the repo.
# Designed to fail fast with tight timeouts - cheapest checks first.

on:
  workflow_call:
    inputs:
      run-backend-java:
        description: 'Run Checkstyle for Java backend services'
        required: false
        type: boolean
        default: false
      run-backend-python:
        description: 'Run Black + Flake8 for Python log service'
        required: false
        type: boolean
        default: false
      run-frontend:
        description: 'Run ESLint + Prettier + TypeScript typecheck for frontend'
        required: false
        type: boolean
        default: false
      run-terraform:
        description: 'Run terraform fmt, validate, tflint, and checkov for platform/terraform'
        required: false
        type: boolean
        default: false
      run-secrets:
        description: 'Run Gitleaks and TruffleHog secret scanning across the full git history'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  # ---- Java Checkstyle (agent, client, transaction) ----
  java-checkstyle:
    name: Checkstyle (Java)
    if: inputs.run-backend-java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        service: [agent, client, transaction]
    defaults:
      run:
        working-directory: services/backend/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle
        timeout-minutes: 3
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon --console=plain

  # ---- Python Black + Flake8 (all Python backend services) ----
  python-lint:
    name: Black + Flake8 (${{ matrix.service }})
    if: inputs.run-backend-python
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: log
            source-dirs: app tests
          - service: aml
            source-dirs: lambda_function.py tests
    defaults:
      run:
        working-directory: services/backend/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        timeout-minutes: 2
        run: pip install -r requirements.txt

      - name: Check formatting (Black)
        timeout-minutes: 1
        run: python -m black --check --diff ${{ matrix.source-dirs }}

      - name: Lint (Flake8)
        timeout-minutes: 1
        run: python -m flake8 --jobs 1 --max-line-length=100 --extend-ignore=E501,E203,W503 ${{ matrix.source-dirs }}

  # ---- Frontend ESLint + Prettier + TypeScript ----
  frontend-lint:
    name: ESLint + Prettier + Typecheck (Frontend)
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/frontend/crm-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: TypeScript typecheck
        timeout-minutes: 2
        run: npm run typecheck

      - name: ESLint
        timeout-minutes: 2
        run: npm run lint

      - name: Prettier format check
        timeout-minutes: 1
        run: npm run format:check

  # ---- Terraform fmt + validate + tflint + checkov ----
  terraform-lint:
    name: Terraform Static Analysis
    if: inputs.run-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        timeout-minutes: 2
        with:
          terraform_version: "~1.6"

      - name: terraform fmt check
        timeout-minutes: 2
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        timeout-minutes: 5
        run: terraform init -backend=false

      - name: terraform validate
        timeout-minutes: 2
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        timeout-minutes: 3
        with:
          tflint_version: v0.53.0

      - name: TFLint init (download AWS plugin)
        timeout-minutes: 3
        run: tflint --init

      - name: Run TFLint
        timeout-minutes: 3
        run: tflint --format compact

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Install Checkov
        timeout-minutes: 3
        run: pip install checkov

      - name: Run Checkov (security & compliance scan)
        # --soft-fail reports findings without blocking the pipeline.
        # Remove --soft-fail once critical findings are resolved and
        # enforcement is desired on every merge.
        timeout-minutes: 5
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --compact \
            --quiet \
            --soft-fail

  # ---- Gitleaks secret scanner ----
  gitleaks:
    name: Gitleaks (Secret Scanning)
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Required for private repos in GitHub org accounts.
          # Obtain a free licence at https://gitleaks.io and store it as a
          # repo/org secret named GITLEAKS_LICENSE if scans fail with a
          # licence error.

  # ---- TruffleHog secret scanner ----
  trufflehog:
    name: TruffleHog (Secret Scanning)
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          extra_args: --only-verified
