name: Lint / Format / Typecheck

# Reusable workflow that runs all lint, format, and typecheck steps across the repo.
# Designed to fail fast with tight timeouts - cheapest checks first.

on:
  workflow_call:
    inputs:
      run-backend-java:
        description: 'Run Checkstyle for Java backend services'
        required: false
        type: boolean
        default: false
      run-backend-python:
        description: 'Run Black + Flake8 for Python log service'
        required: false
        type: boolean
        default: false
      run-frontend:
        description: 'Run ESLint + Prettier + TypeScript typecheck for frontend'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  # ---- Java Checkstyle (agent, client, transaction) ----
  java-checkstyle:
    name: Checkstyle (Java)
    if: inputs.run-backend-java
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        service: [agent, client, transaction]
    defaults:
      run:
        working-directory: services/backend/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle
        timeout-minutes: 3
        run: |
          chmod +x gradlew
          ./gradlew checkstyleMain checkstyleTest --no-daemon --console=plain

  # ---- Python Black + Flake8 (log service) ----
  python-lint:
    name: Black + Flake8 (Python)
    if: inputs.run-backend-python
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: services/backend/log
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/backend/log/requirements.txt

      - name: Install dependencies
        timeout-minutes: 2
        run: pip install -r requirements.txt

      - name: Check formatting (Black)
        timeout-minutes: 1
        run: python -m black --check --diff app tests

      - name: Lint (Flake8)
        timeout-minutes: 1
        run: python -m flake8 --jobs 1 --max-line-length=100 --extend-ignore=E501,E203,W503 app tests

  # ---- Frontend ESLint + Prettier + TypeScript ----
  frontend-lint:
    name: ESLint + Prettier + Typecheck (Frontend)
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/frontend/crm-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: TypeScript typecheck
        timeout-minutes: 2
        run: npm run typecheck

      - name: ESLint
        timeout-minutes: 2
        run: npm run lint

      - name: Prettier format check
        timeout-minutes: 1
        run: npm run format:check
