name: CI - Integration Pipeline

# Lean pipeline for integration.
# Purpose:
# - Avoid rerunning lint/unit/mock checks already enforced earlier in dev/component pipelines.
# - Keep only integration-specific validation before merging to main.

on:
  pull_request:
    branches:
      - integration
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - integration
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keep a lightweight CI-config sanity check.
  actionlint:
    uses: ./.github/workflows/reusable-actionlint.yml

  # Detect changed scopes so expensive fullstack runs only when relevant.
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  # Integration validation: real stack (containers + LocalStack), with Playwright in full mode.
  fullstack-integration-e2e:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.any-service == 'true' ||
           needs.changes.outputs.integration-tests == 'true' ||
           needs.changes.outputs.scripts == 'true' ||
           needs.changes.outputs.platform == 'true' ||
           needs.changes.outputs.ci-config == 'true') }}
    needs:
      - actionlint
      - changes
    uses: ./.github/workflows/reusable-fullstack-integration.yml
    with:
      fullstack-mode: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
