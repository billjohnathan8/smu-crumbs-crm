name: CI - Integration Pipeline

# Full pipeline for the integration and infrastructure trunks.
# Mirrors the local test-and-spinup-all flow:
#   lint → tests (all 5 components) → k8s-validate → kind-deploy + smoke
#
# This is the staging gate: everything must pass here before merging to main.

on:
  pull_request:
    branches:
      - integration
      - infrastructure
  push:
    branches:
      - integration
      - infrastructure
  workflow_dispatch:
    inputs:
      kind_cluster_name:
        description: 'kind cluster name (default: cs301-crm)'
        required: false
        default: 'cs301-crm'
      namespace:
        description: 'Kubernetes namespace (default: dev)'
        required: false
        default: 'dev'

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Layer 0: Detect which components changed
  # ==========================================================================
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  # Optional: Lint GitHub Actions workflows (catches YAML mistakes early)
  actionlint:
    uses: ./.github/workflows/reusable-actionlint.yml

  # ==========================================================================
  # Layer 1: Lint / Format / Typecheck
  # ==========================================================================
  lint:
    needs: changes
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: >-
        ${{ needs.changes.outputs.any-backend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-backend-python: >-
        ${{ needs.changes.outputs.backend-log == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-frontend: >-
        ${{ needs.changes.outputs.frontend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}

  # ==========================================================================
  # Layer 2: Component tests (parallel, each gated by scope)
  # ==========================================================================
  test-agent:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.backend-agent == 'true'
      || needs.changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: agent
      runtime: java
      working-directory: services/backend/agent
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/agent/build/reports/**

  test-client:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.backend-client == 'true'
      || needs.changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: client
      runtime: java
      working-directory: services/backend/client
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/client/build/reports/**

  test-transaction:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.backend-transaction == 'true'
      || needs.changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/transaction/build/reports/**

  test-log:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.backend-log == 'true'
      || needs.changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=app \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/log/build/reports/**
        services/backend/log/build/coverage.xml

  test-frontend:
    needs: [changes, lint]
    if: >-
      needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.ci-config == 'true'
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: frontend
      runtime: node
      working-directory: services/frontend/crm-ui
      test-command: npm run test:coverage
      timeout-minutes: 10
      artifact-paths: services/frontend/crm-ui/coverage/**

  # ==========================================================================
  # Layer 3: K8s manifest validation
  # ==========================================================================
  k8s-validate:
    needs:
      - changes
      - lint
      - test-agent
      - test-client
      - test-transaction
      - test-log
      - test-frontend
    if: >-
      !failure() && !cancelled()
    uses: ./.github/workflows/reusable-k8s-validate.yml

  # ==========================================================================
  # Layer 4: Kind deploy + smoke tests
  # Runs on push to integration/infrastructure or workflow_dispatch (not PRs).
  # ==========================================================================
  kind-smoke:
    needs:
      - k8s-validate
    if: >-
      !failure() && !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/reusable-kind-smoke.yml
    with:
      kind-cluster-name: ${{ github.event.inputs.kind_cluster_name || 'cs301-crm' }}
      namespace: ${{ github.event.inputs.namespace || 'dev' }}
