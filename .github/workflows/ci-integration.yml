name: CI - Integration Pipeline

# Full pipeline for the integration trunk.
# Mirrors the local test flow:
#   lint -> tests (all 5 components) -> core integration -> fullstack integration -> e2e
#
# This is the staging gate: everything must pass here before merging to main.

on:
  pull_request:
    branches:
      - integration
  push:
    branches:
      - integration
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Layer 0: Detect which components changed
  # ==========================================================================
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  # Optional: Lint GitHub Actions workflows (catches YAML mistakes early)
  actionlint:
    uses: ./.github/workflows/reusable-actionlint.yml

  # ==========================================================================
  # Layer 1: Lint / Format / Typecheck
  # ==========================================================================
  lint:
    needs: changes
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: >-
        ${{ needs.changes.outputs.any-backend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-backend-python: >-
        ${{ needs.changes.outputs.backend-log == 'true'
            || needs.changes.outputs.ci-config == 'true' }}
      run-frontend: >-
        ${{ needs.changes.outputs.frontend == 'true'
            || needs.changes.outputs.ci-config == 'true' }}

  # ==========================================================================
  # Layer 2: Component tests (parallel, each gated by scope)
  # ==========================================================================
  test-agent:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-agent == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: agent
      runtime: java
      working-directory: services/backend/agent
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/agent/build/reports/**

  test-client:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-client == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: client
      runtime: java
      working-directory: services/backend/client
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 12
      artifact-paths: services/backend/client/build/reports/**

  test-transaction:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-transaction == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: transaction
      runtime: java
      working-directory: services/backend/transaction
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/transaction/build/reports/**

  test-log:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.backend-log == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=app \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/log/build/reports/**
        services/backend/log/build/coverage.xml

  test-frontend:
    needs: [changes, lint]
    if: >-
      ${{ needs.changes.outputs.frontend == 'true'
          || needs.changes.outputs.ci-config == 'true' }}
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: frontend
      runtime: node
      working-directory: services/frontend/crm-ui
      test-command: npm run test:coverage
      timeout-minutes: 10
      artifact-paths: services/frontend/crm-ui/coverage/**

  # ==========================================================================
  # Layer 3: Core integration smoke (cross-service checks before deploy)
  # ==========================================================================
  core-integration:
    needs:
      - changes
      - actionlint
      - lint
      - test-agent
      - test-client
      - test-transaction
      - test-log
    if: >-
      ${{ always()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled')
          && (needs.changes.outputs.any-backend == 'true'
              || needs.changes.outputs.ci-config == 'true') }}
    uses: ./.github/workflows/reusable-core-integration.yml

  # ==========================================================================
  # Layer 4: Containerized fullstack integration (real backend+frontend E2E)
  # ==========================================================================
  fullstack-integration-e2e:
    needs:
      - changes
      - actionlint
      - test-frontend
      - core-integration
    if: >-
      ${{ always()
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled')
          && (needs.changes.outputs.any-service == 'true'
              || needs.changes.outputs.ci-config == 'true') }}
    uses: ./.github/workflows/reusable-fullstack-integration.yml

  e2e-frontend:
    name: E2E Tests - Frontend
    needs: [changes, test-frontend, fullstack-integration-e2e]
    if: >-
      ${{ !failure() && !cancelled()
          && (needs.changes.outputs.frontend == 'true'
              || needs.changes.outputs.ci-config == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend/crm-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        timeout-minutes: 10
        run: npm run e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-integration
          path: |
            services/frontend/crm-ui/test-results/
            services/frontend/crm-ui/playwright-report/
          retention-days: 7
