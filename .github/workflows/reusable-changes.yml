name: Detect Changed Components

# Reusable workflow that computes boolean outputs per scope using dorny/paths-filter.
# Callers use outputs to conditionally skip unaffected jobs.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Optional git ref or commit SHA to checkout and diff'
        required: false
        type: string
        default: ''
      base:
        description: 'Optional base ref or commit SHA to diff against'
        required: false
        type: string
        default: ''
    outputs:
      backend-aml:
        description: 'true if services/backend/aml changed'
        value: ${{ jobs.detect.outputs.backend-aml }}
      backend-user:
        description: 'true if services/backend/user changed'
        value: ${{ jobs.detect.outputs.backend-user }}
      backend-client:
        description: 'true if services/backend/client changed'
        value: ${{ jobs.detect.outputs.backend-client }}
      backend-transaction:
        description: 'true if services/backend/transaction changed'
        value: ${{ jobs.detect.outputs.backend-transaction }}
      backend-log:
        description: 'true if services/backend/log changed'
        value: ${{ jobs.detect.outputs.backend-log }}
      backend-verification:
        description: 'true if services/backend/verification changed'
        value: ${{ jobs.detect.outputs.backend-verification }}
      backend-sftp-transaction-collector:
        description: 'true if services/backend/sftp-transaction-collector changed'
        value: ${{ jobs.detect.outputs.backend-sftp-transaction-collector }}
      backend-audit-consumer:
        description: 'true if services/backend/audit-consumer changed'
        value: ${{ jobs.detect.outputs.backend-audit-consumer }}
      backend-aml-consumer:
        description: 'true if services/backend/aml-consumer changed'
        value: ${{ jobs.detect.outputs.backend-aml-consumer }}
      frontend:
        description: 'true if services/frontend/crm-ui changed'
        value: ${{ jobs.detect.outputs.frontend }}
      integration-tests:
        description: 'true if tests/integration changed'
        value: ${{ jobs.detect.outputs.integration-tests }}
      scripts:
        description: 'true if scripts/ or Makefile changed'
        value: ${{ jobs.detect.outputs.scripts }}
      ci-config:
        description: 'true if .github/workflows changed'
        value: ${{ jobs.detect.outputs.ci-config }}
      any-backend:
        description: 'true if any backend service changed'
        value: ${{ jobs.detect.outputs.any-backend }}
      any-service:
        description: 'true if any service (backend or frontend) changed'
        value: ${{ jobs.detect.outputs.any-service }}
      platform:
        description: 'true if platform/ (Terraform/k8s) changed'
        value: ${{ jobs.detect.outputs.platform }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend-aml: ${{ steps.filter.outputs.backend-aml }}
      backend-user: ${{ steps.filter.outputs.backend-user }}
      backend-client: ${{ steps.filter.outputs.backend-client }}
      backend-transaction: ${{ steps.filter.outputs.backend-transaction }}
      backend-log: ${{ steps.filter.outputs.backend-log }}
      backend-verification: ${{ steps.filter.outputs.backend-verification }}
      backend-sftp-transaction-collector: ${{ steps.filter.outputs.backend-sftp-transaction-collector }}
      backend-audit-consumer: ${{ steps.filter.outputs.backend-audit-consumer }}
      backend-aml-consumer: ${{ steps.filter.outputs.backend-aml-consumer }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration-tests: ${{ steps.filter.outputs.integration-tests }}
      scripts: ${{ steps.filter.outputs.scripts }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      any-backend: ${{ steps.aggregate.outputs.any-backend }}
      any-service: ${{ steps.aggregate.outputs.any-service }}
      platform: ${{ steps.filter.outputs.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for reliable change detection
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Resolve diff refs
        id: refs
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BASE: ${{ inputs.base }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail

          REF="${INPUT_REF}"
          if [[ -z "${REF}" ]]; then
            if [[ -n "${WORKFLOW_RUN_SHA}" ]]; then
              REF="${WORKFLOW_RUN_SHA}"
            else
              REF="${EVENT_SHA}"
            fi
          fi

          BASE="${INPUT_BASE}"
          if [[ -z "${BASE}" ]]; then
            if [[ -n "${PR_BASE_SHA}" ]]; then
              BASE="${PR_BASE_SHA}"
            elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              BASE="${BEFORE_SHA}"
            elif git rev-parse "${REF}^" >/dev/null 2>&1; then
              BASE="$(git rev-parse "${REF}^")"
            else
              BASE="${REF}"
            fi
          fi

          {
            echo "ref=${REF}"
            echo "base=${BASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.refs.outputs.base }}
          ref: ${{ steps.refs.outputs.ref }}
          list-files: shell
          filters: |
            backend-aml:
              - 'services/backend/aml/**'
            backend-user:
              - 'services/backend/user/**'
            backend-client:
              - 'services/backend/client/**'
            backend-transaction:
              - 'services/backend/transaction/**'
            backend-log:
              - 'services/backend/log/**'
            backend-verification:
              - 'services/backend/verification/**'
            backend-sftp-transaction-collector:
              - 'services/backend/sftp-transaction-collector/**'
            backend-audit-consumer:
              - 'services/backend/audit-consumer/**'
            backend-aml-consumer:
              - 'services/backend/aml-consumer/**'
            frontend:
              - 'services/frontend/crm-ui/**'
            integration-tests:
              - 'tests/integration/**'
            scripts:
              - 'scripts/**'
              - 'Makefile'
            ci-config:
              - '.github/workflows/**'
              - '.github/actions/**'
            platform:
              - 'platform/**'

      - name: Compute aggregate flags
        id: aggregate
        run: |
          ANY_BACKEND="false"
           if [[ "${{ steps.filter.outputs.backend-aml }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-user }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-client }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-transaction }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-log }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-verification }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-sftp-transaction-collector }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-audit-consumer }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.backend-aml-consumer }}" == "true" ]]; then
            ANY_BACKEND="true"
          fi

          ANY_SERVICE="false"
          if [[ "${ANY_BACKEND}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.frontend }}" == "true" ]]; then
            ANY_SERVICE="true"
          fi

          {
            echo "any-backend=${ANY_BACKEND}"
            echo "any-service=${ANY_SERVICE}"
          } >> "$GITHUB_OUTPUT"

      - name: Debug changed files
        run: |
          {
            echo "### Changed Files (paths-filter)"
            echo
            if [[ -n "${{ steps.filter.outputs.changes }}" ]]; then
              echo "${{ steps.filter.outputs.changes }}"
            else
              echo "(No files reported)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### Changed Components"
            echo "| Scope | Changed |"
            echo "|-------|---------|"
            echo "| backend-aml | ${{ steps.filter.outputs.backend-aml }} |"
            echo "| backend-user | ${{ steps.filter.outputs.backend-user }} |"
            echo "| backend-client | ${{ steps.filter.outputs.backend-client }} |"
            echo "| backend-transaction | ${{ steps.filter.outputs.backend-transaction }} |"
            echo "| backend-log | ${{ steps.filter.outputs.backend-log }} |"
            echo "| backend-verification | ${{ steps.filter.outputs.backend-verification }} |"
            echo "| backend-sftp-transaction-collector | ${{ steps.filter.outputs.backend-sftp-transaction-collector }} |"
            echo "| backend-audit-consumer | ${{ steps.filter.outputs.backend-audit-consumer }} |"
            echo "| backend-aml-consumer | ${{ steps.filter.outputs.backend-aml-consumer }} |"
            echo "| frontend | ${{ steps.filter.outputs.frontend }} |"
            echo "| integration-tests | ${{ steps.filter.outputs.integration-tests }} |"
            echo "| scripts | ${{ steps.filter.outputs.scripts }} |"
            echo "| ci-config | ${{ steps.filter.outputs.ci-config }} |"
            echo "| platform | ${{ steps.filter.outputs.platform }} |"
          } >> "$GITHUB_STEP_SUMMARY"
