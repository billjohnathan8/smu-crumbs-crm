name: CD - Main Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Ensure that only one deployment runs at a time to the main environment.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  deploy-user:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-user == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: user
    secrets: inherit

  deploy-client:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-client == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: client
    secrets: inherit

  deploy-transaction:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-transaction == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-ecs-deploy.yml
    with:
      service: transaction
    secrets: inherit

  deploy-aml:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-aml == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: aml
    secrets: inherit

  deploy-verification:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-verification == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: verification
    secrets: inherit

  deploy-sftp-transaction-collector:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-sftp-transaction-collector == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: sftp-transaction-collector
    secrets: inherit

  deploy-aml-consumer:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-aml-consumer == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: aml-consumer
    secrets: inherit

  deploy-audit-consumer:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-audit-consumer == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: audit-consumer
    secrets: inherit

  deploy-log:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-log == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-deploy.yml
    with:
      service: log
    secrets: inherit

  deploy-frontend:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.frontend == 'true') }}
    needs:
      - changes
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    secrets: inherit

  merge-ecs-intents:
    if: >-
      ${{ always() && !cancelled() &&
          (needs.deploy-user.result == 'success' ||
           needs.deploy-client.result == 'success' ||
           needs.deploy-transaction.result == 'success') }}
    needs:
      - changes
      - deploy-user
      - deploy-client
      - deploy-transaction
    runs-on: ubuntu-latest
    steps:
      - name: Download ECS intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-ecs-*
          path: deploy-intents-ecs
          merge-multiple: true

      - name: Merge ECS intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, ecs:{}}' > manifest-ecs.json

          shopt -s nullglob
          fragments=(deploy-intents-ecs/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No ECS intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            service="$(jq -r '.ecs.service' "${fragment}")"
            jq \
              --arg service "${service}" \
              --slurpfile f "${fragment}" \
              '.ecs[$service] = {
                image_repo: $f[0].ecs.image_repo,
                image_tag: $f[0].ecs.image_tag,
                cluster: $f[0].ecs.cluster,
                task_definition_arn: $f[0].ecs.task_definition_arn,
                image_ref: $f[0].ecs.image_ref
              }' manifest-ecs.json > manifest-ecs.next.json
            mv manifest-ecs.next.json manifest-ecs.json
          done

      - name: Upload merged ECS manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-ecs
          path: manifest-ecs.json
          if-no-files-found: error

  merge-lambda-intents:
    if: >-
      ${{ always() && !cancelled() &&
          (needs.deploy-aml.result == 'success' ||
           needs.deploy-verification.result == 'success' ||
           needs.deploy-sftp-transaction-collector.result == 'success' ||
           needs.deploy-aml-consumer.result == 'success' ||
           needs.deploy-audit-consumer.result == 'success' ||
           needs.deploy-log.result == 'success') }}
    needs:
      - changes
      - deploy-aml
      - deploy-verification
      - deploy-sftp-transaction-collector
      - deploy-aml-consumer
      - deploy-audit-consumer
      - deploy-log
    runs-on: ubuntu-latest
    steps:
      - name: Download Lambda intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-lambda-*
          path: deploy-intents-lambda
          merge-multiple: true

      - name: Merge Lambda intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, lambda:{}}' > manifest-lambda.json

          shopt -s nullglob
          fragments=(deploy-intents-lambda/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No Lambda intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            function_name="$(jq -r '.lambda.function_name' "${fragment}")"
            jq \
              --arg function_name "${function_name}" \
              --slurpfile f "${fragment}" \
              '.lambda[$function_name] = {
                s3_key: $f[0].lambda.s3_key,
                published_version: $f[0].lambda.published_version,
                version_arn: $f[0].lambda.version_arn,
                alias: $f[0].lambda.alias,
                alias_action: $f[0].lambda.alias_action
              }' manifest-lambda.json > manifest-lambda.next.json
            mv manifest-lambda.next.json manifest-lambda.json
          done

      - name: Upload merged Lambda manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-lambda
          path: manifest-lambda.json
          if-no-files-found: error

  merge-frontend-intents:
    if: >-
      ${{ always() && !cancelled() &&
          needs.deploy-frontend.result == 'success' }}
    needs:
      - changes
      - deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend intent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: intent-frontend-*
          path: deploy-intents-frontend
          merge-multiple: true

      - name: Merge frontend intent fragments
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" '{repo_sha:$repo_sha, created_at:$created_at, frontend:{}}' > manifest-frontend.json

          shopt -s nullglob
          fragments=(deploy-intents-frontend/*.json)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "No frontend intent artifacts were found"
            exit 1
          fi

          for fragment in "${fragments[@]}"; do
            site="$(jq -r '.frontend.site' "${fragment}")"
            jq \
              --arg site "${site}" \
              --slurpfile f "${fragment}" \
              '.frontend[$site] = {
                bucket: $f[0].frontend.bucket,
                deployed_version: $f[0].frontend.deployed_version,
                release_prefix: $f[0].frontend.release_prefix,
                build_output_dir: $f[0].frontend.build_output_dir,
                cloudfront_distribution_id: $f[0].frontend.cloudfront_distribution_id,
                cloudfront_invalidation_paths: $f[0].frontend.cloudfront_invalidation_paths
              }' manifest-frontend.json > manifest-frontend.next.json
            mv manifest-frontend.next.json manifest-frontend.json
          done

      - name: Upload merged frontend manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-frontend
          path: manifest-frontend.json
          if-no-files-found: error

  merge-and-publish-manifest:
    if: >-
      ${{ always() && !cancelled() &&
          (needs.merge-ecs-intents.result == 'success' ||
           needs.merge-lambda-intents.result == 'success' ||
           needs.merge-frontend-intents.result == 'success') }}
    needs:
      - changes
      - merge-ecs-intents
      - merge-lambda-intents
      - merge-frontend-intents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      MANIFEST_BUCKET: ${{ vars.BACKEND_BUCKET }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.BACKEND_BUCKET }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download grouped ECS manifest artifact
        if: >-
          ${{ needs.merge-ecs-intents.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-ecs
          path: manifests

      - name: Download grouped Lambda manifest artifact
        if: >-
          ${{ needs.merge-lambda-intents.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-lambda
          path: manifests

      - name: Download grouped frontend manifest artifact
        if: >-
          ${{ needs.merge-frontend-intents.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: manifest-frontend
          path: manifests

      - name: Merge changed intents into current manifest
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CURRENT_KEY="manifests/prod/current.json"

          # Fetch current manifest from S3. If it does not exist yet, start with an empty manifest.
          if aws s3 cp "s3://${MANIFEST_BUCKET}/${CURRENT_KEY}" current.json >/dev/null 2>&1; then
            echo "Loaded current manifest from s3://${MANIFEST_BUCKET}/${CURRENT_KEY}"
          else
            echo "No existing current.json found. Initializing a new manifest."
            jq -n --arg repo_sha "${REPO_SHA}" --arg created_at "${NOW_UTC}" \
              '{repo_sha:$repo_sha, created_at:$created_at, ecs:{}, lambda:{}, frontend:{}}' > current.json
          fi

          # Normalize the document shape to ensure expected keys exist.
          jq -n \
            --arg repo_sha "${REPO_SHA}" \
            --arg created_at "${NOW_UTC}" \
            --slurpfile current current.json \
            '($current[0] // {})
            | .repo_sha = $repo_sha
            | .created_at = $created_at
            | .ecs = (.ecs // {})
            | .lambda = (.lambda // {})
            | .frontend = (.frontend // {})' > manifest.json

          if [[ -f manifests/manifest-ecs.json ]]; then
            jq \
              --slurpfile ecs manifests/manifest-ecs.json \
              '.ecs = ((.ecs // {}) + ($ecs[0].ecs // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          if [[ -f manifests/manifest-lambda.json ]]; then
            jq \
              --slurpfile lambda manifests/manifest-lambda.json \
              '.lambda = ((.lambda // {}) + ($lambda[0].lambda // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          if [[ -f manifests/manifest-frontend.json ]]; then
            jq \
              --slurpfile frontend manifests/manifest-frontend.json \
              '.frontend = ((.frontend // {}) + ($frontend[0].frontend // {}))' manifest.json > manifest.next.json
            mv manifest.next.json manifest.json
          fi

          jq -e . manifest.json > /dev/null

          echo "--- DEBUG: Final Updated Manifest ---"
          cat manifest.json
          echo "-------------------------------------"

      - name: Upload merged manifest to S3
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          aws s3 cp manifest.json "s3://${MANIFEST_BUCKET}/manifests/prod/current.json"
          aws s3 cp manifest.json "s3://${MANIFEST_BUCKET}/manifests/prod/git/${REPO_SHA}.json"

      - name: Manifest summary
        run: |
          echo "Wrote current manifest: s3://${{ env.MANIFEST_BUCKET }}/manifests/prod/current.json"
          echo "Wrote immutable manifest: s3://${{ env.MANIFEST_BUCKET }}/manifests/prod/git/${{ github.sha }}.json"