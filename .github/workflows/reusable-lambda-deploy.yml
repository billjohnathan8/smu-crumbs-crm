name: Reusable - Lambda Artifact Deploy

on:
  workflow_call:
    inputs:
      service:
        description: Lambda service folder name under services/backend
        required: true
        type: string
      python_version:
        description: Python version used to build the Lambda artifact
        required: false
        type: string
        default: '3.13'
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      LAMBDA_ARTIFACT_BUCKET:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  package-upload:
    name: Package and upload (${{ inputs.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}
      LAMBDA_SERVICE_NAME: ${{ inputs.service }}
      LAMBDA_WORKING_DIRECTORY: services/backend/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}"
          test -n "${{ secrets.AWS_REGION }}"
          test -n "${{ secrets.LAMBDA_ARTIFACT_BUCKET }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: ${{ env.LAMBDA_WORKING_DIRECTORY }}/requirements.txt

      - name: Build Lambda zip artifact
        id: package
        working-directory: ${{ env.LAMBDA_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/package

          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt --target build/package
          fi

          rsync -a ./ build/package/ \
            --exclude build \
            --exclude tests \
            --exclude venv \
            --exclude .pytest_cache \
            --exclude __pycache__ \
            --exclude '*.zip' \
            --exclude pyproject.toml \
            --exclude README.md

          artifact_name="${GITHUB_SHA}.zip"
          artifact_path="build/${artifact_name}"
          s3_key="services/lambda/${LAMBDA_SERVICE_NAME}/${artifact_name}"

          (
            cd build/package
            zip -r "../${artifact_name}" . \
              -x "*.pyc" \
              -x "*/__pycache__/*"
          )

          {
            echo "artifact_name=${artifact_name}"
            echo "artifact_path=${artifact_path}"
            echo "s3_key=${s3_key}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Lambda zip to S3
        run: |
          aws s3 cp \
            "${{ env.LAMBDA_WORKING_DIRECTORY }}/${{ steps.package.outputs.artifact_path }}" \
            "s3://${{ env.LAMBDA_ARTIFACT_BUCKET }}/${{ steps.package.outputs.s3_key }}"

      - name: Update Lambda function code
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_SERVICE_NAME }}" \
            --s3-bucket "${{ env.LAMBDA_ARTIFACT_BUCKET }}" \
            --s3-key "${{ steps.package.outputs.s3_key }}" \
            --publish > lambda-publish.json

          PUBLISHED_VERSION="$(jq -r '.Version' lambda-publish.json)"
          VERSION_ARN="$(jq -r '.FunctionArn' lambda-publish.json)"

          {
            echo "published_version=${PUBLISHED_VERSION}"
            echo "version_arn=${VERSION_ARN}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure prod alias points to published version
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_NAME="${{ env.LAMBDA_SERVICE_NAME }}"
          PUBLISHED_VERSION="${{ steps.publish.outputs.published_version }}"

          if aws lambda get-alias --function-name "${FUNCTION_NAME}" --name prod >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "${FUNCTION_NAME}" \
              --name prod \
              --function-version "${PUBLISHED_VERSION}" >/dev/null
            echo "Updated existing prod alias"
          else
            aws lambda create-alias \
              --function-name "${FUNCTION_NAME}" \
              --name prod \
              --function-version "${PUBLISHED_VERSION}" >/dev/null
            echo "Created prod alias"
          fi

      - name: Update deployment manifest (Lambda)
        shell: bash
        env:
          MANIFEST_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          FUNCTION_NAME="${{ env.LAMBDA_SERVICE_NAME }}"
          S3_KEY="${{ steps.package.outputs.s3_key }}"
          PUBLISHED_VERSION="${{ steps.publish.outputs.published_version }}"
          VERSION_ARN="${{ steps.publish.outputs.version_arn }}"

          CURRENT_KEY="manifests/prod/current.json"
          GIT_KEY="manifests/prod/git/${REPO_SHA}.json"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if aws s3api head-object --bucket "${MANIFEST_BUCKET}" --key "${CURRENT_KEY}" >/dev/null 2>&1; then
            aws s3 cp "s3://${MANIFEST_BUCKET}/${CURRENT_KEY}" manifest-prev.json
          else
            jq -n '{repo_sha:"", created_at:"", ecs:{}, lambda:{}}' > manifest-prev.json
          fi

          jq \
            --arg repo_sha "${REPO_SHA}" \
            --arg created_at "${NOW_UTC}" \
            --arg function_name "${FUNCTION_NAME}" \
            --arg s3_key "${S3_KEY}" \
            --arg published_version "${PUBLISHED_VERSION}" \
            --arg version_arn "${VERSION_ARN}" \
            '
            .repo_sha = $repo_sha
            | .created_at = $created_at
            | .ecs = (.ecs // {})
            | .lambda = (.lambda // {})
            | .lambda[$function_name] = {
                s3_key: $s3_key,
                published_version: $published_version,
                version_arn: $version_arn,
                alias: "prod"
              }
            ' manifest-prev.json > manifest-next.json

          aws s3 cp manifest-next.json "s3://${MANIFEST_BUCKET}/${GIT_KEY}"
          aws s3 cp manifest-next.json "s3://${MANIFEST_BUCKET}/${CURRENT_KEY}"

      - name: Deployment summary
        run: |
          echo "Lambda: ${{ env.LAMBDA_SERVICE_NAME }}"
          echo "Artifact: ${{ steps.package.outputs.artifact_name }}"
          echo "Uploaded to: s3://${{ env.LAMBDA_ARTIFACT_BUCKET }}/${{ steps.package.outputs.s3_key }}"
          echo "Updated function: ${{ env.LAMBDA_SERVICE_NAME }}"
          echo "Published version: ${{ steps.publish.outputs.published_version }}"
          echo "Version ARN: ${{ steps.publish.outputs.version_arn }}"
          echo "Alias: prod"