name: CD - Terraform Infra Plan
# Smart idempotent plan: bootstrap → clean stale → reconcile → plan → upload artifacts.
# Auto-handles pending-deletion secrets and state reconciliation (no manual toggles).
#
# After reviewing the plan output, copy the commit SHA and run
# "CD - Terraform Infra Provision" with that SHA to apply+deploy.

on:
  workflow_dispatch:
    inputs:
      terraform_targets:
        description: "Optional comma-separated Terraform target addresses (for scoped hotfix plans)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cd-tf-infra-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-plan:
    name: Terraform plan (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}
      APP_DOMAIN_NAME: ${{ vars.TF_APP_DOMAIN_NAME }}

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_ROOT_ADMIN_PASSWORD_SECRET: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          TF_JWT_HMAC_SECRET_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
          TF_PII_ENCRYPTION_KEY_SECRET: ${{ secrets.TF_PII_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}" || { echo "::error::Missing GitHub variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "::error::Missing GitHub variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "::error::Missing GitHub variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "::error::Missing secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "::error::Missing secret: AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${TF_ROOT_ADMIN_PASSWORD_SECRET:-}" || { echo "::error::Missing secret: TF_ROOT_ADMIN_PASSWORD"; exit 1; }
          test -n "${TF_JWT_HMAC_SECRET_SECRET:-}" || { echo "::error::Missing secret: TF_JWT_HMAC_SECRET"; exit 1; }
          if [[ -z "${TF_PII_ENCRYPTION_KEY_SECRET:-}" ]]; then
            echo "::warning::Secret TF_PII_ENCRYPTION_KEY is not set. Terraform may auto-generate a new key."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture plan metadata
        id: plan_meta
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "account_id=${ACCOUNT_ID}"
            echo "binary_artifact_name=${COMMIT_SHA}_tf_plan.binary"
            echo "text_artifact_name=${COMMIT_SHA}_tf_plan.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Terraform prod configuration contract
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_FILE="env/prod.backend.hcl"
          TFVARS_FILE="env/prod.tfvars"

          BACKEND_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          TFVARS_REGION="$(awk -F= '/^[[:space:]]*aws_region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${TFVARS_FILE}")"
          VERIFICATION_ENABLED="$(awk -F= '/^[[:space:]]*enable_verification_pipeline[[:space:]]*=/{value=$2; sub(/#.*/, "", value); gsub(/[[:space:]]/, "", value); print tolower(value); exit}' "${TFVARS_FILE}")"

          [[ "${BACKEND_BUCKET}" == "${TF_STATE_BUCKET}" ]] || { echo "::error::prod.backend.hcl bucket (${BACKEND_BUCKET}) != vars.TF_STATE_BUCKET (${TF_STATE_BUCKET})"; exit 1; }
          [[ "${BACKEND_REGION}" == "${AWS_REGION}" ]] || { echo "::error::prod.backend.hcl region (${BACKEND_REGION}) != vars.AWS_REGION (${AWS_REGION})"; exit 1; }
          [[ "${BACKEND_LOCK_TABLE}" == "${TF_LOCK_DYNAMODB}" ]] || { echo "::error::prod.backend.hcl lock table (${BACKEND_LOCK_TABLE}) != vars.TF_LOCK_DYNAMODB (${TF_LOCK_DYNAMODB})"; exit 1; }
          [[ -z "${TFVARS_REGION}" || "${TFVARS_REGION}" == "${AWS_REGION}" ]] || { echo "::error::prod.tfvars region (${TFVARS_REGION}) != vars.AWS_REGION (${AWS_REGION})"; exit 1; }

          if [[ "${VERIFICATION_ENABLED}" == "true" && -z "${APP_DOMAIN_NAME}" ]]; then
            echo "::error::Verification pipeline enabled but vars.TF_APP_DOMAIN_NAME is not set."
            exit 1
          fi

      - name: Create runtime Terraform override file
        working-directory: ${{ env.TF_DIR }}
        env:
          ROOT_ADMIN_PASSWORD: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          JWT_HMAC_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
          PII_ENCRYPTION_KEY: ${{ secrets.TF_PII_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${ROOT_ADMIN_PASSWORD}"
          echo "::add-mask::${JWT_HMAC_SECRET}"
          echo "::add-mask::${PII_ENCRYPTION_KEY}"
          {
            echo "root_admin_password = $(jq -Rn --arg v "$ROOT_ADMIN_PASSWORD" '$v')"
            echo "jwt_hmac_secret = $(jq -Rn --arg v "$JWT_HMAC_SECRET" '$v')"
            if [[ -n "${PII_ENCRYPTION_KEY}" ]]; then
              echo "pii_encryption_key = $(jq -Rn --arg v "$PII_ENCRYPTION_KEY" '$v')"
            fi
            if [[ -n "${APP_DOMAIN_NAME}" ]]; then
              echo "app_domain_name = $(jq -Rn --arg v "$APP_DOMAIN_NAME" '$v')"
            fi
          } > runtime.auto.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Ensure Terraform Lambda zip artifacts exist
        shell: bash
        run: python3 .github/scripts/build_tf_lambda_zips.py

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      # ── Smart reconciliation (automatic) ─────────────────────────
      - name: Clean stale Secrets Manager secrets (pending-deletion only)
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_NAME="${TF_PROJECT_NAME:-scroogebank-crm}"

          clean_stale_secret() {
            local secret_name="$1"

            if ! aws secretsmanager describe-secret --secret-id "${secret_name}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "[stale-clean] Absent (OK): ${secret_name}"
              return 0
            fi

            local deleted_date
            deleted_date="$(aws secretsmanager describe-secret \
              --secret-id "${secret_name}" \
              --region "${AWS_REGION}" \
              --query 'DeletedDate' \
              --output text 2>/dev/null || true)"

            if [[ -z "${deleted_date}" || "${deleted_date}" == "None" ]]; then
              echo "[stale-clean] Active (OK): ${secret_name}"
              return 0
            fi

            echo "[stale-clean] Pending deletion - restoring then force deleting: ${secret_name}"
            aws secretsmanager restore-secret --secret-id "${secret_name}" --region "${AWS_REGION}" >/dev/null

            for _ in {1..24}; do
              local check_date
              check_date="$(aws secretsmanager describe-secret \
                --secret-id "${secret_name}" \
                --region "${AWS_REGION}" \
                --query 'DeletedDate' \
                --output text 2>/dev/null || true)"
              if [[ -z "${check_date}" || "${check_date}" == "None" ]]; then
                break
              fi
              sleep 5
            done

            aws secretsmanager delete-secret \
              --secret-id "${secret_name}" \
              --region "${AWS_REGION}" \
              --force-delete-without-recovery >/dev/null

            for _ in {1..24}; do
              if ! aws secretsmanager describe-secret --secret-id "${secret_name}" --region "${AWS_REGION}" >/dev/null 2>&1; then
                echo "[stale-clean] Force deleted: ${secret_name}"
                return 0
              fi
              sleep 5
            done

            echo "::warning::Timed out waiting for secret deletion: ${secret_name}"
          }

          clean_stale_secret "/${PROJECT_NAME}/${DEPLOY_ENV}/jwt/hmac_secret"
          clean_stale_secret "/${PROJECT_NAME}/${DEPLOY_ENV}/user/root_admin_password"
          clean_stale_secret "/${PROJECT_NAME}/${DEPLOY_ENV}/db/username"
          clean_stale_secret "/${PROJECT_NAME}/${DEPLOY_ENV}/db/password"

          # Also clean orphaned VPC flow log group if not in state
          RESOURCE_COUNT="$(terraform state list 2>/dev/null | wc -l || echo 0)"
          if [[ "${RESOURCE_COUNT}" -eq 0 ]]; then
            VPC_FLOW_LOG_GROUP="/aws/vpc/${PROJECT_NAME}-${DEPLOY_ENV}-flow-logs"
            LOG_GROUP_COUNT="$(aws logs describe-log-groups \
              --region "${AWS_REGION}" \
              --log-group-name-prefix "${VPC_FLOW_LOG_GROUP}" \
              --query "length(logGroups[?logGroupName == '${VPC_FLOW_LOG_GROUP}'])" \
              --output text 2>/dev/null || echo 0)"
            if [[ "${LOG_GROUP_COUNT}" != "0" && "${LOG_GROUP_COUNT}" != "None" ]]; then
              echo "[stale-clean] Deleting orphaned VPC flow log group: ${VPC_FLOW_LOG_GROUP}"
              aws logs delete-log-group --log-group-name "${VPC_FLOW_LOG_GROUP}" --region "${AWS_REGION}" || true
            fi
          fi

      - name: Reconcile existing AWS resources into Terraform state
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Running idempotent state reconciliation..."
          bash scripts/reconcile-existing-resources.sh "${DEPLOY_ENV}"

      # ── Plan ─────────────────────────────────────────────────────
      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TERRAFORM_TARGETS: ${{ inputs.terraform_targets }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ARGS=()
          if [[ -n "${TERRAFORM_TARGETS}" ]]; then
            IFS=',' read -ra RAW_TARGETS <<< "${TERRAFORM_TARGETS}"
            for t in "${RAW_TARGETS[@]}"; do
              target_trimmed="$(echo "$t" | xargs)"
              if [[ -n "${target_trimmed}" ]]; then
                TARGET_ARGS+=("-target=${target_trimmed}")
              fi
            done
          fi
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            -var-file="env/${DEPLOY_ENV}.tfvars" \
            -var-file="runtime.auto.tfvars" \
            "${TARGET_ARGS[@]}" \
            -out=tfplan

      - name: Export plan text
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform show -no-color tfplan > terraform-plan.txt

      - name: Upload reviewed binary plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan_meta.outputs.binary_artifact_name }}
          path: platform/terraform/tfplan
          retention-days: 30

      - name: Upload reviewed text plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan_meta.outputs.text_artifact_name }}
          path: platform/terraform/terraform-plan.txt
          retention-days: 30

      - name: Publish plan summary
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PLAN_RESULT_LINE="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\.)' terraform-plan.txt | tail -n 1 || true)"
          if [[ -z "${PLAN_RESULT_LINE}" ]]; then
            PLAN_RESULT_LINE="Plan output exported to artifact for review."
          fi

          {
            echo "## Terraform Infra Plan Summary"
            echo
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Commit SHA | \`${{ steps.plan_meta.outputs.commit_sha }}\` |"
            echo "| AWS Account | ${{ steps.plan_meta.outputs.account_id }} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Targets | \`${{ inputs.terraform_targets || 'full-plan' }}\` |"
            echo
            echo "**Plan result:** ${PLAN_RESULT_LINE}"
            echo
            echo "**Artifacts:**"
            echo "- Binary plan: \`${{ steps.plan_meta.outputs.binary_artifact_name }}\`"
            echo "- Text plan: \`${{ steps.plan_meta.outputs.text_artifact_name }}\`"
            echo
            echo "---"
            echo
            echo "### Next step"
            echo "Review the text plan artifact above, then run **CD - Terraform Infra Provision** with:"
            echo
            echo "\`\`\`"
            echo "reviewed_commit_sha: ${{ steps.plan_meta.outputs.commit_sha }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Terraform working files
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: rm -f runtime.auto.tfvars tfplan terraform-plan.txt
