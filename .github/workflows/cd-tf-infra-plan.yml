name: CD - Terraform Infra Plan
# Bootstrap Terraform backend and generate a reviewed production plan.

on:
  workflow_dispatch:
    inputs:
      reconcile_existing_resources:
        description: Run one-time state reconciliation imports (normally false for already-managed infra)
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: cd-tf-infra-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-plan:
    name: Terraform plan (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}
      APP_DOMAIN_NAME: ${{ vars.TF_APP_DOMAIN_NAME }}

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_ROOT_ADMIN_PASSWORD_SECRET: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          TF_JWT_HMAC_SECRET_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${AWS_REGION}" || { echo "Missing required GitHub Actions variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "Missing required GitHub Actions variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "Missing required GitHub Actions variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "Missing required secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "Missing required secret: AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${TF_ROOT_ADMIN_PASSWORD_SECRET:-}" || { echo "Missing required secret: TF_ROOT_ADMIN_PASSWORD"; exit 1; }
          test -n "${TF_JWT_HMAC_SECRET_SECRET:-}" || { echo "Missing required secret: TF_JWT_HMAC_SECRET"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture plan metadata
        id: plan_meta
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "account_id=${ACCOUNT_ID}"
            echo "binary_artifact_name=${COMMIT_SHA}_tf_plan.binary"
            echo "text_artifact_name=${COMMIT_SHA}_tf_plan.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Terraform prod configuration contract
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_FILE="env/prod.backend.hcl"
          TFVARS_FILE="env/prod.tfvars"

          BACKEND_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          TFVARS_REGION="$(awk -F= '/^[[:space:]]*aws_region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${TFVARS_FILE}")"
          VERIFICATION_ENABLED="$(awk -F= '/^[[:space:]]*enable_verification_pipeline[[:space:]]*=/{value=$2; sub(/#.*/, "", value); gsub(/[[:space:]]/, "", value); print tolower(value); exit}' "${TFVARS_FILE}")"

          [[ "${BACKEND_BUCKET}" == "${TF_STATE_BUCKET}" ]] || { echo "prod.backend.hcl bucket (${BACKEND_BUCKET}) does not match vars.TF_STATE_BUCKET (${TF_STATE_BUCKET})"; exit 1; }
          [[ "${BACKEND_REGION}" == "${AWS_REGION}" ]] || { echo "prod.backend.hcl region (${BACKEND_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }
          [[ "${BACKEND_LOCK_TABLE}" == "${TF_LOCK_DYNAMODB}" ]] || { echo "prod.backend.hcl dynamodb_table (${BACKEND_LOCK_TABLE}) does not match vars.TF_LOCK_DYNAMODB (${TF_LOCK_DYNAMODB})"; exit 1; }
          [[ -z "${TFVARS_REGION}" || "${TFVARS_REGION}" == "${AWS_REGION}" ]] || { echo "prod.tfvars aws_region (${TFVARS_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }

          if [[ "${VERIFICATION_ENABLED}" == "true" && -z "${APP_DOMAIN_NAME}" ]]; then
            echo "Production verification is enabled in env/prod.tfvars, but vars.APP_DOMAIN_NAME is not set."
            exit 1
          fi

      - name: Create runtime Terraform override file
        working-directory: ${{ env.TF_DIR }}
        env:
          ROOT_ADMIN_PASSWORD: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          JWT_HMAC_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${ROOT_ADMIN_PASSWORD}"
          echo "::add-mask::${JWT_HMAC_SECRET}"

          {
            echo "root_admin_password = $(jq -Rn --arg v "$ROOT_ADMIN_PASSWORD" '$v')"
            echo "jwt_hmac_secret = $(jq -Rn --arg v "$JWT_HMAC_SECRET" '$v')"
            if [[ -n "${APP_DOMAIN_NAME}" ]]; then
              echo "app_domain_name = $(jq -Rn --arg v "$APP_DOMAIN_NAME" '$v')"
            fi
          } > runtime.auto.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Ensure Terraform Lambda zip artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/build_tf_lambda_zips.py

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      - name: Reconcile pre-existing AWS resources into Terraform state
        if: ${{ inputs.reconcile_existing_resources }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: bash scripts/reconcile-existing-resources.sh "${DEPLOY_ENV}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -lock-timeout=300s \
            -var-file="env/${DEPLOY_ENV}.tfvars" \
            -var-file="runtime.auto.tfvars" \
            -out=tfplan

      - name: Export plan text
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform show -no-color tfplan > terraform-plan.txt

      - name: Upload reviewed binary plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan_meta.outputs.binary_artifact_name }}
          path: platform/terraform/tfplan
          retention-days: 30

      - name: Upload reviewed text plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan_meta.outputs.text_artifact_name }}
          path: platform/terraform/terraform-plan.txt
          retention-days: 30

      - name: Publish plan summary
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PLAN_RESULT_LINE="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\.)' terraform-plan.txt | tail -n 1 || true)"
          if [[ -z "${PLAN_RESULT_LINE}" ]]; then
            PLAN_RESULT_LINE="Plan output exported to artifact for review."
          fi

          {
            echo "## Terraform Infra Plan Summary"
            echo
            echo "Commit SHA: ${{ steps.plan_meta.outputs.commit_sha }}"
            echo "AWS account: ${{ steps.plan_meta.outputs.account_id }}"
            echo "Region: ${AWS_REGION}"
            echo "Backend bucket: s3://${TF_STATE_BUCKET}"
            echo "Backend lock table: arn:aws:dynamodb:${AWS_REGION}:${{ steps.plan_meta.outputs.account_id }}:table/${TF_LOCK_DYNAMODB}"
            echo
            echo "Plan result: ${PLAN_RESULT_LINE}"
            echo
            echo "Binary plan artifact: ${{ steps.plan_meta.outputs.binary_artifact_name }}"
            echo "Text plan artifact: ${{ steps.plan_meta.outputs.text_artifact_name }}"
            echo
            echo "Use the apply workflow with reviewed_commit_sha=${{ steps.plan_meta.outputs.commit_sha }} after reviewing the exported plan."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Terraform working files
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: rm -f runtime.auto.tfvars tfplan terraform-plan.txt
