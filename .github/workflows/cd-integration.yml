name: CD - Integration Deployment

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      ECR_REGISTRY:
        required: true
      LAMBDA_ARTIFACT_BUCKET:
        required: true
        
# Ensure that only one deployment runs at a time to the integration environment
concurrency:
  group: cd-integration
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  build-scan-push-services:
    name: Build, Scan, Push (${{ matrix.service }})
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user
            working-directory: services/backend/user
          - service: client
            working-directory: services/backend/client
          - service: transaction
            working-directory: services/backend/transaction

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

    steps:
      - name: Checkout code
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Validate required secrets
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}"
          test -n "${{ secrets.AWS_REGION }}"
          test -n "${{ secrets.ECR_REGISTRY }}"

      - name: Configure AWS credentials (OIDC)
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Java 21
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build application artifact
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        working-directory: ${{ matrix.working-directory }}
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon --console=plain

      - name: Set image metadata
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        id: image
        run: |
          echo "uri=${ECR_REGISTRY}/services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=integration" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        working-directory: ${{ matrix.working-directory }}
        run: |
          docker build \
            -t "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.branch_tag }}" \
            .

      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}:${{ steps.image.outputs.sha_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push Docker image to ECR
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        run: |
          docker push "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.branch_tag }}"

      - name: Deployment summary
        if: >-
          (matrix.service == 'user' && (needs.changes.outputs.backend-user == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'client' && (needs.changes.outputs.backend-client == 'true' || needs.changes.outputs.ci-config == 'true')) ||
          (matrix.service == 'transaction' && (needs.changes.outputs.backend-transaction == 'true' || needs.changes.outputs.ci-config == 'true'))
        run: |
          echo "Service: ${{ matrix.service }}"
          echo "Image: ${{ steps.image.outputs.uri }}:${{ steps.image.outputs.sha_tag }}"
          echo "Also tagged: ${{ steps.image.outputs.uri }}:${{ steps.image.outputs.branch_tag }}"
          echo "Trivy gate passed; image pushed to ECR."

  package-upload-aml:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-aml == 'true' || needs.changes.outputs.ci-config == 'true') }}
    name: Package and Upload Lambda (aml)
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-artifact-deploy.yml
    with:
      service: aml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}

  package-upload-verification:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-verification == 'true' || needs.changes.outputs.ci-config == 'true') }}
    name: Package and Upload Lambda (verification)
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-artifact-deploy.yml
    with:
      service: verification
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}

  package-upload-transaction-ingestion-lambda:
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.changes.outputs.backend-transaction-ingestion-lambda == 'true' || needs.changes.outputs.ci-config == 'true') }}
    name: Package and Upload Lambda (transaction-ingestion-lambda)
    needs:
      - changes
    uses: ./.github/workflows/reusable-lambda-artifact-deploy.yml
    with:
      service: transaction-ingestion-lambda
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET }}