name: Fullstack Integration E2E

# Reusable workflow that validates real backend/frontend integration using
# containerized services and non-mocked Playwright tests.

on:
  workflow_call:
    inputs:
      fullstack-mode:
        description: 'Execution mode for scripts/ci/run-fullstack-integration-e2e.sh (full, pr, or smoke)'
        required: false
        type: string
        default: full

permissions:
  contents: read

env:
  E2E_ADMIN_EMAIL: admin@crm.local
  E2E_ADMIN_PASSWORD: admin123
  E2E_USER_PASSWORD: UserPass123!
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:18088
  VERIFICATION_EMAIL_PROVIDER: ses
  SES_SENDER_EMAIL: verification@crm.local

jobs:
  fullstack-integration-e2e:
    name: Fullstack Integration - Containerized Real E2E
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Guard local/CI config files against production DB endpoints
        timeout-minutes: 1
        run: bash scripts/ci/guard-no-prod-db.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            services/frontend/crm-ui/package-lock.json
            tests/integration/package-lock.json

      - name: Mark LocalStack init script executable
        timeout-minutes: 1
        run: chmod +x platform/localstack/init/01-setup.sh

      - name: Generate transaction fixture preflight
        timeout-minutes: 1
        run: |
          mkdir -p build-logs/fullstack-integration/preflight
          python services/backend/transaction/mock-sftp/mock_transactions.py \
            --output build-logs/fullstack-integration/preflight/mocked-transactions.csv \
            --row-count 8 \
            --seed 301 \
            --start-transaction-id 9000 \
            --start-date 2026-01-01 \
            --end-date 2026-01-31

      - name: Run containerized fullstack integration tests
        timeout-minutes: 35
        env:
          FULLSTACK_MODE: ${{ inputs.fullstack-mode }}
        run: bash scripts/ci/run-fullstack-integration-e2e.sh

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-integration-artifacts
          path: |
            build-logs/fullstack-integration/**
            tests/integration/test-results/**
            tests/integration/playwright-report/**
          retention-days: 7
