name: CI - Audit Consumer Backend

# Component pipeline for the audit-consumer Lambda backend.
# Runs Python Black + Flake8 lint + pytest with coverage.

on:
  pull_request:
    branches:
      - audit-consumer-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - audit-consumer-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-audit-consumer-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Black + Flake8 (audit-consumer)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: services/backend/audit-consumer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/backend/audit-consumer/requirements.txt

      - name: Install dependencies
        timeout-minutes: 2
        run: pip install -r requirements.txt

      - name: Check formatting (Black)
        timeout-minutes: 1
        run: python -m black --check --diff lambda_function.py tests

      - name: Lint (Flake8)
        timeout-minutes: 1
        run: python -m flake8 --jobs 1 --max-line-length=100 --extend-ignore=E501,E203,W503 lambda_function.py tests

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: audit-consumer
      runtime: python
      working-directory: services/backend/audit-consumer
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/audit-consumer/build/reports/**
        services/backend/audit-consumer/build/reports/coverage/coverage.xml
