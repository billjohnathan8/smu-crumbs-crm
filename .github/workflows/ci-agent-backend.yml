name: CI - Agent Backend

# Component pipeline for the agent-backend trunk.
# Runs Java checkstyle + unit tests with JaCoCo coverage.

on:
  pull_request:
    branches:
      - agent-backend
  push:
    branches:
      - agent-backend
  workflow_dispatch:

concurrency:
  group: ci-agent-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: true
      run-backend-python: false
      run-frontend: false

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: agent
      runtime: java
      working-directory: services/backend/agent
      test-command: |
        chmod +x gradlew
        ./gradlew test jacocoTestReport --no-daemon --console=plain
      timeout-minutes: 10
      artifact-paths: services/backend/agent/build/reports/**
