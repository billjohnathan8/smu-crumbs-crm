name: TfStateSetup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - lab
          - prod
      aws_region:
        description: AWS region override (optional)
        required: false
        type: string
      state_bucket_name:
        description: Terraform state S3 bucket name override (optional)
        required: false
        type: string
      lock_table_name:
        description: Terraform lock DynamoDB table name override (optional)
        required: false
        type: string
      create_lock_table:
        description: Create DynamoDB lock table
        required: true
        default: true
        type: boolean
      aws_access_key_id:
        description: Runtime AWS_ACCESS_KEY_ID (required)
        required: false
        type: string
      aws_secret_access_key:
        description: Runtime AWS_SECRET_ACCESS_KEY (required)
        required: false
        type: string
      aws_session_token:
        description: Runtime AWS_SESSION_TOKEN (required for lab)
        required: false
        type: string

permissions:
  contents: read

jobs:
  setup-backend:
    name: Setup Terraform backend resources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate runtime input contract
        id: input_validation
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ENV="${{ inputs.environment }}"

          test -n "${{ inputs.aws_access_key_id }}"
          test -n "${{ inputs.aws_secret_access_key }}"
          if [[ "$DEPLOY_ENV" == "lab" ]]; then
            test -n "${{ inputs.aws_session_token }}"
          fi

      - name: Configure AWS temporary credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region != '' && inputs.aws_region || (inputs.environment == 'lab' && 'us-east-1' || 'ap-southeast-1') }}

      - name: Validate caller identity and lab role account
        id: caller
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"

          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "caller_arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Resolve backend resource names
        id: cfg
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ENV="${{ inputs.environment }}"
          REGION="${{ inputs.aws_region }}"
          STATE_BUCKET="${{ inputs.state_bucket_name }}"
          LOCK_TABLE="${{ inputs.lock_table_name }}"

          if [[ -z "${REGION}" ]]; then
            if [[ "${DEPLOY_ENV}" == "lab" ]]; then
              REGION="us-east-1"
            else
              REGION="ap-southeast-1"
            fi
          fi

          if [[ -z "${STATE_BUCKET}" ]]; then
            STATE_BUCKET="crumbs-scroogebank-tfstate"
          fi

          if [[ -z "${LOCK_TABLE}" ]]; then
            LOCK_TABLE="crumbs-scroogebank-tflock-${DEPLOY_ENV}"
          fi

          {
            echo "deploy_env=${DEPLOY_ENV}"
            echo "region=${REGION}"
            echo "state_bucket=${STATE_BUCKET}"
            echo "lock_table=${LOCK_TABLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure state bucket exists and is hardened
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="${{ steps.cfg.outputs.state_bucket }}"
          REGION="${{ steps.cfg.outputs.region }}"

          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "State bucket exists: ${BUCKET}"
          else
            if [[ "${REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
            else
              aws s3api create-bucket \
                --bucket "${BUCKET}" \
                --region "${REGION}" \
                --create-bucket-configuration "LocationConstraint=${REGION}"
            fi
            echo "Created state bucket: ${BUCKET}"
          fi

          aws s3api put-bucket-versioning \
            --bucket "${BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "${BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: Ensure lock table exists
        if: ${{ inputs.create_lock_table }}
        shell: bash
        run: |
          set -euo pipefail

          TABLE="${{ steps.cfg.outputs.lock_table }}"
          REGION="${{ steps.cfg.outputs.region }}"

          if aws dynamodb describe-table --table-name "${TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Lock table exists: ${TABLE}"
          else
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"

            aws dynamodb wait table-exists --table-name "${TABLE}" --region "${REGION}"
            echo "Created lock table: ${TABLE}"
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## TfStateSetup"
            echo ""
            echo "- Environment: ${{ steps.cfg.outputs.deploy_env }}"
            echo "- AWS auth mode: runtime temporary credentials"
            echo "- Caller account: ${{ steps.caller.outputs.account_id }}"
            echo "- Region: ${{ steps.cfg.outputs.region }}"
            echo "- State bucket: ${{ steps.cfg.outputs.state_bucket }}"
            if [[ "${{ inputs.create_lock_table }}" == "true" ]]; then
              echo "- Lock table: ${{ steps.cfg.outputs.lock_table }}"
            else
              echo "- Lock table: skipped by input"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
