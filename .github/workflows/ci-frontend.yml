name: CI - Frontend

# Component pipeline for the frontend trunk.
# Runs ESLint + Prettier + TypeScript typecheck + Vitest coverage.

on:
  pull_request:
    branches:
      - frontend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - frontend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: false
      run-backend-python: false
      run-frontend: true

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: frontend
      runtime: node
      working-directory: services/frontend/crm-ui
      test-command: npm run test:coverage
      timeout-minutes: 10
      artifact-paths: services/frontend/crm-ui/coverage/**

