name: CI - Frontend

# Component pipeline for the frontend trunk.
# Runs ESLint + Prettier + TypeScript typecheck + Vitest coverage.

on:
  pull_request:
    branches:
      - frontend
  push:
    branches:
      - frontend
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: false
      run-backend-python: false
      run-frontend: true

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: frontend
      runtime: node
      working-directory: services/frontend/crm-ui
      test-command: npm run test:coverage
      timeout-minutes: 10
      artifact-paths: services/frontend/crm-ui/coverage/**

  e2e:
    name: E2E Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend/crm-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        timeout-minutes: 10
        run: npm run e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            services/frontend/crm-ui/test-results/
            services/frontend/crm-ui/playwright-report/
          retention-days: 7
