name: Client Service - Unit Test CI

on:
  push:
    paths:
      - 'services/clients-service/**'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    # Setting the base directory so gradle knows where to look
    defaults:
      run:
        working-directory: services/clients-service

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run JUnit Tests
        run: ./gradlew test