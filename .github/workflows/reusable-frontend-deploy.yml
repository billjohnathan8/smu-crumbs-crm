name: Reusable - Frontend CloudFront Deploy

on:
  workflow_call:
    inputs:
      working_directory:
        description: Frontend project directory
        required: false
        type: string
        default: services/frontend/crm-ui
      build_command:
        description: Command used to build frontend assets
        required: false
        type: string
        default: npm run build
      build_output_dir:
        description: Relative build output directory from working directory
        required: false
        type: string
        default: dist
      cloudfront_invalidation_paths:
        description: Space-separated CloudFront invalidation paths
        required: false
        type: string
        default: '/*'
    secrets:
      AWS_ROLE_ARN:
        required: true
      CLOUDFRONT_DISTRIBUTION_ID:
        required: true

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    name: Build and deploy frontend to CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.FRONTEND_BUCKET }}"
          test -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.working_directory }}/package.json
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Build frontend assets
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.build_command }}

      - name: Validate build output exists
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ inputs.working_directory }}/${{ inputs.build_output_dir }}"
          if [[ ! -d "$OUTPUT_DIR" ]]; then
            echo "Build output directory not found: $OUTPUT_DIR"
            exit 1
          fi

      - name: Upload SHA-versioned static assets to S3
        run: |
          RELEASE_PREFIX="git/${GITHUB_SHA}"
          aws s3 sync \
            "${{ inputs.working_directory }}/${{ inputs.build_output_dir }}/" \
            "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PREFIX}/" \
            --delete

      - name: Upload live static assets to S3
        run: |
          aws s3 sync \
            "${{ inputs.working_directory }}/${{ inputs.build_output_dir }}/" \
            "s3://${{ vars.FRONTEND_BUCKET }}/live/" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths ${{ inputs.cloudfront_invalidation_paths }}

      - name: Write deploy intent fragment (Frontend)
        id: intent
        shell: bash
        run: |
          set -euo pipefail

          REPO_SHA="${GITHUB_SHA}"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_PREFIX="git/${REPO_SHA}"
          SITE_NAME="$(basename "${{ inputs.working_directory }}")"

          FRAGMENT_FILE="intent-frontend-${SITE_NAME}.json"
          ARTIFACT_NAME="intent-frontend-${SITE_NAME}-${REPO_SHA}"

          jq -n \
            --arg type "frontend" \
            --arg created_at "${NOW_UTC}" \
            --arg repo_sha "${REPO_SHA}" \
            --arg site "${SITE_NAME}" \
            --arg bucket "${{ vars.FRONTEND_BUCKET }}" \
            --arg release_prefix "${RELEASE_PREFIX}" \
            --arg build_output_dir "${{ inputs.build_output_dir }}" \
            --arg cloudfront_distribution_id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --arg cloudfront_invalidation_paths "${{ inputs.cloudfront_invalidation_paths }}" \
            ' {
              type: $type,
              created_at: $created_at,
              repo_sha: $repo_sha,
              frontend: {
                site: $site,
                bucket: $bucket,
                deployed_version: $repo_sha,
                release_prefix: $release_prefix,
                build_output_dir: $build_output_dir,
                cloudfront_distribution_id: $cloudfront_distribution_id,
                cloudfront_invalidation_paths: $cloudfront_invalidation_paths
              }
            }' > "${FRAGMENT_FILE}"

          echo "fragment_file=${FRAGMENT_FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy intent artifact (Frontend)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.intent.outputs.artifact_name }}
          path: ${{ steps.intent.outputs.fragment_file }}
          if-no-files-found: error

      - name: Deployment summary
        run: |
          echo "Frontend directory: ${{ inputs.working_directory }}"
          echo "Build output: ${{ inputs.build_output_dir }}"
          echo "SHA release: s3://${{ vars.FRONTEND_BUCKET }}/git/${{ github.sha }}/"
          echo "Synced to: s3://${{ vars.FRONTEND_BUCKET }}/live/"
          echo "CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"
          echo "CloudFront invalidation paths: ${{ inputs.cloudfront_invalidation_paths }}"
