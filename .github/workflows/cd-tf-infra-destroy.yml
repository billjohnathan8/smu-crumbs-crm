name: CD - Terraform Infra Destroy
# Destroy production Terraform-managed infrastructure while protecting shared backend and school-managed DNS.

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type destroy-prod to confirm production teardown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-tf-infra-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-destroy:
    name: Terraform destroy (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}
      APP_DOMAIN_NAME: ${{ vars.TF_APP_DOMAIN_NAME }}
      PROTECTED_GITHUB_ACTIONS_ROLE_ARN: arn:aws:iam::699089610166:role/GithubActionsCDRole

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate destroy request and GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_ROOT_ADMIN_PASSWORD_SECRET: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          TF_JWT_HMAC_SECRET_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.confirm_destroy }}" == "destroy-prod" ]] || {
            echo "confirm_destroy must be exactly destroy-prod"
            exit 1
          }

          test -n "${AWS_REGION}" || { echo "Missing required GitHub Actions variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "Missing required GitHub Actions variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "Missing required GitHub Actions variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "Missing required secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "Missing required secret: AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${TF_ROOT_ADMIN_PASSWORD_SECRET:-}" || { echo "Missing required secret: TF_ROOT_ADMIN_PASSWORD"; exit 1; }
          test -n "${TF_JWT_HMAC_SECRET_SECRET:-}" || { echo "Missing required secret: TF_JWT_HMAC_SECRET"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture destroy metadata
        id: destroy_meta
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "account_id=${ACCOUNT_ID}"
            echo "destroy_plan_artifact_name=${COMMIT_SHA}_tf_destroy_plan"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Terraform prod configuration contract
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_FILE="env/prod.backend.hcl"
          TFVARS_FILE="env/prod.tfvars"

          BACKEND_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          TFVARS_REGION="$(awk -F= '/^[[:space:]]*aws_region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${TFVARS_FILE}")"
          VERIFICATION_ENABLED="$(awk -F= '/^[[:space:]]*enable_verification_pipeline[[:space:]]*=/{value=$2; sub(/#.*/, "", value); gsub(/[[:space:]]/, "", value); print tolower(value); exit}' "${TFVARS_FILE}")"

          [[ "${BACKEND_BUCKET}" == "${TF_STATE_BUCKET}" ]] || { echo "prod.backend.hcl bucket (${BACKEND_BUCKET}) does not match vars.TF_STATE_BUCKET (${TF_STATE_BUCKET})"; exit 1; }
          [[ "${BACKEND_REGION}" == "${AWS_REGION}" ]] || { echo "prod.backend.hcl region (${BACKEND_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }
          [[ "${BACKEND_LOCK_TABLE}" == "${TF_LOCK_DYNAMODB}" ]] || { echo "prod.backend.hcl dynamodb_table (${BACKEND_LOCK_TABLE}) does not match vars.TF_LOCK_DYNAMODB (${TF_LOCK_DYNAMODB})"; exit 1; }
          [[ -z "${TFVARS_REGION}" || "${TFVARS_REGION}" == "${AWS_REGION}" ]] || { echo "prod.tfvars aws_region (${TFVARS_REGION}) does not match vars.AWS_REGION (${AWS_REGION})"; exit 1; }

          if [[ "${VERIFICATION_ENABLED}" == "true" && -z "${APP_DOMAIN_NAME}" ]]; then
            echo "Production verification is enabled in env/prod.tfvars, but vars.TF_APP_DOMAIN_NAME is not set."
            exit 1
          fi

      - name: Create runtime Terraform override file
        working-directory: ${{ env.TF_DIR }}
        env:
          ROOT_ADMIN_PASSWORD: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          JWT_HMAC_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${ROOT_ADMIN_PASSWORD}"
          echo "::add-mask::${JWT_HMAC_SECRET}"

          {
            echo "root_admin_password = $(jq -Rn --arg v "$ROOT_ADMIN_PASSWORD" '$v')"
            echo "jwt_hmac_secret = $(jq -Rn --arg v "$JWT_HMAC_SECRET" '$v')"
            echo "cloudtrail_bucket_force_destroy = true"
            if [[ -n "${APP_DOMAIN_NAME}" ]]; then
              echo "app_domain_name = $(jq -Rn --arg v "$APP_DOMAIN_NAME" '$v')"
            fi
          } > runtime.auto.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform validate -no-color

      - name: Pre-pass - destroy ALB module only
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if terraform state list | grep -Fxq "module.alb.aws_lb.crm"; then
            terraform destroy \
              -target=module.alb \
              -input=false \
              -auto-approve \
              -lock-timeout=300s \
              -var-file="env/${DEPLOY_ENV}.tfvars" \
              -var-file="runtime.auto.tfvars"
          else
            echo "No ALB resource found in state; skipping ALB pre-pass."
          fi

      - name: Wait for ALB ENIs to drain
        shell: bash
        run: |
          set -euo pipefail

          # ALB ENIs can linger for a few minutes after ALB deletion.
          for _ in {1..36}; do
            ENI_COUNT="$(aws ec2 describe-network-interfaces \
              --region "${AWS_REGION}" \
              --filters "Name=description,Values=ELB app/scroogebank-crm-prod-alb/*" \
              --query 'length(NetworkInterfaces)' \
              --output text 2>/dev/null || echo 0)"

            if [[ "${ENI_COUNT}" == "0" || "${ENI_COUNT}" == "None" ]]; then
              echo "No ALB ENIs remain for scroogebank-crm-prod-alb."
              exit 0
            fi

            echo "Waiting for ALB ENIs to drain (${ENI_COUNT} remaining)..."
            sleep 10
          done

          echo "ALB ENIs still present after wait window. Continuing; SG/subnet teardown may take longer."

      - name: Fast pass - destroy Lambda module only
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform destroy \
            -target=module.lambda \
            -input=false \
            -auto-approve \
            -lock-timeout=300s \
            -var-file="env/${DEPLOY_ENV}.tfvars" \
            -var-file="runtime.auto.tfvars"

      - name: Capture VPC ID
        id: vpc
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          VPC_ID="$(terraform output -raw vpc_id 2>/dev/null || true)"
          echo "vpc_id=${VPC_ID}" >> "$GITHUB_OUTPUT"
          echo "Detected VPC ID: ${VPC_ID:-<none>}"

      - name: Check Lambda ENIs once (no wait loop)
        id: eni_check
        shell: bash
        run: |
          set -euo pipefail

          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"
          if [[ -z "${VPC_ID}" ]]; then
            echo "eni_count=0" >> "$GITHUB_OUTPUT"
            echo "continue_destroy=true" >> "$GITHUB_OUTPUT"
            echo "VPC output not present; proceeding to full destroy."
            exit 0
          fi

          ENI_COUNT="$(aws ec2 describe-network-interfaces \
            --region "${AWS_REGION}" \
            --filters "Name=vpc-id,Values=${VPC_ID}" \
            --query "length(NetworkInterfaces[?contains(Description, 'AWS Lambda VPC ENI')])" \
            --output text)"

          echo "Lambda ENIs currently detected in VPC ${VPC_ID}:"
          aws ec2 describe-network-interfaces \
            --region "${AWS_REGION}" \
            --filters "Name=vpc-id,Values=${VPC_ID}" \
            --query "NetworkInterfaces[?contains(Description, 'AWS Lambda VPC ENI')].[NetworkInterfaceId,InterfaceType,Status,Description]" \
            --output table || true

          echo "eni_count=${ENI_COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${ENI_COUNT}" =~ ^[0-9]+$ ]] && (( ENI_COUNT > 0 )); then
            echo "continue_destroy=false" >> "$GITHUB_OUTPUT"
            echo "Lambda ENIs still draining (${ENI_COUNT}) in ${VPC_ID}. Stopping early; re-run this workflow later."
          else
            echo "continue_destroy=true" >> "$GITHUB_OUTPUT"
            echo "No Lambda ENIs detected in ${VPC_ID}. Continuing with full destroy."
          fi

      - name: Stop early when Lambda ENIs are still draining
        if: ${{ steps.eni_check.outputs.continue_destroy != 'true' }}
        shell: bash
        run: |
          {
            echo "## Terraform Infra Destroy Summary"
            echo
            echo "Commit SHA: ${{ steps.destroy_meta.outputs.commit_sha }}"
            echo "AWS account: ${{ steps.destroy_meta.outputs.account_id }}"
            echo "Region: ${AWS_REGION}"
            echo "Fast pass: destroyed module.lambda"
            echo "Lambda ENIs still present: ${{ steps.eni_check.outputs.eni_count }}"
            echo "Action: rerun this workflow in 10-15 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detach CodeDeploy resources from state for teardown
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CODEDEPLOY_STATE_ADDRS < <(terraform state list | grep '^module\.codedeploy\.' || true)
          if [[ "${#CODEDEPLOY_STATE_ADDRS[@]}" -eq 0 ]]; then
            echo "No module.codedeploy resources found in state."
            exit 0
          fi

          printf '%s\n' "Removing CodeDeploy resources from state before destroy plan:"
          printf '  %s\n' "${CODEDEPLOY_STATE_ADDRS[@]}"
          for addr in "${CODEDEPLOY_STATE_ADDRS[@]}"; do
            terraform state rm "${addr}"
          done

      - name: Pre-pass - destroy CloudTrail trail only
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if terraform state list | grep -Eq '^module\.observability\.aws_cloudtrail\.this(\[0\])?$'; then
            terraform destroy \
              -target=module.observability.aws_cloudtrail.this \
              -input=false \
              -auto-approve \
              -lock-timeout=300s \
              -var-file="env/${DEPLOY_ENV}.tfvars" \
              -var-file="runtime.auto.tfvars"
          else
            echo "No CloudTrail trail resource found in state; skipping pre-pass trail destroy."
          fi

      - name: Pre-pass - drain S3 bucket objects
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          drain_bucket() {
            local bucket_name="$1"
            if [[ -z "${bucket_name}" ]]; then
              return 0
            fi

            echo "Draining bucket before full destroy: ${bucket_name}"
            aws s3 rm "s3://${bucket_name}" --recursive --region "${AWS_REGION}" || true

            # Also clear versioned objects/delete markers.
            for _ in {1..20}; do
              local vcount
              vcount="$(aws s3api list-object-versions \
                --bucket "${bucket_name}" \
                --region "${AWS_REGION}" \
                --query 'length(Versions) + length(DeleteMarkers)' \
                --output text 2>/dev/null || echo 0)"

              if [[ "${vcount}" == "None" || -z "${vcount}" || "${vcount}" == "0" ]]; then
                break
              fi

              aws s3api list-object-versions \
                --bucket "${bucket_name}" \
                --region "${AWS_REGION}" \
                --output json \
                | jq -c '{Objects: (([.Versions[]? | {Key,VersionId}] + [.DeleteMarkers[]? | {Key,VersionId}])[:1000]), Quiet: true}' > delete-versions.json

              local obj_count
              obj_count="$(jq '.Objects | length' delete-versions.json)"
              if [[ "${obj_count}" == "0" ]]; then
                break
              fi

              aws s3api delete-objects \
                --bucket "${bucket_name}" \
                --region "${AWS_REGION}" \
                --delete file://delete-versions.json || true
            done

            rm -f delete-versions.json
            echo "Bucket drain complete: ${bucket_name}"
          }

          resolve_bucket_from_state() {
            local addr="$1"
            if terraform state list | grep -Fxq "${addr}"; then
              terraform state show "${addr}" | awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}'
            fi
          }

          BACKEND_BUCKET="$(resolve_bucket_from_state "module.s3.aws_s3_bucket.backend[0]")"
          FRONTEND_BUCKET="$(resolve_bucket_from_state "module.s3.aws_s3_bucket.frontend")"
          CLOUDTRAIL_BUCKET="$(resolve_bucket_from_state "module.observability.aws_s3_bucket.cloudtrail[0]")"

          drain_bucket "${BACKEND_BUCKET}"
          drain_bucket "${FRONTEND_BUCKET}"
          drain_bucket "${CLOUDTRAIL_BUCKET}"

      - name: Pre-pass - destroy S3 module only
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if terraform state list | grep -Eq '^module\.s3\.'; then
            terraform destroy \
              -target=module.s3 \
              -input=false \
              -auto-approve \
              -lock-timeout=300s \
              -var-file="env/${DEPLOY_ENV}.tfvars" \
              -var-file="runtime.auto.tfvars"
          else
            echo "No module.s3 resources found in state; skipping S3 pre-pass destroy."
          fi

      - name: Terraform destroy plan
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=300s \
            -var-file="env/${DEPLOY_ENV}.tfvars" \
            -var-file="runtime.auto.tfvars" \
            -out=tfplan-destroy

      - name: Export destroy plan
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform show -no-color tfplan-destroy > terraform-destroy-plan.txt
          terraform show -json tfplan-destroy > terraform-destroy-plan.json

      - name: Block protected resource deletions
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PROTECTED_MATCHES="$({
            jq -r \
              --arg bucket "${TF_STATE_BUCKET}" \
              --arg lock_table "${TF_LOCK_DYNAMODB}" \
              --arg protected_role_arn "${PROTECTED_GITHUB_ACTIONS_ROLE_ARN}" \
              '
                [
                  .resource_changes[]?
                  | select((.change.actions // []) | index("delete"))
                  | select(
                      (.type == "aws_route53_zone") or
                      (.type | startswith("aws_route53domains")) or
                      ((.type == "aws_iam_role") and ((.change.before.arn // "") == $protected_role_arn)) or
                      ((.type | startswith("aws_s3_bucket")) and ((.change.before.bucket // .change.before.id // .change.before.name // "") == $bucket)) or
                      ((.type | startswith("aws_dynamodb_table")) and ((.change.before.name // .change.before.id // "") == $lock_table))
                    )
                  | "\(.address) [\(.type)]"
                ]
                | unique
                | .[]
              ' terraform-destroy-plan.json
          } || true)"

          if [[ -n "${PROTECTED_MATCHES}" ]]; then
            echo "Refusing destroy because the plan includes protected resources:"
            printf '%s\n' "${PROTECTED_MATCHES}"
            exit 1
          fi

      - name: Apply destroy plan
        if: ${{ steps.eni_check.outputs.continue_destroy == 'true' }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform apply -input=false -auto-approve tfplan-destroy

      - name: Upload destroy artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.destroy_meta.outputs.destroy_plan_artifact_name }}
          path: |
            platform/terraform/terraform-destroy-plan.txt
            platform/terraform/terraform-destroy-plan.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish destroy summary
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.eni_check.outputs.continue_destroy }}" != "true" ]]; then
            PLAN_RESULT_LINE="Paused after Lambda-only destroy; Lambda ENIs still draining (${{ steps.eni_check.outputs.eni_count }}). Re-run workflow in 10-15 minutes."
          elif [[ -f terraform-destroy-plan.txt ]]; then
            PLAN_RESULT_LINE="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\.)' terraform-destroy-plan.txt | tail -n 1 || true)"
          else
            PLAN_RESULT_LINE="Destroy plan was not generated."
          fi

          if [[ -z "${PLAN_RESULT_LINE}" ]]; then
            PLAN_RESULT_LINE="Destroy plan exported to artifact for review."
          fi

          {
            echo "## Terraform Infra Destroy Summary"
            echo
            echo "Commit SHA: ${{ steps.destroy_meta.outputs.commit_sha }}"
            echo "AWS account: ${{ steps.destroy_meta.outputs.account_id }}"
            echo "Region: ${AWS_REGION}"
            echo "Backend bucket protected: s3://${TF_STATE_BUCKET}"
            echo "Backend lock table protected: arn:aws:dynamodb:${AWS_REGION}:${{ steps.destroy_meta.outputs.account_id }}:table/${TF_LOCK_DYNAMODB}"
            echo "Protected IAM role: ${PROTECTED_GITHUB_ACTIONS_ROLE_ARN}"
            echo
            echo "Destroy result: ${PLAN_RESULT_LINE}"
            echo
            echo "Protected resources blocked by policy: Route 53 hosted zones, Route53Domains resources, the manually managed GitHub Actions IAM role, the Terraform backend S3 bucket, and the Terraform lock DynamoDB table."
            echo "Destroy artifact: ${{ steps.destroy_meta.outputs.destroy_plan_artifact_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Terraform working files
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: rm -f runtime.auto.tfvars tfplan-destroy terraform-destroy-plan.txt terraform-destroy-plan.json
