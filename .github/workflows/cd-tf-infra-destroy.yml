name: CD - Terraform Infra Destroy
# Destroy production Terraform-managed infrastructure while protecting:
#   - Route53 hosted zone and school-managed DNS domain
#   - Terraform state backend (S3 bucket + DynamoDB lock table)
#   - GitHub Actions IAM role
#
# Idempotent: safe to run when infra is fully up, partially up, or already destroyed.

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: Type destroy-prod to confirm production teardown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-tf-infra-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-destroy:
    name: Terraform destroy (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}
      APP_DOMAIN_NAME: ${{ vars.TF_APP_DOMAIN_NAME }}
      PROTECTED_GITHUB_ACTIONS_ROLE_ARN: arn:aws:iam::699089610166:role/GithubActionsCDRole

    steps:
      # ── Validate ────────────────────────────────────────────────
      - name: Validate destroy request and GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_ROOT_ADMIN_PASSWORD_SECRET: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          TF_JWT_HMAC_SECRET_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.confirm_destroy }}" == "destroy-prod" ]] || {
            echo "::error::confirm_destroy must be exactly 'destroy-prod'"
            exit 1
          }

          test -n "${AWS_REGION}" || { echo "::error::Missing GitHub variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "::error::Missing GitHub variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "::error::Missing GitHub variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "::error::Missing secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "::error::Missing secret: AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${TF_ROOT_ADMIN_PASSWORD_SECRET:-}" || { echo "::error::Missing secret: TF_ROOT_ADMIN_PASSWORD"; exit 1; }
          test -n "${TF_JWT_HMAC_SECRET_SECRET:-}" || { echo "::error::Missing secret: TF_JWT_HMAC_SECRET"; exit 1; }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture destroy metadata
        id: destroy_meta
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "account_id=${ACCOUNT_ID}"
            echo "destroy_plan_artifact_name=${COMMIT_SHA}_tf_destroy_plan"
          } >> "$GITHUB_OUTPUT"

      # ── Terraform setup ─────────────────────────────────────────
      - name: Validate Terraform prod configuration contract
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_FILE="env/prod.backend.hcl"
          TFVARS_FILE="env/prod.tfvars"

          BACKEND_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"

          [[ "${BACKEND_BUCKET}" == "${TF_STATE_BUCKET}" ]] || { echo "::error::Backend bucket mismatch"; exit 1; }
          [[ "${BACKEND_REGION}" == "${AWS_REGION}" ]] || { echo "::error::Backend region mismatch"; exit 1; }
          [[ "${BACKEND_LOCK_TABLE}" == "${TF_LOCK_DYNAMODB}" ]] || { echo "::error::Backend lock table mismatch"; exit 1; }

      - name: Create runtime Terraform override file
        working-directory: ${{ env.TF_DIR }}
        env:
          ROOT_ADMIN_PASSWORD: ${{ secrets.TF_ROOT_ADMIN_PASSWORD }}
          JWT_HMAC_SECRET: ${{ secrets.TF_JWT_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${ROOT_ADMIN_PASSWORD}"
          echo "::add-mask::${JWT_HMAC_SECRET}"
          {
            echo "root_admin_password = $(jq -Rn --arg v "$ROOT_ADMIN_PASSWORD" '$v')"
            echo "jwt_hmac_secret = $(jq -Rn --arg v "$JWT_HMAC_SECRET" '$v')"
            echo "cloudtrail_bucket_force_destroy = true"
            echo "frontend_bucket_force_destroy = true"
            echo "backend_bucket_force_destroy = true"
            echo "transaction_sftp_bucket_force_destroy = true"
            if [[ -n "${APP_DOMAIN_NAME}" ]]; then
              echo "app_domain_name = $(jq -Rn --arg v "$APP_DOMAIN_NAME" '$v')"
            fi
          } > runtime.auto.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Ensure Terraform Lambda zip artifacts exist
        shell: bash
        run: python3 .github/scripts/build_tf_lambda_zips.py

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform validate -no-color

      # ── Check if there is anything to destroy ───────────────────
      - name: Check Terraform state for resources
        id: state_check
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_COUNT="$(terraform state list 2>/dev/null | wc -l || echo 0)"
          echo "resource_count=${RESOURCE_COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${RESOURCE_COUNT}" -eq 0 ]]; then
            echo "::notice::Terraform state is empty. Nothing to destroy."
            echo "has_resources=false" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform state contains ${RESOURCE_COUNT} resources to destroy."
            echo "has_resources=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Pre-destroy cleanup (only if resources exist) ───────────
      - name: Detach protected DNS records from state
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t STATE_ADDRESSES < <(terraform state list 2>/dev/null || true)
          if [[ "${#STATE_ADDRESSES[@]}" -eq 0 ]]; then
            echo "No resources in state."
            exit 0
          fi

          detach_if_present() {
            local target="$1"
            if printf '%s\n' "${STATE_ADDRESSES[@]}" | grep -Fxq "${target}"; then
              echo "Detaching protected DNS record: ${target}"
              terraform state rm "${target}" || true
            fi
          }

          # Known DNS record addresses
          detach_if_present "module.alb.aws_route53_record.alb[0]"
          detach_if_present "module.cloudfront[0].aws_route53_record.cloudfront[0]"
          detach_if_present "aws_route53_record.cloudfront_backend_origin[0]"

          # Defensive: catch any shape drift
          mapfile -t REMAINING_DNS < <(terraform state list 2>/dev/null | grep -E '(aws_route53_record\.alb|aws_route53_record\.cloudfront|aws_route53_record\.cloudfront_backend_origin)' || true)
          for addr in "${REMAINING_DNS[@]}"; do
            echo "Detaching remaining DNS record: ${addr}"
            terraform state rm "${addr}" || true
          done

          # Also detach ACM DNS validation records (they reference Route53)
          mapfile -t ACM_DNS < <(terraform state list 2>/dev/null | grep -E 'aws_route53_record.*acm_validation' || true)
          for addr in "${ACM_DNS[@]}"; do
            echo "Detaching ACM validation record: ${addr}"
            terraform state rm "${addr}" || true
          done

      - name: Drain Terraform-managed S3 buckets
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          drain_bucket() {
            local bucket_name="$1"
            [[ -n "${bucket_name}" ]] || return 0

            # Check if bucket exists
            if ! aws s3api head-bucket --bucket "${bucket_name}" --region "${AWS_REGION}" 2>/dev/null; then
              echo "Bucket does not exist (skip): ${bucket_name}"
              return 0
            fi

            echo "Draining bucket: ${bucket_name}"
            aws s3 rm "s3://${bucket_name}" --recursive --region "${AWS_REGION}" 2>/dev/null || true

            # Clear versioned objects and delete markers
            for _ in {1..30}; do
              local versions_json
              versions_json="$(aws s3api list-object-versions \
                --bucket "${bucket_name}" \
                --region "${AWS_REGION}" \
                --output json 2>/dev/null || echo '{}')"

              local delete_payload
              delete_payload="$(echo "${versions_json}" | jq -c '{Objects: (([.Versions[]? | {Key,VersionId}] + [.DeleteMarkers[]? | {Key,VersionId}])[:1000]), Quiet: true}')"

              local obj_count
              obj_count="$(echo "${delete_payload}" | jq '.Objects | length')"
              if [[ "${obj_count}" == "0" || "${obj_count}" == "null" ]]; then
                break
              fi

              echo "  Deleting ${obj_count} versioned objects/markers..."
              echo "${delete_payload}" > /tmp/delete-versions.json
              aws s3api delete-objects \
                --bucket "${bucket_name}" \
                --region "${AWS_REGION}" \
                --delete file:///tmp/delete-versions.json 2>/dev/null || true
            done
            echo "Bucket drained: ${bucket_name}"
          }

          # Drain all S3 buckets in Terraform state
          mapfile -t S3_BUCKET_ADDRS < <(terraform state list 2>/dev/null | grep -E '^module\.(s3|observability)\.aws_s3_bucket\.' || true)
          if [[ "${#S3_BUCKET_ADDRS[@]}" -eq 0 ]]; then
            echo "No Terraform-managed S3 buckets found in state."
            exit 0
          fi

          declare -A UNIQUE_BUCKETS=()
          for addr in "${S3_BUCKET_ADDRS[@]}"; do
            bucket_name="$(terraform state show "${addr}" 2>/dev/null | awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' || true)"
            if [[ -n "${bucket_name}" ]]; then
              UNIQUE_BUCKETS["${bucket_name}"]=1
            fi
          done

          for bucket_name in "${!UNIQUE_BUCKETS[@]}"; do
            drain_bucket "${bucket_name}"
          done

      - name: Drain Terraform-managed ECR repositories
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          drain_repo() {
            local repo_name="$1"
            [[ -n "${repo_name}" ]] || return 0

            # Check if repo exists
            if ! aws ecr describe-repositories --repository-names "${repo_name}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              echo "ECR repo does not exist (skip): ${repo_name}"
              return 0
            fi

            echo "Draining ECR repository: ${repo_name}"
            for _ in {1..20}; do
              local images_json
              images_json="$(aws ecr list-images \
                --repository-name "${repo_name}" \
                --region "${AWS_REGION}" \
                --query 'imageIds[:100]' \
                --output json 2>/dev/null || echo '[]')"

              local image_count
              image_count="$(echo "${images_json}" | jq 'length')"
              if [[ "${image_count}" == "0" ]]; then
                break
              fi

              echo "${images_json}" > /tmp/delete-images.json
              aws ecr batch-delete-image \
                --repository-name "${repo_name}" \
                --region "${AWS_REGION}" \
                --image-ids file:///tmp/delete-images.json >/dev/null 2>&1 || true
            done
            echo "ECR drained: ${repo_name}"
          }

          mapfile -t ECR_REPO_ADDRS < <(terraform state list 2>/dev/null | grep -E '^module\.ecr\.aws_ecr_repository\.' || true)
          if [[ "${#ECR_REPO_ADDRS[@]}" -eq 0 ]]; then
            echo "No Terraform-managed ECR repositories found in state."
            exit 0
          fi

          declare -A UNIQUE_REPOS=()
          for addr in "${ECR_REPO_ADDRS[@]}"; do
            repo_name="$(terraform state show "${addr}" 2>/dev/null | awk -F= '/^[[:space:]]*name[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' || true)"
            if [[ -n "${repo_name}" ]]; then
              UNIQUE_REPOS["${repo_name}"]=1
            fi
          done

          for repo_name in "${!UNIQUE_REPOS[@]}"; do
            drain_repo "${repo_name}"
          done

      # ── Destroy plan ────────────────────────────────────────────
      - name: Terraform destroy plan
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -destroy \
            -input=false \
            -lock-timeout=300s \
            -var-file="env/${DEPLOY_ENV}.tfvars" \
            -var-file="runtime.auto.tfvars" \
            -out=tfplan-destroy

      - name: Export destroy plan
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform show -no-color tfplan-destroy > terraform-destroy-plan.txt
          terraform show -json tfplan-destroy > terraform-destroy-plan.json

      - name: Block protected resource deletions
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PROTECTED_MATCHES="$({
            jq -r \
              --arg bucket "${TF_STATE_BUCKET}" \
              --arg lock_table "${TF_LOCK_DYNAMODB}" \
              --arg protected_role_arn "${PROTECTED_GITHUB_ACTIONS_ROLE_ARN}" \
              '
                [
                  .resource_changes[]?
                  | select((.change.actions // []) | index("delete"))
                  | select(
                      (.type == "aws_route53_zone") or
                      (.type | startswith("aws_route53domains")) or
                      ((.type == "aws_iam_role") and ((.change.before.arn // "") == $protected_role_arn)) or
                      ((.type | startswith("aws_s3_bucket")) and ((.change.before.bucket // .change.before.id // .change.before.name // "") == $bucket)) or
                      ((.type | startswith("aws_dynamodb_table")) and ((.change.before.name // .change.before.id // "") == $lock_table))
                    )
                  | "\(.address) [\(.type)]"
                ]
                | unique
                | .[]
              ' terraform-destroy-plan.json
          } || true)"

          if [[ -n "${PROTECTED_MATCHES}" ]]; then
            echo "::error::Refusing destroy - plan includes protected resources:"
            printf '%s\n' "${PROTECTED_MATCHES}"
            exit 1
          fi

      # ── Apply destroy ───────────────────────────────────────────
      - name: Apply destroy plan
        if: steps.state_check.outputs.has_resources == 'true'
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform apply -input=false -auto-approve tfplan-destroy

      # ── Post-destroy cleanup ────────────────────────────────────
      - name: Force delete lingering Secrets Manager secrets
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_NAME="${TF_PROJECT_NAME:-scroogebank-crm}"

          force_delete_if_exists() {
            local secret_name="$1"
            if ! aws secretsmanager describe-secret --secret-id "${secret_name}" --region "${AWS_REGION}" >/dev/null 2>&1; then
              return 0
            fi

            local deleted_date
            deleted_date="$(aws secretsmanager describe-secret \
              --secret-id "${secret_name}" \
              --region "${AWS_REGION}" \
              --query 'DeletedDate' \
              --output text 2>/dev/null || true)"

            if [[ -n "${deleted_date}" && "${deleted_date}" != "None" ]]; then
              echo "Restoring pending-deletion secret: ${secret_name}"
              aws secretsmanager restore-secret --secret-id "${secret_name}" --region "${AWS_REGION}" >/dev/null || true
              sleep 5
            fi

            echo "Force deleting secret: ${secret_name}"
            aws secretsmanager delete-secret \
              --secret-id "${secret_name}" \
              --region "${AWS_REGION}" \
              --force-delete-without-recovery >/dev/null 2>&1 || true
          }

          force_delete_if_exists "/${PROJECT_NAME}/${DEPLOY_ENV}/jwt/hmac_secret"
          force_delete_if_exists "/${PROJECT_NAME}/${DEPLOY_ENV}/user/root_admin_password"
          force_delete_if_exists "/${PROJECT_NAME}/${DEPLOY_ENV}/db/username"
          force_delete_if_exists "/${PROJECT_NAME}/${DEPLOY_ENV}/db/password"

      # ── Artifacts & Summary ─────────────────────────────────────
      - name: Upload destroy artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.destroy_meta.outputs.destroy_plan_artifact_name }}
          path: |
            platform/terraform/terraform-destroy-plan.txt
            platform/terraform/terraform-destroy-plan.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish destroy summary
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          RESOURCES_BEFORE="${{ steps.state_check.outputs.resource_count }}"
          HAD_RESOURCES="${{ steps.state_check.outputs.has_resources }}"

          if [[ -f terraform-destroy-plan.txt ]]; then
            PLAN_RESULT_LINE="$(grep -E '^(Plan: [0-9]+ to add|No changes\.)' terraform-destroy-plan.txt | tail -n 1 || true)"
          else
            PLAN_RESULT_LINE=""
          fi

          {
            echo "## Terraform Infra Destroy Summary"
            echo
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Commit SHA | \`${{ steps.destroy_meta.outputs.commit_sha }}\` |"
            echo "| AWS Account | ${{ steps.destroy_meta.outputs.account_id }} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Resources before | ${RESOURCES_BEFORE} |"
            echo "| Had resources to destroy | ${HAD_RESOURCES} |"
            echo
            if [[ "${HAD_RESOURCES}" == "false" ]]; then
              echo "**State was already empty. Nothing was destroyed.**"
            elif [[ -n "${PLAN_RESULT_LINE}" ]]; then
              echo "**Destroy result:** ${PLAN_RESULT_LINE}"
            fi
            echo
            echo "### Protected resources (NOT destroyed)"
            echo "- Route53 hosted zone and DNS domain (school-managed)"
            echo "- Terraform state bucket: s3://${TF_STATE_BUCKET}"
            echo "- Terraform lock table: ${TF_LOCK_DYNAMODB}"
            echo "- GitHub Actions IAM role: ${PROTECTED_GITHUB_ACTIONS_ROLE_ARN}"
            echo
            echo "Secrets Manager secrets were force-deleted (no recovery window) to allow clean re-provisioning."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Terraform working files
        if: ${{ always() }}
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: rm -f runtime.auto.tfvars tfplan-destroy terraform-destroy-plan.txt terraform-destroy-plan.json
