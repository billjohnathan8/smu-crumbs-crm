name: CI - Test and Spin-Up All

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kind_cluster_name:
        description: 'kind cluster name (default: cs301-crm)'
        required: false
        default: 'cs301-crm'
      namespace:
        description: 'Kubernetes namespace (default: dev)'
        required: false
        default: 'dev'

env:
  KIND_CLUSTER_NAME: ${{ github.event.inputs.kind_cluster_name || 'cs301-crm' }}
  NS: ${{ github.event.inputs.namespace || 'dev' }}
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  # ============================================================================
  # Job 1: Test All (Backend + Frontend + Coverage Aggregation)
  # ============================================================================
  test_all:
    name: Test All (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/backend/log/requirements.txt
      
      - name: Make scripts executable
        run: |
          chmod +x scripts/build-and-test-all/build-and-test-all.sh
          chmod +x scripts/build-and-test-backend/build-and-test-backend.sh
          chmod +x scripts/build-and-test-frontend/build-and-test-frontend.sh
          find services/backend -name gradlew -exec chmod +x {} \;
      
      - name: Run full test pipeline (backend + frontend)
        run: bash scripts/build-and-test-all/build-and-test-all.sh
      
      - name: Upload test logs and coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-and-coverage-failure
          path: |
            build-logs/**
            services/backend/*/build/reports/**
            services/backend/log/build/pytest/**
            services/backend/log/build/coverage.xml
            services/frontend/crm-ui/coverage/**
          retention-days: 7
      
      - name: Upload coverage artifacts on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports
          path: |
            build-logs/build-and-test-all/index.html
            build-logs/build-and-test-backend/index.html
            services/backend/*/build/reports/jacoco/test/html/**
            services/backend/log/build/coverage.xml
            services/frontend/crm-ui/coverage/**
          retention-days: 14

  # ============================================================================
  # Job 2: K8s Manifest Validation
  # ============================================================================
  k8s_validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test_all
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      
      - name: Make validation script executable
        run: chmod +x scripts/validate-k8s/validate.sh
      
      - name: Run K8s manifest validation
        run: make k8s-validate
      
      - name: Upload rendered manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-validation-failure
          path: |
            .k8s-validate-tmp/**
          retention-days: 7

  # ============================================================================
  # Job 3: Deploy to kind + Smoke Tests
  # ============================================================================
  deploy_kind_smoke:
    name: Deploy to kind & Smoke Tests
    runs-on: ubuntu-latest
    needs: k8s_validate
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/crm-ui/package-lock.json
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.25.0
      
      - name: Install frontend dependencies
        working-directory: services/frontend/crm-ui
        run: npm install
      
      - name: Make scripts executable
        run: |
          chmod +x scripts/build-and-deploy-k8s/build-and-deploy-k8s-local.sh
          chmod +x scripts/validate-k8s/validate.sh
          chmod +x scripts/smoke-k8s-infra/smoke-k8s-infra.sh
          chmod +x scripts/smoke-k8s-infra/smoke-probes.sh
          find services/backend -name gradlew -exec chmod +x {} \;
      
      - name: Run local K8s deployment and smoke tests
        id: deploy
        run: bash scripts/build-and-deploy-k8s/build-and-deploy-k8s-local.sh
      
      - name: Capture kubectl diagnostics on failure
        if: failure()
        run: |
          echo "========================================="
          echo "Pods across all namespaces:"
          echo "========================================="
          kubectl get pods -A -o wide || true
          
          echo ""
          echo "========================================="
          echo "Services across all namespaces:"
          echo "========================================="
          kubectl get svc -A -o wide || true
          
          echo ""
          echo "========================================="
          echo "Ingress across all namespaces:"
          echo "========================================="
          kubectl get ingress -A -o wide || true
          
          echo ""
          echo "========================================="
          echo "Recent events (last 200):"
          echo "========================================="
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -200 || true
          
          echo ""
          echo "========================================="
          echo "Describe pods in namespace: ${{ env.NS }}"
          echo "========================================="
          kubectl describe pods -n "${{ env.NS }}" || true
          
          echo ""
          echo "========================================="
          echo "Logs from all containers in namespace: ${{ env.NS }}"
          echo "========================================="
          for pod in $(kubectl get pods -n "${{ env.NS }}" -o name 2>/dev/null || true); do
            echo "--- Logs for ${pod} ---"
            kubectl logs -n "${{ env.NS }}" "${pod}" --all-containers --tail=200 || true
            echo ""
          done
      
      - name: Upload build logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-deploy-logs
          path: |
            build-logs/build-and-deploy-k8s/**
          retention-days: 14
