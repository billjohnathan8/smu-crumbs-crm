name: CI - Terraform

# Component pipeline for terraform configuration validation and security scanning.
# Runs terraform fmt, validate, tflint, and checkov checks.

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'platform/terraform/**'
      - '!**/*.md'
      - '!docs/**'
  push:
    branches:
      - dev
      - main
    paths:
      - 'platform/terraform/**'
      - '!**/*.md'
      - '!docs/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: false

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform-lint:
    name: Terraform Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        timeout-minutes: 2
        with:
          terraform_version: "~1.6"

      - name: terraform fmt check
        timeout-minutes: 2
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        timeout-minutes: 5
        run: terraform init -backend=false

      - name: terraform validate
        timeout-minutes: 2
        run: terraform validate

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Build operable lambda artifacts
        timeout-minutes: 6
        run: bash ../../scripts/ci/build-lambda-artifacts.sh

      - name: terraform validate (operable lambda feature flags)
        timeout-minutes: 2
        env:
          TF_VAR_enable_log_lambda: "true"
          TF_VAR_enable_aml_lambda: "true"
          TF_VAR_enable_transaction_ingestion_lambda: "true"
          TF_VAR_enable_verification_pipeline: "true"
          TF_VAR_ses_sender_email: "verification@crm.local"
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        timeout-minutes: 3
        with:
          tflint_version: v0.53.0

      - name: TFLint init (download AWS plugin)
        timeout-minutes: 3
        run: tflint --init

      - name: Run TFLint
        timeout-minutes: 3
        run: tflint --format compact

      - name: Prepare Infracost artifact directory
        timeout-minutes: 1
        run: mkdir -p .infracost

      - name: Set up Infracost
        if: ${{ env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        timeout-minutes: 2
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost report
        if: ${{ env.INFRACOST_API_KEY != '' }}
        timeout-minutes: 5
        run: |
          infracost breakdown --path=. --format=json --out-file=.infracost/infracost-report.json
          infracost breakdown --path=. --format=table --out-file=.infracost/infracost-report.txt

      - name: Record skipped Infracost reason
        if: ${{ env.INFRACOST_API_KEY == '' }}
        timeout-minutes: 1
        run: echo "INFRACOST_API_KEY is not configured; Infracost cost report was skipped." > .infracost/README.txt

      - name: Upload Infracost artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: infracost-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.infracost/
          retention-days: 7

      - name: Install Checkov
        timeout-minutes: 3
        run: pip install checkov

      - name: Run Checkov (security & compliance scan)
        # --soft-fail reports findings without blocking the pipeline.
        # Remove --soft-fail once critical findings are resolved and
        # enforcement is desired on every merge.
        timeout-minutes: 5
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --compact \
            --quiet \
            --soft-fail
