name: CI - Terraform

# Component pipeline for terraform configuration validation, planning, and security scanning.
# Runs terraform fmt, validate, integration-contract plan artifact generation,
# tflint, and checkov checks.

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'platform/terraform/**'
      - '!**/*.md'
      - '!docs/**'
  push:
    branches:
      - dev
      - main
    paths:
      - 'platform/terraform/**'
      - '!**/*.md'
      - '!docs/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: false
      AWS_ROLE_ARN:
        required: false

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency review (block on HIGH/CRITICAL)
        uses: actions/dependency-review-action@0659a74c94536054bfa5aeb92241f70d680cc78e # V4.3.0
        with:
          fail-on-severity: high

  terraform-lint:
    name: Terraform Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_PLAN_ENV: integration
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        timeout-minutes: 2
        with:
          terraform_version: "~1.10"

      - name: terraform fmt check
        timeout-minutes: 2
        run: terraform fmt -check -recursive

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        timeout-minutes: 2

      - name: terraform init (no backend)
        timeout-minutes: 5
        run: terraform init -backend=false -lockfile=readonly

      - name: Check lockfile is Terraform-authored
        timeout-minutes: 1
        run: python3 ../../scripts/ci/check_terraform_lockfile.py

      - name: terraform validate
        timeout-minutes: 2
        run: terraform validate

      - name: opentofu validate
        timeout-minutes: 2
        run: python3 ../../scripts/ci/run_opentofu_validate_isolated.py --tofu-bin tofu

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Build operable lambda artifacts
        timeout-minutes: 6
        run: bash ../../scripts/ci/build-lambda-artifacts.sh

      - name: terraform validate (operable lambda feature flags)
        timeout-minutes: 2
        env:
          TF_VAR_enable_log_lambda: "true"
          TF_VAR_enable_aml_lambda: "true"
          TF_VAR_enable_sftp_transaction_collector: "true"
          TF_VAR_enable_verification_pipeline: "true"
          TF_VAR_enable_audit_pipeline: "true"
          TF_VAR_enable_aml_pipeline: "true"
          TF_VAR_ses_sender_email: "verification@crm.local"
        run: terraform validate

      - name: opentofu validate (operable lambda feature flags)
        timeout-minutes: 2
        env:
          TF_VAR_enable_log_lambda: "true"
          TF_VAR_enable_aml_lambda: "true"
          TF_VAR_enable_sftp_transaction_collector: "true"
          TF_VAR_enable_verification_pipeline: "true"
          TF_VAR_enable_audit_pipeline: "true"
          TF_VAR_enable_aml_pipeline: "true"
          TF_VAR_ses_sender_email: "verification@crm.local"
        run: python3 ../../scripts/ci/run_opentofu_validate_isolated.py --tofu-bin tofu

      - name: Ensure lockfile stayed Terraform-authored
        timeout-minutes: 1
        run: |
          python3 ../../scripts/ci/check_terraform_lockfile.py
          git diff --exit-code -- .terraform.lock.hcl

      - name: Prepare Terraform plan artifact directory
        timeout-minutes: 1
        run: mkdir -p .tfplan

      - name: Configure AWS credentials for Terraform plan
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Ensure Terraform backend resources exist
        id: terraform_backend
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail

          BACKEND_FILE="env/${TF_PLAN_ENV}.backend.hcl"

          STATE_BUCKET="$(awk -F= '/^[[:space:]]*bucket[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          LOCK_TABLE="$(awk -F= '/^[[:space:]]*dynamodb_table[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"
          BACKEND_REGION="$(awk -F= '/^[[:space:]]*region[[:space:]]*=/{gsub(/["[:space:]]/, "", $2); print $2; exit}' "${BACKEND_FILE}")"

          if [[ -z "${STATE_BUCKET}" || -z "${BACKEND_REGION}" ]]; then
            echo "Failed to parse bucket/region from ${BACKEND_FILE}"
            exit 1
          fi

          if aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "State bucket exists: ${STATE_BUCKET}"
          else
            if [[ "${BACKEND_REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${BACKEND_REGION}"
            else
              aws s3api create-bucket \
                --bucket "${STATE_BUCKET}" \
                --region "${BACKEND_REGION}" \
                --create-bucket-configuration "LocationConstraint=${BACKEND_REGION}"
            fi
            echo "Created state bucket: ${STATE_BUCKET}"
          fi

          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "${STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          if [[ -n "${LOCK_TABLE}" ]]; then
            if aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${BACKEND_REGION}" >/dev/null 2>&1; then
              echo "Lock table exists: ${LOCK_TABLE}"
            else
              aws dynamodb create-table \
                --table-name "${LOCK_TABLE}" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region "${BACKEND_REGION}"
              aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "${BACKEND_REGION}"
              echo "Created lock table: ${LOCK_TABLE}"
            fi
          fi

      - name: terraform init (integration backend)
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && steps.terraform_backend.outcome == 'success' }}
        timeout-minutes: 5
        run: terraform init -reconfigure -backend-config=env/${{ env.TF_PLAN_ENV }}.backend.hcl

      - name: terraform plan (integration contract)
        if: ${{ env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && steps.terraform_backend.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=300s \
            "-var-file=env/${TF_PLAN_ENV}.tfvars" \
            "-out=.tfplan/${TF_PLAN_ENV}.tfplan"
          terraform show -no-color ".tfplan/${TF_PLAN_ENV}.tfplan" > ".tfplan/${TF_PLAN_ENV}.plan.txt"

      - name: Record skipped Terraform plan reason
        if: ${{ !(env.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)) || steps.terraform_backend.outcome != 'success' }}
        timeout-minutes: 1
        run: |
          cat <<'EOF' > .tfplan/README.txt
          Terraform plan was skipped because AWS_ROLE_ARN is not configured for this run
          or this run is from a forked pull request where repository secrets are unavailable,
          or backend bootstrap/permissions checks failed for the configured AWS role.
          Static terraform checks still ran successfully.
          EOF

      - name: Upload Terraform plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.tfplan/
          retention-days: 7

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
        timeout-minutes: 3
        with:
          tflint_version: v0.53.0

      - name: TFLint init (download AWS plugin)
        timeout-minutes: 3
        run: tflint --init

      - name: Run TFLint
        timeout-minutes: 3
        run: tflint --format compact

      - name: Prepare Trivy scan artifact directory
        timeout-minutes: 1
        run: mkdir -p .trivy

      - name: Run Trivy IaC scan (full JSON report)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: .trivy/trivy-iac-report.json
          severity: HIGH,CRITICAL,MEDIUM,LOW
          skip-dirs: .terraform,.infracost,.tfplan,.ci-artifacts
          exit-code: '0'

      - name: Run Trivy IaC scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL
          skip-dirs: .terraform,.infracost,.tfplan,.ci-artifacts
          exit-code: '1'

      - name: Upload Trivy IaC artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-iac-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.trivy/
          retention-days: 7

      - name: Prepare Infracost artifact directory
        timeout-minutes: 1
        run: mkdir -p .infracost

      - name: Set up Infracost
        if: ${{ env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        timeout-minutes: 2
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost report
        if: ${{ env.INFRACOST_API_KEY != '' }}
        timeout-minutes: 5
        run: |
          infracost breakdown --path=. --format=json --out-file=.infracost/infracost-report.json
          infracost breakdown --path=. --format=table --out-file=.infracost/infracost-report.txt

      - name: Record skipped Infracost reason
        if: ${{ env.INFRACOST_API_KEY == '' }}
        timeout-minutes: 1
        run: echo "INFRACOST_API_KEY is not configured; Infracost cost report was skipped." > .infracost/README.txt

      - name: Upload Infracost artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infracost-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/terraform/.infracost/
          retention-days: 7

      - name: Install Checkov
        timeout-minutes: 3
        run: pip install checkov

      - name: Run Checkov (security & compliance scan)
        # CRITICAL and HIGH findings block the pipeline (exit 1).
        # LOW and MEDIUM findings are reported but non-blocking (--soft-fail).
        timeout-minutes: 5
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --output cli \
            --compact \
            --quiet \
            --soft-fail \
            --hard-fail-on CRITICAL,HIGH
