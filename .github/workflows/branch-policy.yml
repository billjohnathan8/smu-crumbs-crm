name: Branch Policy

# Soft-enforces the branch strategy by failing the check when PRs violate
# naming / merge-direction rules.  This is NOT a replacement for GitHub branch
# protection (which we cannot configure in a Classroom org) but gives the same
# signal in the Checks tab.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  branch-policy:
    name: Enforce branch strategy
    runs-on: ubuntu-latest
    steps:
      - name: Check branch policy
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "PR: ${HEAD} -> ${BASE}"
          echo "---"

          # ── helpers ────────────────────────────────────────────────
          fail() {
            echo "::error::$1"
            echo ""
            echo "=========================================="
            echo "BRANCH POLICY VIOLATION"
            echo "=========================================="
            echo "$1"
            echo ""
            echo "See docs/ci/branch-strategy.md for the full branch strategy."
            echo "=========================================="
            exit 1
          }

          # ── component trunk branches ───────────────────────────────
          TRUNKS="frontend user-backend log-backend client-backend transaction-backend xfactor-backend"

          is_trunk() {
            for t in $TRUNKS; do
              [ "$1" = "$t" ] && return 0
            done
            return 1
          }

          # ── Rule A: PRs into main ─────────────────────────────────
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" = "integration" ]; then
              echo "OK: merging '${HEAD}' into main is allowed."
              exit 0
            fi
            fail "Only the 'integration' branch may merge into 'main'. Got: '${HEAD}'."
          fi

          # ── Rule B: PRs into a component trunk ────────────────────
          if is_trunk "$BASE"; then
            fail "Merging into component trunk branches is not allowed by policy. Got: '${HEAD}' -> '${BASE}'."
          fi

          # ── Rule C: PRs into integration ──────────────────────────
          if [ "$BASE" = "integration" ]; then
            if [ "$HEAD" = "dev" ]; then
              echo "OK: merging 'dev' into integration is allowed."
              exit 0
            fi
            fail "Only the 'dev' branch may merge into 'integration'. Got: '${HEAD}'."
          fi

          # ── Fallthrough: unknown base branch ──────────────────────
          echo "INFO: base branch '${BASE}' is not governed by branch policy. Allowing."
          exit 0
