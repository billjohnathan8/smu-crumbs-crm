name: CI - Log Backend

# Component pipeline for the log-backend trunk.
# Runs Python lint + unit tests, plus DB-backed repository integration checks.

on:
  pull_request:
    branches:
      - log-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - log-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-log-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: false
      run-backend-python: true
      run-frontend: false

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=app \
          --cov=lambda_function \
          --cov-branch \
          --cov-fail-under=80 \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/log/build/reports/**
        services/backend/log/build/coverage.xml

  # DB-backed repository coverage against ephemeral PostgreSQL.
  test-db:
    needs: lint
    uses: ./.github/workflows/reusable-test-component-db.yml
    with:
      component: log
      runtime: python
      working-directory: services/backend/log
      test-command: |
        RUN_DB_INTEGRATION_TESTS=true python -m pytest tests/test_repository_postgres_integration.py \
          --junitxml=build/reports/tests/junit-postgres.xml
      timeout-minutes: 10
      artifact-paths: services/backend/log/build/reports/**
