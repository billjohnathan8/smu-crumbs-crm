name: CD - Terraform Bootstrap
description: Setup Terraform backend resources (state bucket, lock table) for prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-terraform-backend:
    name: Bootstrap Terraform backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}

    steps:
      - name: Validate required GitHub configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "${AWS_REGION}" || { echo "Missing required GitHub Actions variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "Missing required GitHub Actions variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "Missing required GitHub Actions variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || { echo "Missing required secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || { echo "Missing required secret: AWS_SECRET_ACCESS_KEY"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure Terraform backend resources exist
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          REGION="${AWS_REGION}"
          BUCKET="${TF_STATE_BUCKET}"
          LOCK_TABLE="${TF_LOCK_DYNAMODB}"

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          bucket_status="existing"
          table_status="existing"

          if aws s3api head-bucket --bucket "${BUCKET}" >/dev/null 2>&1; then
            echo "Terraform state bucket already exists: s3://${BUCKET} (${REGION})"
          else
            if [[ "${REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "${BUCKET}" \
                --region "${REGION}"
            else
              aws s3api create-bucket \
                --bucket "${BUCKET}" \
                --region "${REGION}" \
                --create-bucket-configuration "LocationConstraint=${REGION}"
            fi

            bucket_status="created"
            echo "Created Terraform state bucket: s3://${BUCKET} (${REGION})"
          fi

          if aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Terraform lock table already exists: arn:aws:dynamodb:${REGION}:${ACCOUNT_ID}:table/${LOCK_TABLE}"
          else
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"

            aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "${REGION}"
            table_status="created"
            echo "Created Terraform lock table: arn:aws:dynamodb:${REGION}:${ACCOUNT_ID}:table/${LOCK_TABLE}"
          fi

          {
            echo "bucket_status=${bucket_status}"
            echo "table_status=${table_status}"
            echo "bucket_uri=s3://${BUCKET}"
            echo "table_arn=arn:aws:dynamodb:${REGION}:${ACCOUNT_ID}:table/${LOCK_TABLE}"
            echo "account_id=${ACCOUNT_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish bootstrap summary
        shell: bash
        run: |
          {
            echo "## Terraform Backend Bootstrap Summary"
            echo
            echo "AWS account: ${{ steps.bootstrap.outputs.account_id }}"
            echo "Region: ${AWS_REGION}"
            echo
            echo "S3 state bucket: ${{ steps.bootstrap.outputs.bucket_uri }}"
            echo "Status: ${{ steps.bootstrap.outputs.bucket_status }}"
            echo
            echo "DynamoDB lock table: ${{ steps.bootstrap.outputs.table_arn }}"
            echo "Status: ${{ steps.bootstrap.outputs.table_status }}"
            echo
            if [[ "${{ steps.bootstrap.outputs.bucket_status }}" == "existing" && "${{ steps.bootstrap.outputs.table_status }}" == "existing" ]]; then
              echo "No resources were created. Terraform backend resources already existed in the configured AWS account."
            else
              echo "Created resources:"
              [[ "${{ steps.bootstrap.outputs.bucket_status }}" == "created" ]] && echo "- S3 bucket"
              [[ "${{ steps.bootstrap.outputs.table_status }}" == "created" ]] && echo "- DynamoDB lock table"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
