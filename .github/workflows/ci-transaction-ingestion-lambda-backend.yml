name: CI - Transaction Ingestion Lambda Backend

# Component pipeline for the transaction-ingestion-lambda backend.
# Runs Python Black + Flake8 lint + pytest with coverage.

on:
  pull_request:
    branches:
      - transaction-ingestion-lambda-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - transaction-ingestion-lambda-backend
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-transaction-ingestion-lambda-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      run-backend-java: false
      run-backend-python: true
      run-frontend: false

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test-component.yml
    with:
      component: transaction-ingestion-lambda
      runtime: python
      working-directory: services/backend/transaction-ingestion-lambda
      test-command: |
        python -m pytest tests \
          --junitxml=build/reports/tests/junit.xml \
          --cov=lambda_function \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml:build/reports/coverage/coverage.xml \
          --cov-report=html:build/reports/coverage/html
      timeout-minutes: 8
      artifact-paths: |
        services/backend/transaction-ingestion-lambda/build/reports/**
        services/backend/transaction-ingestion-lambda/build/coverage.xml
