name: CD - Terraform State Unlock
# Manual recovery workflow to clear a stale Terraform state lock for production.

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: Terraform lock ID from the failed run log (Lock Info -> ID)
        required: true
        type: string
      confirm_unlock:
        description: Type unlock-prod-state to confirm manual state unlock
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-tf-infra-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Terraform backend
    uses: ./.github/workflows/cd-tf-bootstrap.yml
    secrets: inherit

  terraform-force-unlock:
    name: Terraform force-unlock (prod)
    needs:
      - bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_DIR: platform/terraform
      DEPLOY_ENV: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_DYNAMODB: ${{ vars.TF_LOCK_DYNAMODB }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate unlock request and GitHub configuration
        env:
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.confirm_unlock }}" == "unlock-prod-state" ]] || {
            echo "confirm_unlock must be exactly unlock-prod-state"
            exit 1
          }

          [[ -n "${{ inputs.lock_id }}" ]] || { echo "lock_id is required"; exit 1; }
          test -n "${AWS_REGION}" || { echo "Missing required GitHub Actions variable: AWS_REGION"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "Missing required GitHub Actions variable: TF_STATE_BUCKET"; exit 1; }
          test -n "${TF_LOCK_DYNAMODB}" || { echo "Missing required GitHub Actions variable: TF_LOCK_DYNAMODB"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID_SECRET:-}" || { echo "Missing required secret: AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY_SECRET:-}" || { echo "Missing required secret: AWS_SECRET_ACCESS_KEY"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform init -input=false -reconfigure -backend-config="env/${DEPLOY_ENV}.backend.hcl"

      - name: Force-unlock stale state lock
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: terraform force-unlock -force "${{ inputs.lock_id }}"

      - name: Publish unlock summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Terraform State Unlock Summary"
            echo
            echo "Environment: prod"
            echo "Region: ${AWS_REGION}"
            echo "Backend bucket: s3://${TF_STATE_BUCKET}"
            echo "Backend lock table: ${TF_LOCK_DYNAMODB}"
            echo "Attempted lock_id: ${{ inputs.lock_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
