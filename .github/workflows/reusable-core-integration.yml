name: Core Integration Tests

# Reusable workflow that validates critical service-to-service behavior before
# deployment gates pass.

on:
  workflow_call:

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home

jobs:
  core-integration:
    name: Core Integration - Cross-Service Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clients
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clients"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        timeout-minutes: 2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/backend/log/requirements.txt

      - name: Install Python dependencies for log-service
        timeout-minutes: 3
        run: pip install -r services/backend/log/requirements.txt

      - name: Run cross-service core integration smoke
        timeout-minutes: 20
        run: bash scripts/ci/run-core-integration-smoke.sh

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-integration-logs
          path: build-logs/core-integration/**
          retention-days: 7
