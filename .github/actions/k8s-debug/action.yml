name: K8s Debug Diagnostics
description: >
  Captures comprehensive Kubernetes diagnostics for debugging deployment failures.
  Outputs pod status, events, describe, and logs for all containers in the target namespace.

inputs:
  namespace:
    description: 'Kubernetes namespace to inspect'
    required: false
    default: 'dev'

runs:
  using: composite
  steps:
    - name: Capture K8s diagnostics
      shell: bash
      env:
        NS: ${{ inputs.namespace }}
      run: |
        echo "========================================="
        echo "K8s Debug Diagnostics - namespace: ${NS}"
        echo "========================================="

        echo ""
        echo "=== Pods across all namespaces ==="
        kubectl get pods -A -o wide || true

        echo ""
        echo "=== Services across all namespaces ==="
        kubectl get svc -A -o wide || true

        echo ""
        echo "=== Ingress across all namespaces ==="
        kubectl get ingress -A -o wide || true

        echo ""
        echo "=== Deployments in namespace: ${NS} ==="
        kubectl get deployments -n "${NS}" -o wide || true

        echo ""
        echo "=== ReplicaSets in namespace: ${NS} ==="
        kubectl get replicasets -n "${NS}" -o wide || true

        echo ""
        echo "=== StatefulSets in namespace: ${NS} ==="
        kubectl get statefulsets -n "${NS}" -o wide || true

        echo ""
        echo "=== Recent events (last 200, sorted by timestamp) ==="
        kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -200 || true

        echo ""
        echo "=== Describe pods in namespace: ${NS} ==="
        kubectl describe pods -n "${NS}" || true

        echo ""
        echo "=== Container logs in namespace: ${NS} (tail 200) ==="
        for pod in $(kubectl get pods -n "${NS}" -o name 2>/dev/null || true); do
          echo "--- Logs for ${pod} ---"
          kubectl logs -n "${NS}" "${pod}" --all-containers --tail=200 || true
          echo ""
        done

        echo ""
        echo "=== Node status ==="
        kubectl get nodes -o wide || true

        echo ""
        echo "=== Node resource usage ==="
        kubectl top nodes || echo "Metrics not available (metrics-server may not be ready)"

        echo ""
        echo "=== Pod resource usage in namespace: ${NS} ==="
        kubectl top pods -n "${NS}" || echo "Metrics not available (metrics-server may not be ready)"

        echo ""
        echo "=== Helm releases ==="
        helm list -A || true

        echo ""
        echo "=== PersistentVolumeClaims in namespace: ${NS} ==="
        kubectl get pvc -n "${NS}" -o wide || true

        echo "========================================="
        echo "End of K8s Debug Diagnostics"
        echo "========================================="
