spring:
  application:
    name: clients-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clients}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}