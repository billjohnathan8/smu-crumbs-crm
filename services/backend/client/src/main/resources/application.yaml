spring:
  application:
    name: client

  cloud:
    aws:
      region:
        static: ${VERIFICATION_EMAIL_AWS_REGION:${AWS_REGION:ap-southeast-1}}

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:crm_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:devpassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate   # keeps Hibernate validating tables after Flyway runs
    show-sql: true        # optional, useful for debugging
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true   # REQUIRED: initializes schema history if schema is non-empty
    baseline-version: 0
    table: client_flyway_schema_history
    locations: classpath:db/migration  # default location for migration scripts

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

server:
  port: 8080

app:
  production-mode: ${APP_PRODUCTION_MODE:false}
  log-service-url: ${CLIENT_LOG_SERVICE_URL:${LOG_SERVICE_URL:http://localhost:4566/_aws/execute-api/local/local}}
  verification:
    sns-topic-arn: ${VERIFICATION_SNS_TOPIC_ARN:}
    documents-bucket: ${VERIFICATION_DOCUMENTS_BUCKET:}
    link-token-ttl-seconds: ${VERIFICATION_LINK_TOKEN_TTL_SECONDS:7200}
  verification-email:
    provider: ${VERIFICATION_EMAIL_PROVIDER:mock}
    sender-email: ${SES_SENDER_EMAIL:}
    aws-region: ${VERIFICATION_EMAIL_AWS_REGION:${AWS_REGION:}}
    aws-endpoint-url: ${VERIFICATION_EMAIL_AWS_ENDPOINT_URL:${AWS_ENDPOINT_URL:}}
    dispatch:
      enabled: ${VERIFICATION_EMAIL_DISPATCH_ENABLED:false}
      poll-interval-ms: ${VERIFICATION_EMAIL_DISPATCH_POLL_INTERVAL_MS:30000}
      max-batch-size: ${VERIFICATION_EMAIL_DISPATCH_MAX_BATCH_SIZE:50}
      max-attempts: ${VERIFICATION_EMAIL_DISPATCH_MAX_ATTEMPTS:5}
      base-backoff-seconds: ${VERIFICATION_EMAIL_DISPATCH_BASE_BACKOFF_SECONDS:30}
      service-token-ttl-seconds: ${VERIFICATION_EMAIL_DISPATCH_SERVICE_TOKEN_TTL_SECONDS:300}
      service-user-id: ${VERIFICATION_EMAIL_DISPATCH_SERVICE_USER_ID:usr_system_verification}
  jwt:
    hmac-secret: ${JWT_HMAC_SECRET:}
    auth-mode: ${AUTH_MODE:local}
    allow-hybrid: ${APP_JWT_ALLOW_HYBRID:false}
    cognito:
      issuer: ${COGNITO_ISSUER:}
      audience: ${COGNITO_AUDIENCE:}
      jwks-url: ${COGNITO_JWKS_URL:}
      jwks-cache-ttl-seconds: ${COGNITO_JWKS_CACHE_TTL_SECONDS:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

