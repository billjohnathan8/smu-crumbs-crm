plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.scroogebank.crm'
version = '0.0.1-SNAPSHOT'
description = 'client service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
}

dependencies {
	constraints {
		implementation('com.fasterxml.jackson.core:jackson-core:2.21.1') {
			because 'Fix GHSA-72hv-8253-57qq in jackson-core 2.x branch'
		}
		implementation('tools.jackson.core:jackson-core:3.1.0') {
			because 'Fix CVE-2026-29062 and GHSA-72hv-8253-57qq in jackson-core 3.x branch'
		}
	}

	implementation platform('software.amazon.awssdk:bom:2.31.49')
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.0.0')
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'software.amazon.awssdk:sesv2'
	implementation 'software.amazon.awssdk:sns'
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
	testImplementation 'org.springframework.boot:spring-boot-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
	toolVersion = '10.21.4'
	configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.withType(Checkstyle).configureEach {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('test') {
	useJUnitPlatform {
		// Exclude integration tests (need Docker) by default. Run all tests: ./gradlew test -PincludeIntegration=true
		if (project.findProperty('includeIntegration') != 'true') {
			excludeTags 'integration'
		}
	}
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')
	violationRules {
		rule {
			limit {
				minimum = 0.80
			}
		}
	}
}

tasks.named('assemble') {
	mustRunAfter tasks.named('checkstyleMain'), tasks.named('checkstyleTest')
}

tasks.named('test') {
	mustRunAfter tasks.named('assemble')
}

tasks.named('jacocoTestReport') {
	mustRunAfter tasks.named('test')
}

tasks.named('bootJar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('localTestPipeline') {
	group = 'verification'
	description = 'Runs lint, build, tests, and coverage reports for local CI.'
	dependsOn 'checkstyleMain', 'checkstyleTest', 'assemble', 'test', 'jacocoTestReport', 'jacocoTestCoverageVerification'
}
