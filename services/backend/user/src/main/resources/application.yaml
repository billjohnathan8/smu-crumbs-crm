spring:
  application:
    name: user

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:crm_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:devpassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: user_flyway_schema_history
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

app:
  production-mode: ${APP_PRODUCTION_MODE:false}
  jwt:
    hmac-secret: ${JWT_HMAC_SECRET:}
    auth-mode: ${AUTH_MODE:local}
    allow-hybrid: ${APP_JWT_ALLOW_HYBRID:false}
    cognito:
      issuer: ${COGNITO_ISSUER:}
      audience: ${COGNITO_AUDIENCE:}
      jwks-url: ${COGNITO_JWKS_URL:}
      jwks-cache-ttl-seconds: ${COGNITO_JWKS_CACHE_TTL_SECONDS:300}
  root-admin:
    email: ${ROOT_ADMIN_EMAIL:admin@crm.com}
    password: ${ROOT_ADMIN_PASSWORD:}
  user-store:
    type: ${APP_USER_STORE_TYPE:postgres}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

