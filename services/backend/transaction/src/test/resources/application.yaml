spring:
  datasource:
    url: jdbc:h2:mem:transaction-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  client-service-url: http://localhost:8080
  log-service-url: http://localhost:4566/_aws/execute-api/local/local
  jwt:
    hmac-secret: test-only-secret
  mock-sftp:
    root: ./mock-sftp
  transactions-store:
    type: in-memory
