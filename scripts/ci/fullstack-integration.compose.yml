services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm_it
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_it"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4
    ports:
      - "14566:4566"
    environment:
      - SERVICES=sqs,dynamodb,s3,lambda,sns,ses,secretsmanager,apigateway,apigatewayv2
      - DEFAULT_REGION=ap-southeast-1
      - AWS_DEFAULT_REGION=ap-southeast-1
      # local executor: simpler, no Docker-in-Docker needed in CI
      - LAMBDA_EXECUTOR=local
    volumes:
      - "../../platform/localstack/init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent-service:
    build:
      context: ../../services/backend/agent
      dockerfile: Dockerfile
    environment:
      JWT_HMAC_SECRET: dev-only-insecure-secret
      ROOT_ADMIN_EMAIL: admin@crm.local
      ROOT_ADMIN_PASSWORD: admin123
    ports:
      - "18081:8080"

  client-service:
    build:
      context: ../../services/backend/client
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crm_it
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Lambda-backed log API endpoint (provisioned by run-fullstack-integration-e2e.sh)
      CLIENT_LOG_SERVICE_URL: ${CLIENT_LOG_SERVICE_URL}
      JWT_HMAC_SECRET: dev-only-insecure-secret
      VERIFICATION_EMAIL_PROVIDER: ses
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-verification@crm.local}
      VERIFICATION_EMAIL_AWS_REGION: ap-southeast-1
      VERIFICATION_EMAIL_AWS_ENDPOINT_URL: http://localstack:4566
      VERIFICATION_EMAIL_DISPATCH_POLL_INTERVAL_MS: "5000"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "18082:8080"

  transaction-service:
    build:
      context: ../../services/backend/transaction
      dockerfile: Dockerfile
    environment:
      CLIENT_SERVICE_URL: http://client-service:8080
      JWT_HMAC_SECRET: dev-only-insecure-secret
      TRANSACTION_SFTP_POLL_ENABLED: "true"
      TRANSACTION_SFTP_POLL_FIXED_DELAY_MS: "5000"
      TRANSACTION_SFTP_POLL_INITIAL_DELAY_MS: "2000"
      TRANSACTION_IMPORT_S3_BUCKET: scroogebank-crm-dev-transaction-sftp
      TRANSACTION_IMPORT_S3_REGION: ap-southeast-1
      TRANSACTION_IMPORT_S3_ENDPOINT: http://localstack:4566
      TRANSACTION_IMPORT_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      TRANSACTION_IMPORT_S3_ACCESS_KEY_ID: test
      TRANSACTION_IMPORT_S3_SECRET_ACCESS_KEY: test
    depends_on:
      client-service:
        condition: service_started
    ports:
      - "18083:8080"

  frontend:
    build:
      context: ../../services/frontend/crm-ui
      dockerfile: Dockerfile
    environment:
      # Keep /api owned by integration-gateway in this topology.
      FRONTEND_API_UPSTREAM: ""
    ports:
      - "18085:80"

  integration-gateway:
    image: nginx:1.27-alpine
    environment:
      # Used by nginx template rendering to target the LocalStack HTTP API
      LOG_API_UPSTREAM: ${LOG_API_UPSTREAM}
    depends_on:
      - frontend
      - agent-service
      - client-service
      - transaction-service
      - localstack
    volumes:
      - ./fullstack-gateway.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "18088:80"
