repos:
  # --- Python: Black ---
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: Black (Log Service)
        files: ^services/backend/log/(app|tests)/.*\.py$
        args: [--config, services/backend/log/pyproject.toml]
        stages: [pre-commit]

      - id: black
        name: Black (AML Service)
        files: ^services/backend/aml/.*\.py$
        args: [--config, services/backend/aml/pyproject.toml]
        stages: [pre-commit]

  # --- Python: Flake8 ---
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: Flake8 (Log Service)
        files: ^services/backend/log/(app|tests)/.*\.py$
        args: ["--max-line-length=100", "--extend-ignore=E501,E203,W503"]
        stages: [pre-commit]

      - id: flake8
        name: Flake8 (AML Service)
        files: ^services/backend/aml/.*\.py$
        args: ["--max-line-length=100", "--extend-ignore=E501,E203,W503"]
        stages: [pre-commit]

  # --- Frontend: Prettier (uses package.json versions) ---
  - repo: local
    hooks:
      - id: eslint-frontend
        name: ESLint (Frontend)
        entry: cmd /c "cd services/frontend/crm-ui && npm run lint"
        language: system
        files: ^services/frontend/crm-ui/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        stages: [pre-commit]

      - id: prettier-frontend
        name: Prettier (Frontend)
        entry: cmd /c "cd services/frontend/crm-ui && npm run format:check"
        language: system
        files: ^services/frontend/crm-ui/src/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck-frontend
        name: TypeScript Typecheck (Frontend)
        entry: cmd /c "cd services/frontend/crm-ui && npm run typecheck"
        language: system
        files: ^services/frontend/crm-ui/
        pass_filenames: false
        stages: [pre-commit]

  # --- OpenAPI: Spectral ---
  - repo: local
    hooks:
      - id: spectral-openapi
        name: Spectral (OpenAPI)
        entry: npx --yes @stoplight/spectral-cli lint --fail-severity error
        language: system
        files: ^docs/api-contracts/openapi/.*\.yaml$
        stages: [pre-commit]

  # --- Java: Checkstyle (all services) ---
  - repo: local
    hooks:
      - id: java-checkstyle-agent
        name: Checkstyle (Agent)
        entry: cmd /c "cd services\backend\agent && gradlew.bat checkstyleMain checkstyleTest --no-daemon --console=plain"
        language: system
        files: ^services/backend/agent/src/.*\.java$
        pass_filenames: false
        stages: [pre-push]

      - id: java-checkstyle-client
        name: Checkstyle (Client)
        entry: cmd /c "cd services\backend\client && gradlew.bat checkstyleMain checkstyleTest --no-daemon --console=plain"
        language: system
        files: ^services/backend/client/src/.*\.java$
        pass_filenames: false
        stages: [pre-push]

      - id: java-checkstyle-transaction
        name: Checkstyle (Transaction)
        entry: cmd /c "cd services\backend\transaction && gradlew.bat checkstyleMain checkstyleTest --no-daemon --console=plain"
        language: system
        files: ^services/backend/transaction/src/.*\.java$
        pass_filenames: false
        stages: [pre-push]