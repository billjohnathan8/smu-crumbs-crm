repos:
  # --- Python: Black & Flake8 ---
  - repo: https://github.com/psf/black
    rev: 24.10.0 
    hooks:
      - id: black
        files: ^services/backend/log/
        stages: [pre-commit]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--ignore=E501,E203"]
        files: ^services/backend/log/
        stages: [pre-commit]

  # --- Frontend: Prettier & ESLint ---
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: bash -c "cd services/frontend/crm-ui && npx prettier --write 'src/**/*.{ts,tsx,js,jsx,json,css,md}'"
        language: system
        files: ^services/frontend/crm-ui/
        stages: [pre-commit]

  # --- Java: Checkstyle ---
  # Note: Java is heavier, so we often call the local gradlew script
  - repo: local
    hooks:
      - id: java-checkstyle
        name: Java Checkstyle
        entry: bash -c "cd services/backend/client && ./gradlew checkstyleMain"
        language: system
        files: \.java$
        stages: [pre-push]