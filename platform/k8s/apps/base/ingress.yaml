apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          # API routes must come BEFORE frontend root path
          # Order matters in ingress rules
          - path: /api/agents
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 80
          - path: /api/clients
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
          - path: /api/logs
            pathType: Prefix
            backend:
              service:
                name: log
                port:
                  number: 80
          - path: /api/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction
                port:
                  number: 80
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 80
          - path: /api/accounts
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: log
                port:
                  number: 80
          # Frontend route - MUST be last to catch all remaining paths
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

