apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: crm
  labels:
    app: frontend
    component: ui
data:
  # Environment variables for frontend
  # In production, API calls go through same-origin ingress
  # so no API_BASE_URL needed (relative paths work)
  APP_NAME: "CRM UI"
  APP_VERSION: "1.0.0"
