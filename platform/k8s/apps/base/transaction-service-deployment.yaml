apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: transaction-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MOCK_SFTP_ROOT
              value: /app/mock-sftp
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: mock-sftp
              mountPath: /app/mock-sftp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mock-sftp
          configMap:
            name: transaction-service-mock-sftp

