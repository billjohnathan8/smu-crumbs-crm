apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction
  template:
    metadata:
      labels:
        app: transaction
    spec:
      containers:
        - name: transaction
          image: transaction:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MOCK_SFTP_ROOT
              value: /app/mock-sftp
            - name: CLIENT_SERVICE_URL
              value: http://client.dev.svc.cluster.local
            - name: JWT_ISSUER
              value: "http://agent.dev.svc.cluster.local"
            - name: JWT_AUDIENCE
              value: "crm"
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: public.pem
                  optional: true
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: private.pem
                  optional: true
            - name: SFTP_ENABLED
              value: "false"
            - name: SFTP_HOST
              value: "sftp.local"
            - name: SFTP_PORT
              value: "22"
            - name: SFTP_USERNAME
              value: "user"
            - name: SFTP_PASSWORD
              value: "change-me"
            - name: SFTP_REMOTE_PATH
              value: "/transactions.csv"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: mock-sftp
              mountPath: /app/mock-sftp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: mock-sftp
          configMap:
            name: transaction-mock-sftp
---
apiVersion: v1
kind: Service
