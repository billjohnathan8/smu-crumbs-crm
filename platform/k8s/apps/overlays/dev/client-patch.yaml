apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: dev
spec:
  template:
    spec:
      containers:
        - name: client
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-postgresql.dev.svc.cluster.local:5432/cs301
            - name: SPRING_DATASOURCE_USERNAME
              value: cs301
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-postgresql
                  key: password
            - name: LOG_SERVICE_URL
              value: http://log.dev.svc.cluster.local/api/v1/logs
