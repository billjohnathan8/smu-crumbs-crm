apiVersion: apps/v1
kind: Deployment
metadata:
  name: log
  namespace: dev
spec:
  template:
    spec:
      containers:
        - name: log
          env:
            - name: DB_HOST
              value: postgres-postgresql.dev.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: cs301
            - name: DB_USER
              value: cs301
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-postgresql
                  key: password
