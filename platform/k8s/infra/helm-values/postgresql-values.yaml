# PostgreSQL Helm chart configuration for local development
# Addresses Bitnami warnings about image tags, resources, and security

# Image configuration - use latest for local development
image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: "latest"  # Use latest for local dev to ensure image availability
  pullPolicy: IfNotPresent

volumePermissions:
  enabled: false  # Disabled for local dev since persistence is disabled

# Authentication configuration
auth:
  username: cs301
  password: cs301_local_dev_pw  # Explicit password for local dev
  database: cs301
  # For production: use existingSecret instead of plaintext password

# Primary database configuration
primary:
  # Disable persistence for local dev (faster cleanup, less disk usage)
  persistence:
    enabled: false

  # Resource limits - prevents unbounded resource consumption
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Disable metrics for local dev
metrics:
  enabled: false
