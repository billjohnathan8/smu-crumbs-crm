apiService:
  create: true

global:
  security:
    allowInsecureImages: true

image:
  registry: registry.k8s.io
  repository: metrics-server/metrics-server
  tag: v0.8.0

# Official metrics-server image binary path.
command:
  - /metrics-server

# kind/local clusters commonly need relaxed kubelet TLS for metrics scraping.
extraArgs:
  - --cert-dir=/tmp
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
