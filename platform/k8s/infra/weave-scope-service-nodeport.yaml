apiVersion: v1
kind: Service
metadata:
  name: weave-scope-app
  namespace: weave
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 4040
      nodePort: 30084
  selector:
    app: weave-scope
    name: weave-scope-app
    weave-cloud-component: scope
    weave-scope-component: app
