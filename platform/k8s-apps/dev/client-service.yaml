apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-service
  template:
    metadata:
      labels:
        app: client-service
    spec:
      containers:
        - name: client-service
          image: client-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LOG_SERVICE_URL
              value: http://log-service.dev.svc.cluster.local/api/v1/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: dev
spec:
  selector:
    app: client-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
