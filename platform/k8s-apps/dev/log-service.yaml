apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-service
  template:
    metadata:
      labels:
        app: log-service
    spec:
      containers:
        - name: log-service
          image: log-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres-postgresql
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: cs301
            - name: DB_USER
              value: cs301
            - name: DB_PASSWORD
              value: cs301pass
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: log-service
  namespace: dev
spec:
  selector:
    app: log-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
