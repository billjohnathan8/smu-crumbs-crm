# docker-compose.localstack.yml
#
# Local development stack for the ScroogeBank CRM event-driven pipeline.
#
# What runs here:
#   - LocalStack  — emulates SQS, DynamoDB, S3, Lambda, SNS, SES, Secrets Manager
#   - PostgreSQL  — local DB for the Spring Boot services
#
# What is NOT replicated locally (see docs/infrastructure/localstack-setup.md):
#   VPC, NAT Gateway, ALB, CloudFront, WAF, ACM, Route53, CloudTrail, ECS Fargate
#
# Usage:
#   docker compose -f docker-compose.localstack.yml up -d
#   docker compose -f docker-compose.localstack.yml down -v   # full teardown

services:
  localstack:
    image: localstack/localstack:4
    container_name: localstack
    ports:
      - "4566:4566" # All LocalStack services share one gateway port
    environment:
      - SERVICES=sqs,dynamodb,s3,lambda,sns,ses,secretsmanager
      - DEFAULT_REGION=ap-southeast-1
      - AWS_DEFAULT_REGION=ap-southeast-1
      # LAMBDA_EXECUTOR=local runs Lambda invocations as subprocesses inside
      # the LocalStack container. No Docker socket required, and avoids the
      # 4+ minute Docker executor init delay on Windows/Docker Desktop that
      # prevents ready.d/ init scripts from running before the poll times out.
      - LAMBDA_EXECUTOR=local
    volumes:
      # Scripts in ready.d/ are executed automatically once LocalStack is healthy.
      - "./platform/localstack/init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-crm}
      POSTGRES_USER: ${LOCAL_DB_USER:-crm_app}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-devpassword}
    volumes:
      - crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-crm_app} -d ${LOCAL_DB_NAME:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-sftp:
    image: atmoz/sftp:latest
    container_name: crm-mock-sftp
    ports:
      - "2222:22"
    command: "mockuser:mockpass:1001:::upload"
    volumes:
      - "./services/backend/transaction/mock-sftp:/home/mockuser/upload:ro"
    healthcheck:
      test: ["CMD-SHELL", "ls /home/mockuser/upload >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm-pgdata:
